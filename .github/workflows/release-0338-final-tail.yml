name: Verify immutable 0.3.3.8 remaining regression gates

on:
  workflow_dispatch:
  push:
    branches: [review/release-0338-final-tail]

permissions:
  contents: read
  actions: read

jobs:
  remaining-regressions:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out diagnostic-only check source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Receive unchanged final candidate, fixtures and UI
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/receive-release-0338-final-candidate.ps1
      - name: Restore and compile strict check assemblies
        run: |
          dotnet restore TogetherServer.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked check restore failed.' }
          dotnet build checks/TogetherServer.CompanionChecks/TogetherServer.CompanionChecks.csproj -c Release --no-restore -p:CodeOnlyVerification=true -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Strict diagnostic check compilation failed.' }
      - name: Complete remaining Existing stages against retained executable
        run: |
          # Explicit isolated hosted opt-in. Never run these checks on the owner's active desktop.
          $ErrorActionPreference = 'Stop'
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $expected = '5f0032eec7a469ee42a6210902e1f85878b015e4355d5c7379a85d8a4172dac4'
          $context = Get-Content local-data/ci-evidence/0338-final-source/candidate-context.json -Raw | ConvertFrom-Json
          if ($context.sourceRevision -cne 'b7bb03d423e1bc2ad7f238929aac623415659bf8' -or
              $context.verificationRevision -cne $env:GITHUB_SHA -or $context.candidateSha256 -cne $expected) {
            throw 'Retained final candidate context differs.'
          }
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/0338-final-tail -Force
          $checks = [Collections.Generic.List[object]]::new()
          function Invoke-RetainedCheck([string]$Name, [scriptblock]$Action) {
            $outcome = 'failed'
            $started = [DateTime]::UtcNow
            try {
              if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'Frozen EXE changed before a check.' }
              $global:LASTEXITCODE = 0
              & $Action
              if ($LASTEXITCODE -ne 0) { throw "Check exited $LASTEXITCODE." }
              $outcome = 'passed'
            } catch {
              Write-Host "FAIL $Name : $($_.Exception.Message)"
            } finally {
              $checks.Add(@{name=$Name;outcome=$outcome;elapsedSeconds=([DateTime]::UtcNow-$started).TotalSeconds})
              @{sourceRevision=$context.sourceRevision;verificationRevision=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;
                candidateRunId=$context.candidateRunId;candidateArtifactId=$context.candidateArtifactId;
                candidateSha256=(Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant();
                expectedChecks=10;checks=@($checks.ToArray());originalFailurePreserved=$true;
                fullyAccepted=$false;nativeNotificationVerified=$false;realPcAccepted=$false;realGameAccepted=$false} |
                ConvertTo-Json -Depth 6 | Set-Content (Join-Path $evidence.FullName 'report.json') -Encoding utf8
            }
          }
          $runner = 'checks/TogetherServer.CompanionChecks/bin/Release/net10.0-windows/TogetherServer.CompanionChecks.dll'
          Invoke-RetainedCheck 'Shared Worlds packaged journey' { dotnet $runner $candidate --shared-world-journey }
          Invoke-RetainedCheck 'Staging LiveSave owner action' { dotnet $runner $candidate --live-save-action }
          Invoke-RetainedCheck 'Shared LiveSave packaged transfer journey' { dotnet $runner $candidate --shared-live-transfer-journey }
          Invoke-RetainedCheck 'TogetherServer.CompanionChecks' { dotnet $runner $candidate }
          Invoke-RetainedCheck 'Solution formatting' { dotnet format TogetherServer.slnx --verify-no-changes --no-restore }
          Invoke-RetainedCheck 'Packaged served smoke' { & checks/served-smoke.ps1 -AppPath $candidate }
          Invoke-RetainedCheck 'Production plus staging isolation smoke' { & checks/staging-smoke.ps1 -AppPath $candidate }
          Invoke-RetainedCheck 'Packaged hidden desktop smoke' { & checks/desktop-smoke.ps1 -AppPath $candidate -Port 0 -AllowInteractiveTests }
          Invoke-RetainedCheck 'Packaged interactive desktop smoke' { & checks/desktop-smoke.ps1 -AppPath $candidate -Port 0 -Interactive -AllowInteractiveTests }
          Invoke-RetainedCheck 'Update handoff smoke' { & checks/update-handoff-smoke.ps1 -AppPath $candidate -AllowInteractiveTests }
          if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'Final candidate bytes changed.' }
          if ($checks.Count -ne 10 -or @($checks | Where-Object outcome -ne passed).Count) { throw 'One or more remaining regression gates failed; retained report includes each outcome.' }
      - name: Retain regression continuation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-0338-final-tail-evidence
          path: local-data/ci-evidence/
          if-no-files-found: error
          retention-days: 7
