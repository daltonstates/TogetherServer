name: Finish immutable 0.3.3 candidate

on:
  push:
    branches: ['review/release-033-continuation']

permissions:
  contents: read
  actions: read

concurrency:
  group: release-033-continuation-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE_SOURCE_REVISION: a6323e99288f3f73b92a32772c0fb847ebd8b2cb
  CANDIDATE_SHA256: c09a4d086145475ff94def32ca7aa95aa1ad260d8edf074e3eb83d36e03280cb
  ORIGINAL_RUN_ID: '39451718957'
  CANDIDATE_ARTIFACT_ID: '12277888264'
  CANDIDATE_ARTIFACT_DIGEST: sha256:0e8da457ef17bb45e8135e90a2e11bf1c432fcadc4824515e19ffd3f92d87ba7

jobs:
  remaining:
    name: Complete remaining Existing acceptance
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    outputs:
      evidence-id: ${{ steps.evidence.outputs.artifact-id }}
      evidence-digest: sha256:${{ steps.evidence.outputs.artifact-digest }}
    steps:
      - name: Check out the bounded verification correction
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Verify source, original jobs and every pinned evidence archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = $env:CANDIDATE_SOURCE_REVISION
          $hash = $env:CANDIDATE_SHA256
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/continuation-033 -Force
          git merge-base --is-ancestor $revision HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Verification must descend from the compiled candidate.' }
          $changed = @(git diff --no-renames --name-only $revision HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Source comparison failed.' }
          $allowed = @('docs/38-0.3.3-RELEASE.md',
            'checks/TogetherServer.CompanionChecks/SharedWorldResolutionJourney.cs',
            '.github/workflows/release-033-continuation.yml')
          if (@($changed | Where-Object { $_ -notin $allowed }).Count -or
              'checks/TogetherServer.CompanionChecks/SharedWorldResolutionJourney.cs' -notin $changed) {
            throw 'Only the specific resolution fixture, release record and this workflow may differ from the candidate.'
          }
          git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source whitespace failed.' }
          $headers = @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $api = 'https://api.github.com/repos/daltonstates/TogetherServer'
          $artifactProofs = [Collections.Generic.List[object]]::new()
          function Get-PinnedArchive([long]$Id, [string]$Name, [string]$Digest) {
            $artifact = Invoke-RestMethod -Uri "$api/actions/artifacts/$Id" -Headers $headers
            if ($artifact.id -ne $Id -or $artifact.name -ne $Name -or $artifact.expired -ne $false -or
                $artifact.workflow_run.id -ne 39451718957 -or $artifact.workflow_run.head_sha -ne $revision -or
                $artifact.digest -ne "sha256:$Digest" -or $artifact.size_in_bytes -gt 200MB) { throw "Original artifact identity mismatch: $Name." }
            $zip = Join-Path $env:RUNNER_TEMP ("original-033-$Id.zip")
            Invoke-WebRequest -Uri "$api/actions/artifacts/$Id/zip" -Headers $headers -OutFile $zip
            if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $Digest) { throw "Original ZIP digest mismatch: $Name." }
            $destination = if ($Name -eq 'windows-candidate') { (Get-Location).Path } else { Join-Path (Get-Location) "local-data/original-033/$Id" }
            Expand-Archive -LiteralPath $zip -DestinationPath $destination
            $artifactProofs.Add(@{id=$Id;name=$Name;digest=$artifact.digest;sourceRevision=$revision;runId=39451718957;bytes=$artifact.size_in_bytes})
            return $destination
          }
          function Read-OneJson([string]$Root, [string]$Name) {
            $files = @(Get-ChildItem -LiteralPath $Root -File -Recurse -Filter $Name)
            if ($files.Count -ne 1 -or $files[0].Length -gt 8MB) { throw "One bounded $Name is required." }
            return Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          }
          function Assert-GateReport($Report, [string]$Suite, [string[]]$Names, [bool]$FailedShared = $false) {
            if ($Report.suite -ne $Suite -or $Report.candidate.sourceRevision -ne $revision -or
                $Report.candidate.sha256 -ne $hash -or $Report.candidate.productVersion -ne "0.3.3+$revision" -or
                $Report.candidate.authenticode -ne 'NotSigned' -or @($Report.checks).Count -ne $Names.Count -or
                (@($Report.checks.name) -join '|') -ne ($Names -join '|')) { throw "Original $Suite report identity or inventory mismatch." }
            foreach ($check in $Report.checks) {
              $expected = if ($FailedShared -and $check.name -eq 'Shared Worlds packaged journey') { 'failed' } else { 'passed' }
              if ($check.outcome -ne $expected) { throw "Unexpected original $Suite outcome: $($check.name)." }
            }
          }
          try {
            $run = Invoke-RestMethod -Uri "$api/actions/runs/39451718957" -Headers $headers
            $response = Invoke-RestMethod -Uri "$api/actions/runs/39451718957/jobs?filter=all&per_page=100" -Headers $headers
            $jobs = @($response.jobs)
            if ($run.id -ne 39451718957 -or $run.head_sha -ne $revision -or $run.run_attempt -ne 1 -or
                $run.workflow_id -ne 367811679 -or $run.path -ne '.github/workflows/windows-ci.yml' -or $run.event -ne 'push' -or
                $response.total_count -ne $jobs.Count -or $jobs.Count -notin 12,13) { throw 'Original run or job inventory mismatch.' }
            $completed = @(
              @{id=118727977239;name='candidate';steps=@('Build one candidate and its synthetic fixtures','Share the exact candidate with isolated test runners')},
              @{id=118729013559;name='Verify Browser';steps=@('Verify the exact candidate on this dedicated runner','Preserve QoL screenshots and validation summaries')},
              @{id=118729013206;name='Verify QolApi';steps=@('Verify the exact candidate on this dedicated runner','Preserve QoL screenshots and validation summaries')},
              @{id=118729013233;name='Verify Rehearsal';steps=@('Verify the exact candidate on this dedicated runner','Preserve QoL screenshots and validation summaries')},
              @{id=118729013780;name='Verify local pairing and both-ended UX';steps=@('Build only the dispatcher and its source dependencies','Verify loopback, assigned LAN and actual two-ended UX with the same candidate','Preserve only redacted local pairing reports and masked UX screenshots')},
              @{id=118729013489;name='Verify 0.3.0 compatibility'},
              @{id=118729013303;name='Verify 0.3.1 compatibility'},
              @{id=118729013104;name='Verify 0.3.2 compatibility'},
              @{id=118729013190;name='Verify 0.3.2.1 compatibility'},
              @{id=118729013538;name='Verify 0.3.2.2 compatibility'}
            )
            $allowedNames = @($completed.name) + @('Verify Existing','Verify Desktop','Package verified release')
            if (@($jobs | Where-Object { $_.name -notin $allowedNames -or $_.run_id -ne 39451718957 -or
                $_.run_attempt -ne 1 -or $_.head_sha -ne $revision }).Count -or
                @($jobs.name | Select-Object -Unique).Count -ne $jobs.Count) { throw 'Unexpected original job or attempt.' }
            foreach ($expected in $completed) {
              $job = @($jobs | Where-Object id -eq $expected.id)
              if ($job.Count -ne 1 -or $job[0].name -ne $expected.name -or $job[0].status -ne 'completed' -or
                  $job[0].conclusion -ne 'success') { throw "Completed original job mismatch: $($expected.name)." }
              $steps = if ($expected.name -like 'Verify * compatibility') {
                @('Fetch and verify the exact published legacy app','Test both old and new Host/Friend role directions',
                  'Verify the published legacy app can update to this exact candidate','Preserve mixed-version evidence')
              } else { $expected.steps }
              foreach ($name in $steps) {
                $step = @($job[0].steps | Where-Object name -eq $name)
                if ($step.Count -ne 1 -or $step[0].status -ne 'completed' -or $step[0].conclusion -ne 'success') { throw "Original completed step mismatch: $name." }
              }
            }
            $existing = @($jobs | Where-Object id -eq 118729013138)
            $desktop = @($jobs | Where-Object id -eq 118729014068)
            if ($existing.Count -ne 1 -or $existing[0].name -ne 'Verify Existing' -or $existing[0].status -ne 'completed' -or
                $existing[0].conclusion -ne 'failure' -or $desktop.Count -ne 1 -or $desktop[0].name -ne 'Verify Desktop') {
              throw 'The original failed Existing job or pending Desktop identity changed.'
            }
            foreach ($expected in @(@{name='Verify the exact candidate on this dedicated runner';outcome='failure'},
                @{name='Preserve QoL screenshots and validation summaries';outcome='success'})) {
              $step = @($existing[0].steps | Where-Object name -eq $expected.name)
              if ($step.Count -ne 1 -or $step[0].status -ne 'completed' -or $step[0].conclusion -ne $expected.outcome) { throw 'Original Existing failure step changed.' }
            }
            $null = Get-PinnedArchive 12277888264 'windows-candidate' '0e8da457ef17bb45e8135e90a2e11bf1c432fcadc4824515e19ffd3f92d87ba7'
            $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
            if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -ne $hash -or
                (Get-Item -LiteralPath $candidate).VersionInfo.ProductVersion -ne "0.3.3+$revision" -or
                (Get-AuthenticodeSignature -LiteralPath $candidate).Status -ne 'NotSigned') { throw 'Immutable candidate identity mismatch.' }
            $common = @('Git whitespace check','Desktop diagnostic isolation','Check runner listener identity')
            $existingRoot = Get-PinnedArchive 12280180592 'qol-windows-evidence-Existing' '6490228096028efeb660043f1916b1d912f2991c1fde4620fdcb2cb263c9557c'
            $existingNames = $common + @('UI lint','UI unit tests','Locked application restore',
              'TogetherServer.Checks','TogetherServer.ValheimChecks','TogetherServer.FactorioChecks','TogetherServer.TerrariaChecks',
              'TogetherServer.MinecraftChecks','TogetherServer.MinecraftSetupChecks','TogetherServer.CustomChecks','TogetherServer.SharedHistoryChecks',
              'TogetherServer.UpdateChecks','Core remote journey','World-load packaged rehearsal','Shared Worlds packaged journey')
            $partial = Read-OneJson $existingRoot 'release-gate-report.json'
            Assert-GateReport $partial 'Existing' $existingNames $true
            $partial | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence.FullName 'prior-existing-report.json') -Encoding utf8
            foreach ($spec in @(
                @{id=12277709069;name='Browser';digest='12aa2d2747812eb0f6828d9970bc9b0b89496d11282f6280db93b471ddf27e74';checks=@('QoL bundled browser journeys')},
                @{id=12277844025;name='QolApi';digest='3c38d9cf9468646a7d97006e6120fece42d557c07babf8be84b18d0a504c06cf';checks=@('TogetherServer.FeatureChecks','QoL packaged API journey')},
                @{id=12279551987;name='Rehearsal';digest='001bcda73eccdc682b01140de57c15627a10681f8289f2b7ffd4260a8019b678';checks=@('Remote rehearsal diagnostic journey')}
            )) {
              $root = Get-PinnedArchive $spec.id ("qol-windows-evidence-" + $spec.name) $spec.digest
              $report = Read-OneJson $root 'release-gate-report.json'
              Assert-GateReport $report $spec.name ($common + $spec.checks)
              $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence.FullName ("prior-" + $spec.name + '-report.json')) -Encoding utf8
              if ($spec.name -eq 'Browser') {
                $browser = Read-OneJson $root 'qol-browser-report.json'
                if ($browser.candidateSha256 -ne $hash -or $browser.outcome -ne 'passed' -or
                    @($browser.journeys).Count -ne 17 -or @($browser.journeys | Where-Object outcome -eq 'passed').Count -ne 14 -or
                    @($browser.journeys | Where-Object outcome -eq 'unexercised').Count -ne 3 -or
                    @($browser.browserErrors).Count -or @($browser.failedRequests).Count) { throw 'Original browser inventory failed.' }
              }
            }
            foreach ($spec in @(
                @{id=12277803880;version='0.3.0';digest='6baf9e34fd978dadb49639d075be3498d677e5da71fa6d2989d32f60b1784666'},
                @{id=12279601973;version='0.3.1';digest='5a0749f73a972581520cc89f710b22a791d5e7d59ded34bc55902acaba601e9b'},
                @{id=12279625661;version='0.3.2';digest='4b77e129379ae2ae43ad9c11dca118b5aff657d8bcd53910600ef857a977c207'},
                @{id=12278538108;version='0.3.2.1';digest='e169b8c77fe8397d6c9ad3353ef7564df1fcb0f8a089acca0e1371a8e00064fc'},
                @{id=12278443305;version='0.3.2.2';digest='4604aaa0f11ea9ba91e25f79f6c2d953585a70330e3ae11e0378e1d2fba88b64'}
            )) {
              $root = Get-PinnedArchive $spec.id ("mixed-version-evidence-" + $spec.version) $spec.digest
              $logs = @(Get-ChildItem -LiteralPath $root -File -Recurse -Filter journey.log)
              if ($logs.Count -ne 1) { throw 'Original mixed-version log is ambiguous.' }
              $text = Get-Content -LiteralPath $logs[0].FullName -Raw
              $summary = "Mixed-version journey: both $($spec.version)/0.3.3 role directions passed. Synthetic loopback only; no real Friend-network or game acceptance."
              if (@(Select-String -LiteralPath $logs[0].FullName -SimpleMatch $summary).Count -ne 1 -or
                  @([regex]::Matches($text, '(?m)^PASS (?:new-host-old-friend|old-host-new-friend):')).Count -ne 6 -or
                  $text -match '(?m)^\s*(?:FAIL|SKIP)\b') { throw 'Original mixed-version role inventory failed.' }
              # The original handoff writes host information rather than pipeline output.
              # Its exact successful step/job and unchanged source are checked above.
            }
            $pairRoot = Get-PinnedArchive 12277684504 'local-pairing-evidence' '7d18add7d6e8611faf3df0f35a05267ed74d7150a592a3a2da4f970fa4aa1e04'
            $identity = Get-Content -LiteralPath (Join-Path $pairRoot 'candidate.json') -Raw | ConvertFrom-Json
            if ($identity.sourceRevision -ne $revision -or $identity.productVersion -ne "0.3.3+$revision" -or
                $identity.candidateSha256 -ne $hash -or $identity.finalCandidateSha256 -ne $hash -or
                $identity.workflowRunId -ne '39451718957' -or $identity.workflowRunAttempt -ne '1' -or
                $identity.job -ne 'local-pairing' -or $identity.playwrightVersion -ne '1.64.0') { throw 'Original local pairing candidate mismatch.' }
            $basic = @('isolated-apps','pinned-pairing','separate-permissions-and-consent','signed-chat',
              'synthetic-stop-copy-receipts','password-permission-revoke','unsupported-password-source-denied',
              'guided-hosting','local-copy-hosting','lost-response-cleanup','cleanup')
            foreach ($mode in @('loopback','lan-api','ux')) {
              $report = Get-Content -LiteralPath (Join-Path $pairRoot "$mode/report.json") -Raw | ConvertFrom-Json
              $expected = if ($mode -eq 'ux') { @('isolated-apps','two-ended-ux','cleanup') } elseif ($mode -eq 'lan-api') {
                $basic + @('new-host-notice','new-host-authenticated-connect','new-host-permission-isolation',
                  'new-host-stop-and-transfer','new-host-restart-reconnect','new-host-revocation-isolation','new-host-receipt-confirmed')
              } else { $basic }
              if ($report.outcome -ne 'Passed' -or $report.physicalPcCount -ne 1 -or
                  @($report.stages).Count -ne $expected.Count -or @($report.stages | Where-Object state -ne 'Passed').Count -or
                  @($report.stages | Where-Object id -notin $expected).Count -or
                  @($report.stages.id | Select-Object -Unique).Count -ne $expected.Count -or
                  $report.cleanup.jobActiveProcesses -ne 0 -or $report.windowObservation.state -ne 'Passed' -or
                  $report.windowObservation.samples -lt 1 -or $report.windowObservation.peakVisibleOwnedWindows -ne 0) { throw "Original $mode pairing inventory failed." }
              if ($mode -eq 'lan-api' -and ($report.apiHostChange.discoveredHost -ne $true -or
                  $report.apiHostChange.connectedOwner -ne $true -or $report.apiHostChange.connectedObserver -ne $true -or
                  $report.apiHostChange.transferredCandidateCopy -ne $true -or $report.apiHostChange.restartedHostConnections -ne $true -or
                  $report.apiHostChange.isolatedRevocation -ne $true)) { throw 'Original LAN signed hosting proofs failed.' }
            }
            $ux = Get-Content -LiteralPath (Join-Path $pairRoot 'ux/ux-report.json') -Raw | ConvertFrom-Json
            if ($ux.ok -ne $true -or @($ux.stages).Count -ne 10 -or @($ux.stages | Where-Object passed -ne $true).Count -or
                @($ux.errors).Count -or @($ux.failedRequests).Count -or
                $ux.failurePathCoverage.hostingGrantWithdrawal -ne $true -or $ux.failurePathCoverage.localConsentAndCancel -ne $true) {
              throw 'Original ten-stage actual Host/Friend UX failed.'
            }
            $current = Invoke-RestMethod -Uri "$api/actions/runs/$env:GITHUB_RUN_ID/jobs?filter=latest&per_page=100" -Headers $headers
            $self = @($current.jobs | Where-Object name -eq 'Complete remaining Existing acceptance')
            if ($self.Count -ne 1 -or $self[0].run_attempt -ne [int]$env:GITHUB_RUN_ATTEMPT) { throw 'Continuation job identity is ambiguous.' }
            $fix = 'checks/TogetherServer.CompanionChecks/SharedWorldResolutionJourney.cs'
            @{candidateSourceRevision=$revision;candidateSha256=$hash;candidateArtifactId=12277888264;
              candidateArtifactDigest=$env:CANDIDATE_ARTIFACT_DIGEST;originalRunId=39451718957;originalRunAttempt=1;
              originalExistingJobId=118729013138;originalDesktopJobId=118729014068;originalRunStatus=$run.status;originalRunConclusion=$run.conclusion;
              completedOtherJobCount=10;completedOtherJobs=$completed;originalExistingPassedStages=17;originalExistingFailedStage='Shared Worlds packaged journey';
              originalExistingReportArtifactId=12280180592;originalExistingReportArtifactDigest='sha256:6490228096028efeb660043f1916b1d912f2991c1fde4620fdcb2cb263c9557c';
              originalArtifacts=@($artifactProofs.ToArray());verificationRevision=$env:GITHUB_SHA;allowedSourceChanges=$changed;
              resolutionFixtureSha256=(Get-FileHash -LiteralPath $fix -Algorithm SHA256).Hash.ToLowerInvariant();
              workflowSha256=(Get-FileHash -LiteralPath '.github/workflows/release-033-continuation.yml' -Algorithm SHA256).Hash.ToLowerInvariant();
              continuationRunId=$env:GITHUB_RUN_ID;continuationRunAttempt=$env:GITHUB_RUN_ATTEMPT;continuationJobId=$self[0].id;
              boundary='Original failures remain failed. This continuation reuses the exact candidate and source-bound completed acceptance; no real-game or WAN acceptance.'} |
              ConvertTo-Json -Depth 9 | Set-Content -LiteralPath (Join-Path $evidence.FullName 'original-gates.json') -Encoding utf8
            Write-Host 'PASS ten completed original jobs, their exact archives, and 17 passed Existing stages. The original Shared Worlds stage remains failed.'
          } finally { $headers.Clear() }

      - name: Compile locked check source without rebuilding the candidate
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          dotnet restore TogetherServer.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked solution restore failed.' }
          dotnet build TogetherServer.slnx -c Release --no-restore -p:CodeOnlyVerification=true
          if ($LASTEXITCODE -ne 0) { throw 'CodeOnly check compilation failed.' }
          $checkFiles = @(Get-ChildItem -LiteralPath checks,ui/checks -File -Recurse | Where-Object {
            $_.Extension -in '.cs','.ps1','.mjs' -and $_.FullName -notmatch '[\\/](?:obj|bin)[\\/]'
          })
          $patterns = @('\bnew\s+(?:System\.Net\.Sockets\.)?(?:TcpListener|UdpClient|Socket)\s*\(',
            '\[(?:System\.)?Net\.Sockets\.(?:TcpListener|UdpClient|Socket)\]::new\s*\(',
            '\.Bind\s*\(', '\.Listen\s*\(', '\bcreateServer\s*\(', '\bcreateSocket\s*\(')
          if (@($checkFiles | Select-String -Pattern $patterns).Count) { throw 'Corrected check source must not own an OS listener.' }
          $badProbes = @($checkFiles | Select-String -Pattern 'PortProbeMode\.LoopbackOnly' | Where-Object {
            $_.Line -notmatch 'GameServerRegistry\.ProbeAddress\s*\('
          })
          if ($badProbes.Count) { throw 'Indirect check probes must remain ObserveOnly.' }
          if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -ne $env:CANDIDATE_SHA256) { throw 'Compilation changed the immutable candidate.' }
          git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Compilation changed tracked source.' }

      - name: Complete exactly ten remaining Existing stages
        run: |
          # Explicit opt-in: this hosted runner owns its disposable desktop, app and fixture processes.
          # Never run these process, browser, native or installer checks on the owner's active desktop.
          $ErrorActionPreference = 'Stop'
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $harness = (Resolve-Path checks/TogetherServer.CompanionChecks/bin/Release/net10.0-windows/TogetherServer.CompanionChecks.dll).Path
          $evidence = (Resolve-Path local-data/ci-evidence/continuation-033).Path
          $context = Get-Content -LiteralPath (Join-Path $evidence 'original-gates.json') -Raw | ConvertFrom-Json
          $checks = [Collections.Generic.List[object]]::new()
          $outcome = 'failed'
          function Invoke-Check([string]$Label, [scriptblock]$Action) {
            $checkOutcome = 'failed'
            $global:LASTEXITCODE = 0
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $log = Join-Path $evidence (('{0:D2}' -f ($checks.Count + 1)) + '.log')
            try {
              & $Action *>&1 | Tee-Object -FilePath $log
              if ($LASTEXITCODE -ne 0) { throw "$Label returned $LASTEXITCODE." }
              $checkOutcome = 'passed'
            } finally {
              $checks.Add(@{name=$Label;outcome=$checkOutcome;elapsedSeconds=$watch.Elapsed.TotalSeconds;log=[IO.Path]::GetFileName($log)})
            }
          }
          try {
            Invoke-Check 'Shared Worlds packaged journey' { dotnet $harness $candidate --shared-world-journey --allow-interactive-tests }
            Invoke-Check 'Staging LiveSave owner action' { dotnet $harness $candidate --live-save-action --allow-interactive-tests }
            Invoke-Check 'Shared LiveSave packaged transfer journey' { dotnet $harness $candidate --shared-live-transfer-journey --allow-interactive-tests }
            Invoke-Check 'TogetherServer.CompanionChecks' { dotnet $harness $candidate --allow-interactive-tests }
            Invoke-Check 'Solution formatting' { dotnet format TogetherServer.slnx --verify-no-changes --no-restore }
            Invoke-Check 'Packaged served smoke' { ./checks/served-smoke.ps1 -AppPath $candidate }
            Invoke-Check 'Production plus staging isolation smoke' { ./checks/staging-smoke.ps1 -AppPath $candidate }
            Invoke-Check 'Packaged hidden desktop smoke' { ./checks/desktop-smoke.ps1 -AppPath $candidate -Port 0 -AllowInteractiveTests }
            Invoke-Check 'Packaged interactive desktop smoke' { ./checks/desktop-smoke.ps1 -AppPath $candidate -Port 0 -Interactive -AllowInteractiveTests }
            Invoke-Check 'Update handoff smoke' { ./checks/update-handoff-smoke.ps1 -AppPath $candidate -AllowInteractiveTests }
            if ($checks.Count -ne 10 -or @($checks | Where-Object outcome -ne 'passed').Count) { throw 'Remaining stage inventory failed.' }
            foreach ($expected in @(
                @{log='01.log';summary='^Shared Worlds packaged journey: 11 groups passed, 0 failed, 0 recovery scenarios skipped\.'},
                @{log='02.log';summary='^Staging live action: 3 groups passed\.'},
                @{log='03.log';summary='^Shared LiveSave transfer journey: 5 groups passed, 0 failed\.'},
                @{log='04.log';summary='^Companion checks: 46 groups passed'}
            )) {
              $log = Join-Path $evidence $expected.log
              if (@(Select-String -LiteralPath $log -Pattern $expected.summary).Count -ne 1 -or
                  @(Select-String -LiteralPath $log -Pattern '^\s*(?:FAIL|SKIP)\b').Count) { throw "Required runtime group summary failed: $($expected.log)." }
            }
            if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -ne $env:CANDIDATE_SHA256 -or
                (Get-FileHash -LiteralPath 'checks/TogetherServer.CompanionChecks/SharedWorldResolutionJourney.cs' -Algorithm SHA256).Hash -ne $context.resolutionFixtureSha256) {
              throw 'The candidate or corrected check source changed during acceptance.'
            }
            git diff --exit-code HEAD --
            if ($LASTEXITCODE -ne 0) { throw 'Runtime acceptance changed tracked source.' }
            $outcome = 'passed'
          } finally {
            @{candidateSourceRevision=$env:CANDIDATE_SOURCE_REVISION;candidateSha256=$env:CANDIDATE_SHA256;
              originalRunId=39451718957;originalRunAttempt=1;originalExistingJobId=118729013138;originalExistingPassedStages=17;
              verificationRevision=$env:GITHUB_SHA;checksCompiledFromRevision=$env:GITHUB_SHA;
              resolutionFixtureSha256=$context.resolutionFixtureSha256;workflowSha256=$context.workflowSha256;
              continuationRunId=$env:GITHUB_RUN_ID;continuationRunAttempt=$env:GITHUB_RUN_ATTEMPT;continuationJobId=$context.continuationJobId;
              requiredRemainingStages=10;outcome=$outcome;checks=@($checks.ToArray());
              finalCandidateSha256=(Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant();
              boundary='Dedicated hosted Windows runner with disposable data. Original failed results stay failed; real game, second-PC and WAN acceptance remain separate.'} |
              ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence 'continuation-report.json') -Encoding utf8
          }

      - name: Preserve bounded continuation reports and logs
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-033-continuation-evidence
          path: local-data/ci-evidence/continuation-033/
          if-no-files-found: error
          retention-days: 1

  original-desktop:
    name: Verify original Desktop completion without rerunning it
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      evidence-id: ${{ steps.evidence.outputs.artifact-id }}
      evidence-digest: sha256:${{ steps.evidence.outputs.artifact-digest }}
      original-artifact-id: ${{ steps.wait.outputs.original-artifact-id }}
      original-artifact-digest: ${{ steps.wait.outputs.original-artifact-digest }}
    steps:
      - name: Wait only for the original job and verify its actual reports
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, io, json, os, pathlib, re, time, urllib.error, urllib.parse, urllib.request, zipfile
          api = "https://api.github.com/repos/daltonstates/TogetherServer"
          source = os.environ["CANDIDATE_SOURCE_REVISION"]
          candidate_hash = os.environ["CANDIDATE_SHA256"]
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(api + path, headers=headers), timeout=30) as response:
                  return json.load(response)
          def one(items, predicate, message):
              selected = [item for item in items if predicate(item)]
              require(len(selected) == 1, message)
              return selected[0]
          expected_jobs = {
              118727977239: "candidate", 118729013559: "Verify Browser", 118729013206: "Verify QolApi",
              118729013233: "Verify Rehearsal", 118729013780: "Verify local pairing and both-ended UX",
              118729013489: "Verify 0.3.0 compatibility", 118729013303: "Verify 0.3.1 compatibility",
              118729013104: "Verify 0.3.2 compatibility", 118729013190: "Verify 0.3.2.1 compatibility",
              118729013538: "Verify 0.3.2.2 compatibility", 118729013138: "Verify Existing", 118729014068: "Verify Desktop"}
          deadline = time.monotonic() + 70 * 60
          while True:
              run = get("/actions/runs/39451718957")
              require(run["id"] == 39451718957 and run["run_attempt"] == 1 and run["head_sha"] == source
                      and run["workflow_id"] == 367811679 and run["path"] == ".github/workflows/windows-ci.yml"
                      and run["event"] == "push", "Original run identity changed.")
              listing = get("/actions/runs/39451718957/jobs?filter=all&per_page=100")
              jobs = listing["jobs"]
              require(listing["total_count"] == len(jobs) and len(jobs) in (12, 13), "Original job inventory changed.")
              for job_id, name in expected_jobs.items():
                  job = one(jobs, lambda item: item["id"] == job_id, "Pinned original job is missing.")
                  require(job["name"] == name and job["run_attempt"] == 1 and job["head_sha"] == source
                          and job["run_id"] == 39451718957, "Original job identity changed.")
              desktop = one(jobs, lambda item: item["id"] == 118729014068, "Original Desktop is ambiguous.")
              print("Original Desktop:", desktop["status"], desktop["conclusion"], "; no new native attempt.", flush=True)
              if desktop["status"] == "completed":
                  require(desktop["conclusion"] == "success", "Original Desktop did not pass; publication remains blocked.")
              if run["status"] == "completed":
                  break
              require(time.monotonic() < deadline, "Original Desktop completion exceeded the bounded read-only wait.")
              time.sleep(30)
          require(run["conclusion"] == "failure" and len(jobs) == 13, "The original failed run must remain failed.")
          package = one(jobs, lambda item: item["name"] == "Package verified release", "Original skipped package is missing.")
          require(package["status"] == "completed" and package["conclusion"] == "skipped"
                  and package["run_attempt"] == 1 and package["head_sha"] == source
                  and package["run_id"] == 39451718957, "Original package outcome changed.")
          for job_id, name in expected_jobs.items():
              job = one(jobs, lambda item: item["id"] == job_id, "Original job missing at completion.")
              expected = "failure" if name == "Verify Existing" else "success"
              require(job["status"] == "completed" and job["conclusion"] == expected, "Original acceptance outcome changed.")
          for name in ("Verify current native window controls with the same candidate",
                       "Wait for Windows to permit actual notification testing",
                       "Verify the exact candidate on this dedicated runner",
                       "Preserve QoL screenshots and validation summaries"):
              step = one(desktop["steps"], lambda item: item["name"] == name, "Required original Desktop step missing.")
              require(step["status"] == "completed" and step["conclusion"] == "success", "Required original Desktop step did not pass.")
          artifacts = get("/actions/runs/39451718957/artifacts?per_page=100")
          require(artifacts["total_count"] == len(artifacts["artifacts"]), "Original artifact pagination changed.")
          artifact = one(artifacts["artifacts"], lambda item: item["name"] == "qol-windows-evidence-Desktop", "Desktop artifact is ambiguous.")
          require(not artifact["expired"] and artifact["workflow_run"]["id"] == 39451718957
                  and artifact["workflow_run"]["head_sha"] == source and artifact["size_in_bytes"] <= 100 * 1024 * 1024
                  and re.fullmatch(r"sha256:[0-9a-f]{64}", artifact["digest"]) is not None, "Original Desktop artifact provenance failed.")
          # Resolve the authenticated API redirect once, then download the signed archive URL without credentials.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          try:
              opener.open(urllib.request.Request(api + "/actions/artifacts/" + str(artifact["id"]) + "/zip", headers=headers), timeout=30)
              raise RuntimeError("The original artifact API did not provide its expected signed redirect.")
          except urllib.error.HTTPError as error:
              require(error.code == 302, "Original archive redirect failed.")
              location = error.headers["Location"]
          destination = urllib.parse.urlsplit(location)
          require(destination.scheme == "https" and destination.hostname is not None
                  and destination.hostname.endswith((".blob.core.windows.net", ".actions.githubusercontent.com", ".githubusercontent.com")),
                  "Unapproved artifact storage redirect.")
          with urllib.request.urlopen(location, timeout=60) as response:
              archive = response.read(100 * 1024 * 1024 + 1)
          require(len(archive) <= 100 * 1024 * 1024 and "sha256:" + hashlib.sha256(archive).hexdigest() == artifact["digest"],
                  "Original Desktop ZIP digest mismatch.")
          zipped = zipfile.ZipFile(io.BytesIO(archive))
          require(len(zipped.infolist()) <= 256 and sum(item.file_size for item in zipped.infolist()) <= 150 * 1024 * 1024,
                  "Original Desktop archive exceeds its fixed bounds.")
          def read_report(pattern):
              filename = one(zipped.namelist(), lambda item: re.fullmatch(pattern, item) is not None, "Required Desktop report is ambiguous.")
              require(zipped.getinfo(filename).file_size <= 2 * 1024 * 1024, "Desktop JSON report is too large.")
              raw = zipped.read(filename)
              return json.loads(raw), hashlib.sha256(raw).hexdigest()
          gate, gate_hash = read_report(r"release-gate/release-gate-report\.json")
          expected_checks = ["Git whitespace check", "Desktop diagnostic isolation", "Check runner listener identity", "QoL native desktop smoke"]
          require(gate["suite"] == "Desktop" and gate["candidate"]["sourceRevision"] == source
                  and gate["candidate"]["sha256"].lower() == candidate_hash
                  and gate["candidate"]["productVersion"] == "0.3.3+" + source and gate["candidate"]["authenticode"] == "NotSigned"
                  and [item["name"] for item in gate["checks"]] == expected_checks
                  and all(item["outcome"] == "passed" for item in gate["checks"]), "Original Desktop gate report failed.")
          native, native_hash = read_report(r"qol-desktop/[0-9a-f]{32}/summary\.json")
          expected_native = {
              "Native WebView with 150 percent text", "Compact native window", "Native window controls and monitor bounds",
              "Close to tray and reopen", "Disposable native file selection", "Native Quit protected draft flush",
              "Protected draft and normal placement recovery", "Maximized cold start and normal restore",
              "Rejected draft keeps native app open", "Windows startup unavailable in development staging",
              "Candidate and fake boundary unchanged", "Explorer tray menu Quit and protected draft flush",
              "OS balloon delivery, physical click and native navigation", "Exact disposable process cleanup"}
          require(native["success"] is True and native["result"] == "PASS" and native["requiredCaseCount"] == 13
                  and native["requiredCasesPassed"] == 13 and native["requiredCasesBlocked"] == 0
                  and native["testAssertionsCompleted"] is True and native["cleanupCompleted"] is True
                  and native["remainingNativeCasesCompleted"] is True and native["screenshotExportCompleted"] is True
                  and len(native["cases"]) == 14 and {item["name"] for item in native["cases"]} == expected_native,
                  "All thirteen original native cases must actually pass.")
          startup = one(native["cases"], lambda item: item["name"] == "Windows startup unavailable in development staging", "Native startup boundary changed.")
          require(startup["status"] == "SKIP" and sum(item["status"] == "PASS" for item in native["cases"]) == 13,
                  "Only the staging-only startup case may be skipped.")
          notification = one(native["cases"], lambda item: item["name"] == "OS balloon delivery, physical click and native navigation", "Notification case missing.")
          proof = native["nativeShell"]["notification"]
          require(notification["status"] == "PASS" and proof["systemState"] == "AcceptsNotifications"
                  and all(proof[key] is True for key in ("systemAllowsNotifications", "freshTitleAndBodyObserved",
                      "physicalClickSent", "exactAppForeground", "nativeDestinationVerified")), "Actual notification delivery and click are unproven.")
          chrome, chrome_hash = read_report(r"window-chrome/[0-9a-f]{32}/result\.json")
          expected_chrome = {"Custom client frame and accessible equal-size caption controls",
              "Restore after maximized taskbar journeys keeps the original normal bounds"}
          expected_chrome.update(region + " double-click maximizes and restores its last normal position/size"
              for region in ("Empty titlebar", "Title text", "App mark", "Updated position"))
          for label in ("Normal", "Maximized"):
              expected_chrome.update({label + " taskbar click minimizes and restores prior state/bounds",
                  label + " caption minimize and ShowAsync preserve state/bounds",
                  label + " single-instance reveal preserves state/bounds",
                  label + " close-to-tray and tray reveal preserve state/bounds"})
          require(chrome["candidateSha256"].lower() == candidate_hash and chrome["passed"] is True
                  and chrome["requiredScopeCompleted"] is True and chrome["skipped"] == 0 and len(chrome["results"]) == 14
                  and {item["name"] for item in chrome["results"]} == expected_chrome
                  and all(item["status"] == "PASS" for item in chrome["results"]), "All original native chrome cases must pass.")
          readiness, readiness_hash = read_report(r"notification-readiness/result\.json")
          require(readiness["accepted"] is True and readiness["observations"][-1]["hresult"] == 0
                  and readiness["observations"][-1]["state"] == 5, "Real Windows notification readiness was not observed.")
          output = pathlib.Path("desktop-proof")
          output.mkdir()
          record = {"candidateSourceRevision": source, "candidateSha256": candidate_hash,
              "originalRunId": 39451718957, "originalRunAttempt": 1, "originalRunConclusion": "failure",
              "originalExistingJobId": 118729013138, "originalExistingConclusion": "failure",
              "originalDesktopJobId": 118729014068, "originalDesktopConclusion": "success",
              "originalPackageJobId": package["id"], "originalPackageConclusion": "skipped",
              "originalDesktopArtifactId": artifact["id"], "originalDesktopArtifactDigest": artifact["digest"],
              "desktopGateReportSha256": gate_hash, "nativeReportSha256": native_hash, "chromeReportSha256": chrome_hash,
              "readinessReportSha256": readiness_hash, "nativeRequiredCasesPassed": 13, "nativeChromeCasesPassed": 14,
              "verificationRevision": os.environ["GITHUB_SHA"], "continuationRunId": os.environ["GITHUB_RUN_ID"],
              "continuationRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"], "gate": gate, "native": native,
              "chromeResults": chrome["results"], "readiness": readiness,
              "boundary": "Read-only verification of the original hosted job; no new native attempt. Original failed results remain failed."}
          (output / "desktop-proof.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("original-artifact-id=" + str(artifact["id"]) + "\noriginal-artifact-digest=" + artifact["digest"] + "\n")
          print("PASS original Desktop: thirteen required native cases, actual notification delivery/click, fourteen chrome cases, and exact ZIP/source identity.", flush=True)
          PY

      - name: Preserve original Desktop proof without duplicate screenshots
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-033-original-desktop-proof
          path: desktop-proof/
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package accepted 0.3.3
    needs: [remaining, original-desktop]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the accepted verification source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Bind packaging to exact accepted reports and candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_ARTIFACT_ID: ${{ needs.remaining.outputs.evidence-id }}
          RUNTIME_ARTIFACT_DIGEST: ${{ needs.remaining.outputs.evidence-digest }}
          DESKTOP_PROOF_ARTIFACT_ID: ${{ needs.original-desktop.outputs.evidence-id }}
          DESKTOP_PROOF_ARTIFACT_DIGEST: ${{ needs.original-desktop.outputs.evidence-digest }}
          ORIGINAL_DESKTOP_ARTIFACT_ID: ${{ needs.original-desktop.outputs.original-artifact-id }}
          ORIGINAL_DESKTOP_ARTIFACT_DIGEST: ${{ needs.original-desktop.outputs.original-artifact-digest }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/package-033 -Force
          $api = 'https://api.github.com/repos/daltonstates/TogetherServer'
          $headers = @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          function Get-AcceptedArchive([string]$Id, [string]$Name, [string]$Digest, [string]$RunId, [string]$Source, [string]$Destination) {
            if ($Id -notmatch '^[1-9][0-9]+$' -or $Digest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'Missing exact accepted artifact output.' }
            $artifact = Invoke-RestMethod -Uri "$api/actions/artifacts/$Id" -Headers $headers
            if ($artifact.id.ToString() -ne $Id -or $artifact.name -ne $Name -or $artifact.expired -ne $false -or
                $artifact.workflow_run.id.ToString() -ne $RunId -or $artifact.workflow_run.head_sha -ne $Source -or
                $artifact.digest -ne $Digest -or $artifact.size_in_bytes -gt 200MB) { throw "Accepted artifact identity mismatch: $Name." }
            $zip = Join-Path $env:RUNNER_TEMP ("accepted-033-$Id.zip")
            Invoke-WebRequest -Uri "$api/actions/artifacts/$Id/zip" -Headers $headers -OutFile $zip
            if ("sha256:$((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant())" -ne $Digest) { throw 'Accepted ZIP digest mismatch.' }
            Expand-Archive -LiteralPath $zip -DestinationPath $Destination
          }
          try {
            Get-AcceptedArchive $env:RUNTIME_ARTIFACT_ID 'release-033-continuation-evidence' $env:RUNTIME_ARTIFACT_DIGEST $env:GITHUB_RUN_ID $env:GITHUB_SHA 'local-data/accepted-runtime-033'
            Get-AcceptedArchive $env:DESKTOP_PROOF_ARTIFACT_ID 'release-033-original-desktop-proof' $env:DESKTOP_PROOF_ARTIFACT_DIGEST $env:GITHUB_RUN_ID $env:GITHUB_SHA 'local-data/accepted-desktop-033'
            Get-AcceptedArchive $env:CANDIDATE_ARTIFACT_ID 'windows-candidate' $env:CANDIDATE_ARTIFACT_DIGEST $env:ORIGINAL_RUN_ID $env:CANDIDATE_SOURCE_REVISION '.'
            $runtime = Get-Content -LiteralPath local-data/accepted-runtime-033/continuation-report.json -Raw | ConvertFrom-Json
            $original = Get-Content -LiteralPath local-data/accepted-runtime-033/original-gates.json -Raw | ConvertFrom-Json
            $desktop = Get-Content -LiteralPath local-data/accepted-desktop-033/desktop-proof.json -Raw | ConvertFrom-Json
            $required = @('Shared Worlds packaged journey','Staging LiveSave owner action','Shared LiveSave packaged transfer journey',
              'TogetherServer.CompanionChecks','Solution formatting','Packaged served smoke','Production plus staging isolation smoke',
              'Packaged hidden desktop smoke','Packaged interactive desktop smoke','Update handoff smoke')
            foreach ($record in @($runtime,$original,$desktop)) {
              if ($record.candidateSourceRevision -ne $env:CANDIDATE_SOURCE_REVISION -or $record.candidateSha256 -ne $env:CANDIDATE_SHA256 -or
                  $record.originalRunId -ne 39451718957 -or $record.originalRunAttempt -ne 1 -or
                  $record.verificationRevision -ne $env:GITHUB_SHA -or $record.continuationRunId -ne $env:GITHUB_RUN_ID -or
                  $record.continuationRunAttempt -ne $env:GITHUB_RUN_ATTEMPT) { throw 'Accepted continuation report identity mismatch.' }
            }
            if ($runtime.outcome -ne 'passed' -or $runtime.checksCompiledFromRevision -ne $env:GITHUB_SHA -or
                $runtime.finalCandidateSha256 -ne $env:CANDIDATE_SHA256 -or $runtime.requiredRemainingStages -ne 10 -or
                @($runtime.checks).Count -ne 10 -or (@($runtime.checks.name) -join '|') -ne ($required -join '|') -or
                @($runtime.checks | Where-Object outcome -ne 'passed').Count -or $original.completedOtherJobCount -ne 10 -or
                $original.originalExistingPassedStages -ne 17 -or $runtime.originalExistingPassedStages -ne 17 -or
                $desktop.originalRunConclusion -ne 'failure' -or $desktop.originalExistingConclusion -ne 'failure' -or
                $desktop.originalDesktopConclusion -ne 'success' -or $desktop.nativeRequiredCasesPassed -ne 13 -or
                $desktop.nativeChromeCasesPassed -ne 14 -or $desktop.originalDesktopArtifactId.ToString() -ne $env:ORIGINAL_DESKTOP_ARTIFACT_ID -or
                $desktop.originalDesktopArtifactDigest -ne $env:ORIGINAL_DESKTOP_ARTIFACT_DIGEST) { throw 'Incomplete acceptance cannot be packaged.' }
            $desktopArtifact = Invoke-RestMethod -Uri "$api/actions/artifacts/$env:ORIGINAL_DESKTOP_ARTIFACT_ID" -Headers $headers
            if ($desktopArtifact.name -ne 'qol-windows-evidence-Desktop' -or $desktopArtifact.expired -ne $false -or
                $desktopArtifact.digest -ne $env:ORIGINAL_DESKTOP_ARTIFACT_DIGEST -or $desktopArtifact.workflow_run.id -ne 39451718957 -or
                $desktopArtifact.workflow_run.head_sha -ne $env:CANDIDATE_SOURCE_REVISION) { throw 'Original Desktop artifact pin changed.' }
            $jobs = Invoke-RestMethod -Uri "$api/actions/runs/$env:GITHUB_RUN_ID/jobs?filter=latest&per_page=100" -Headers $headers
            $runtimeJob = @($jobs.jobs | Where-Object id -eq $runtime.continuationJobId)
            $desktopJob = @($jobs.jobs | Where-Object name -eq 'Verify original Desktop completion without rerunning it')
            $self = @($jobs.jobs | Where-Object name -eq 'Package accepted 0.3.3')
            foreach ($job in @($runtimeJob) + @($desktopJob)) {
              if ($job.status -ne 'completed' -or $job.conclusion -ne 'success' -or
                  $job.run_attempt -ne [int]$env:GITHUB_RUN_ATTEMPT -or $job.head_sha -ne $env:GITHUB_SHA) { throw 'Actual acceptance job outcome did not pass.' }
            }
            if ($runtimeJob.Count -ne 1 -or $desktopJob.Count -ne 1 -or $self.Count -ne 1) { throw 'Continuation job identity is ambiguous.' }
            git merge-base --is-ancestor $env:CANDIDATE_SOURCE_REVISION HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Packaging source does not descend from the candidate.' }
            $changed = @(git diff --no-renames --name-only $env:CANDIDATE_SOURCE_REVISION HEAD)
            if ($LASTEXITCODE -ne 0 -or @($changed | Where-Object { $_ -notin @('docs/38-0.3.3-RELEASE.md',
                'checks/TogetherServer.CompanionChecks/SharedWorldResolutionJourney.cs','.github/workflows/release-033-continuation.yml') }).Count -or
                (Get-FileHash -LiteralPath 'checks/TogetherServer.CompanionChecks/SharedWorldResolutionJourney.cs' -Algorithm SHA256).Hash -ne $runtime.resolutionFixtureSha256 -or
                (Get-FileHash -LiteralPath '.github/workflows/release-033-continuation.yml' -Algorithm SHA256).Hash -ne $runtime.workflowSha256) { throw 'Accepted source or helper hash changed.' }
            $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
            if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -ne $env:CANDIDATE_SHA256 -or
                (Get-Item -LiteralPath $candidate).VersionInfo.ProductVersion -ne "0.3.3+$env:CANDIDATE_SOURCE_REVISION" -or
                (Get-AuthenticodeSignature -LiteralPath $candidate).Status -ne 'NotSigned') { throw 'Packaging candidate identity mismatch.' }
            @{runtimeArtifactId=$env:RUNTIME_ARTIFACT_ID;runtimeArtifactDigest=$env:RUNTIME_ARTIFACT_DIGEST;
              desktopProofArtifactId=$env:DESKTOP_PROOF_ARTIFACT_ID;desktopProofArtifactDigest=$env:DESKTOP_PROOF_ARTIFACT_DIGEST;
              originalDesktopArtifactId=$env:ORIGINAL_DESKTOP_ARTIFACT_ID;originalDesktopArtifactDigest=$env:ORIGINAL_DESKTOP_ARTIFACT_DIGEST;
              runtimeJobId=$runtimeJob[0].id;desktopProofJobId=$desktopJob[0].id;packageJobId=$self[0].id} |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence.FullName 'accepted-artifacts.json') -Encoding utf8
          } finally { $headers.Clear() }

      - name: Install the pinned installer compiler on this dedicated runner
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerSetup
          if ((Get-FileHash -LiteralPath $compilerSetup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Pinned compiler digest mismatch.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $compilerSetup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') { throw 'Pinned compiler publisher mismatch.' }
          $compilerRoot = Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6'
          $arguments = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',('/DIR="{0}"' -f $compilerRoot))
          $setup = Start-Process -FilePath $compilerSetup -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or !(Test-Path -LiteralPath (Join-Path $compilerRoot 'ISCC.exe'))) { throw 'Pinned compiler installation failed.' }

      - name: Package exact bytes and require all silent and actual wizard checks
        run: |
          # Explicit opt-in: all installation, native UI and input use this dedicated hosted runner only.
          $ErrorActionPreference = 'Stop'
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $evidence = (Resolve-Path local-data/ci-evidence/package-033).Path
          $runtime = Get-Content -LiteralPath local-data/accepted-runtime-033/continuation-report.json -Raw | ConvertFrom-Json
          $original = Get-Content -LiteralPath local-data/accepted-runtime-033/original-gates.json -Raw | ConvertFrom-Json
          $desktop = Get-Content -LiteralPath local-data/accepted-desktop-033/desktop-proof.json -Raw | ConvertFrom-Json
          $artifacts = Get-Content -LiteralPath (Join-Path $evidence 'accepted-artifacts.json') -Raw | ConvertFrom-Json
          $outcome = 'failed'
          try {
            if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -ne $env:CANDIDATE_SHA256) { throw 'Candidate changed before packaging.' }
            $global:LASTEXITCODE = 0
            ./scripts/build-installer.ps1 -AppPath $candidate -OutputDirectory local-data/release-assets -CompilerPath (Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6/ISCC.exe') *>&1 |
              Tee-Object -FilePath (Join-Path $evidence 'installer-build.log')
            if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
            $installer = (Resolve-Path local-data/release-assets/TogetherServer-Setup-win-x64.exe).Path
            $installerHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            $silentLog = Join-Path $evidence 'installer-smoke.log'
            $global:LASTEXITCODE = 0
            ./checks/installer-smoke.ps1 -InstallerPath $installer -ExpectedAppPath $candidate -AllowInteractiveTests *>&1 | Tee-Object -FilePath $silentLog
            if ($LASTEXITCODE -ne 0 -or @(Select-String -LiteralPath $silentLog -Pattern '^Installer checks: 6 passed, 0 failed\.').Count -ne 1) { throw 'All six silent installer checks must pass.' }
            $wizardLog = Join-Path $evidence 'installer-ui.log'
            $global:LASTEXITCODE = 0
            ./checks/installer-ui-smoke.ps1 -InstallerPath $installer -ExpectedAppPath $candidate -AllowInteractiveTests *>&1 | Tee-Object -FilePath $wizardLog
            if ($LASTEXITCODE -ne 0 -or @(Select-String -LiteralPath $wizardLog -Pattern '^Installer UI checks: 3 actual wizard choices passed, 0 failed, 0 skipped\.').Count -ne 1) { throw 'All three actual wizard choices must pass.' }
            $summaries = @(Get-ChildItem -LiteralPath local-data/ci-evidence/installer-ui -File -Recurse -Filter summary.json)
            if ($summaries.Count -ne 1) { throw 'Actual installer UI report is ambiguous.' }
            $wizard = Get-Content -LiteralPath $summaries[0].FullName -Raw | ConvertFrom-Json
            if ($wizard.passed -ne $true -or $wizard.sourceRevision -ne $env:GITHUB_SHA -or
                $wizard.candidateSha256 -ne $env:CANDIDATE_SHA256 -or $wizard.installerSha256 -ne $installerHash -or
                $wizard.candidateAndInstallerUnchanged -ne $true -or $wizard.cleanupCompleted -ne $true -or $wizard.skipped -ne 0 -or
                @($wizard.cases).Count -ne 3 -or (@($wizard.cases.choice) -join '|') -ne 'Host|Friend|DecideLater' -or
                @($wizard.cases | Where-Object state -ne 'Passed').Count) { throw 'Actual wizard report does not prove all required choices and cleanup.' }
            if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -ne $env:CANDIDATE_SHA256 -or
                (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $installerHash) { throw 'Accepted app or installer bytes changed.' }
            Copy-Item -LiteralPath $candidate -Destination local-data/release-assets/TogetherServer-win-x64.exe
            $assets = @()
            foreach ($name in @('TogetherServer-win-x64.exe','TogetherServer-Setup-win-x64.exe')) {
              $file = Get-Item -LiteralPath (Join-Path 'local-data/release-assets' $name)
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
              $version = $file.VersionInfo
              if ($signature.Status -ne 'NotSigned' -or $version.FileMajorPart -ne 0 -or $version.FileMinorPart -ne 3 -or
                  $version.FileBuildPart -ne 3 -or $version.FilePrivatePart -ne 0) { throw 'Release asset version or unsigned classification changed.' }
              Set-Content -LiteralPath ($file.FullName + '.sha256') -Value "$hash  $name" -Encoding ascii
              $assets += @{name=$name;sha256=$hash;bytes=$file.Length;authenticode=[string]$signature.Status}
            }
            @{version='0.3.3';sourceRevision=$env:CANDIDATE_SOURCE_REVISION;compiledSourceRevision=$env:CANDIDATE_SOURCE_REVISION;
              candidateSha256=$env:CANDIDATE_SHA256;candidateArtifactId=12277888264;candidateArtifactDigest=$env:CANDIDATE_ARTIFACT_DIGEST;
              originalRunId=39451718957;originalRunAttempt=1;originalRunConclusion='failure';originalExistingJobId=118729013138;
              originalExistingConclusion='failure';originalExistingReportArtifactId=12280180592;
              originalExistingReportArtifactDigest='sha256:6490228096028efeb660043f1916b1d912f2991c1fde4620fdcb2cb263c9557c';
              originalCompletedJobs=$original.completedOtherJobs;originalArtifacts=$original.originalArtifacts;
              originalDesktopJobId=118729014068;originalDesktopArtifactId=$desktop.originalDesktopArtifactId;originalDesktopArtifactDigest=$desktop.originalDesktopArtifactDigest;
              verificationRevision=$env:GITHUB_SHA;checksCompiledFromRevision=$env:GITHUB_SHA;continuationRunId=$env:GITHUB_RUN_ID;
              continuationRunAttempt=$env:GITHUB_RUN_ATTEMPT;continuationJobId=$runtime.continuationJobId;packageJobId=$artifacts.packageJobId;
              acceptedEvidence=$artifacts;resolutionFixtureSha256=$runtime.resolutionFixtureSha256;workflowSha256=$runtime.workflowSha256;
              acceptanceCounts=@{originalCompletedOtherJobs=10;originalExistingStages=17;remainingExistingStages=10;originalRequiredNativeCases=13;
                originalNativeChromeCases=14;silentInstallerChecks=6;actualWizardChoices=3;localLoopbackStages=11;localLanStages=18;actualHostFriendUxStages=10};
              installerUiReportSha256=(Get-FileHash -LiteralPath $summaries[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant();assets=$assets;
              acceptance='All required composed acceptance passed for the exact immutable 0.3.3 app. The failed original run and Existing stage remain failed. No app rebuild, new notification attempt, real-game or WAN acceptance.'} |
              ConvertTo-Json -Depth 10 | Set-Content -LiteralPath local-data/release-assets/release-manifest.json -Encoding utf8
            git diff --exit-code HEAD --
            if ($LASTEXITCODE -ne 0) { throw 'Packaging changed tracked source.' }
            $outcome = 'passed'
          } finally {
            @{candidateSourceRevision=$env:CANDIDATE_SOURCE_REVISION;candidateSha256=$env:CANDIDATE_SHA256;verificationRevision=$env:GITHUB_SHA;
              continuationRunId=$env:GITHUB_RUN_ID;continuationRunAttempt=$env:GITHUB_RUN_ATTEMPT;outcome=$outcome;
              requiredSilentInstallerChecks=6;requiredActualWizardChoices=3;
              finalCandidateSha256=(Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()} |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'package-report.json') -Encoding utf8
          }

      - name: Preserve package logs and actual installer UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-033-package-evidence
          path: |
            local-data/ci-evidence/package-033/
            local-data/ci-evidence/installer-ui/
          if-no-files-found: error
          retention-days: 1

      - name: Preserve four accepted public assets and their acceptance manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release-assets
          path: local-data/release-assets/
          if-no-files-found: error
          retention-days: 1
