name: Finish immutable 0.3.3.1 automatic hosting checks

on:
  push:
    branches: ['review/automatic-0331-*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_SOURCE_REVISION: e3de9ee809947b48c4a5cd972ff11c09b7ace8c3
  CANDIDATE_SHA256: 685925c2f9964a26d06d1f8bbae59a8bae9f5a0c6637264ce6d0f03238e86d9e

jobs:
  automatic:
    name: Complete final automatic shared hosting
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out only the bounded automatic check changes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Verify original failure, source and immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/receive-release-0331-automatic.ps1
      - name: Compile only the automatic check dispatcher
        run: |
          dotnet restore checks/TogetherServer.CompanionChecks/TogetherServer.CompanionChecks.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked automatic dispatcher restore failed.' }
          dotnet build checks/TogetherServer.CompanionChecks/TogetherServer.CompanionChecks.csproj -c Release --no-restore -p:CodeOnlyVerification=true
          if ($LASTEXITCODE -ne 0) { throw 'Automatic dispatcher compilation failed.' }
      - name: Verify two ordinary handoffs against the unchanged E3 candidate
        id: ordinary
        run: |
          # Explicit isolated hosted opt-in; never run on the owner's active desktop.
          $ErrorActionPreference = 'Stop'
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $fixture = (Resolve-Path src/TogetherServer.Fixture/bin/Release/net10.0/TogetherServer.Fixture.exe).Path
          $fixtureHash = (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $identity = Get-Content local-data/release-candidate/candidate.json -Raw | ConvertFrom-Json
          $retained = Get-Content local-data/ci-evidence/automatic-candidate-0331/context.json -Raw | ConvertFrom-Json
          if ($identity.source -ne $env:CANDIDATE_SOURCE_REVISION -or $identity.runId -ne 39691663270 -or
              $identity.runAttempt -ne 1 -or $identity.job -ne 'candidate' -or $identity.sha256 -ne $env:CANDIDATE_SHA256 -or
              $retained.verificationRevision -ne $env:GITHUB_SHA -or $retained.originalAutomaticJobId -ne 119540052540 -or
              $retained.originalAutomaticJobConclusion -ne 'failure' -or $retained.fullyAccepted -ne $false -or
              (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CANDIDATE_SHA256 -or
              (Get-Item -LiteralPath $candidate).VersionInfo.ProductVersion.Trim() -ne $identity.productVersion) { throw 'Automatic candidate or retained failure identity mismatch.' }
          $addresses = @(Get-NetIPAddress -AddressFamily IPv4 | Where-Object {
            $_.AddressState.ToString() -eq 'Preferred' -and $_.IPAddress -match '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)'
          } | Sort-Object InterfaceIndex, IPAddress)
          if ($addresses.Count -eq 0) { throw 'No assigned private runner IPv4 address is available.' }
          $runnerAddress = $addresses[0].IPAddress
          $lab = New-Item -ItemType Directory -Path local-data/local-pairing-lab
          $context = [ordered]@{ suite = 'AutomaticSharedHostingContinuation'; sourceRevision = $env:CANDIDATE_SOURCE_REVISION;
            candidateSha256 = $env:CANDIDATE_SHA256; originalRunId = 39691663270; originalRunAttempt = 1;
            originalAutomaticJobId = 119540052540; originalAutomaticJobConclusion = 'failure';
            verificationRevision = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT;
            job = $env:GITHUB_JOB; runnerAddress = $runnerAddress; expectedOrdinaryRuns = 2; diagnosticsEnabled = $false;
            fixtureSha256 = $fixtureHash; ordinaryRuns = @(); passed = $false; candidateUnchanged = $false;
            fixtureUnchanged = $false; fullyAccepted = $false; nativeNotificationVerified = $false }
          $contextPath = Join-Path $lab.FullName 'simple-hosting-candidate.json'
          $identity | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $lab.FullName 'original-candidate.json') -Encoding utf8
          $stages = @('isolated-private-lab', 'one-server-choice-enrolls-both-friends', 'original-host-completes-two-linked-saves',
            'normal-friend-prepare-and-start', 'listener-less-receiver-verifies-descendant', 'outbound-only-peer-seeds-returning-owner',
            'outbound-relay-and-normal-owner-latest-start', 'global-off-withdraws-signed-rights')
          $env:TOGETHERSERVER_LAB_LATEST_DIAGNOSTICS = '0'
          try {
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              $before = @(Get-ChildItem -LiteralPath $lab.FullName -Directory -Filter 'simple-hosting-*' | Select-Object -ExpandProperty Name)
              dotnet checks/TogetherServer.CompanionChecks/bin/Release/net10.0-windows/TogetherServer.CompanionChecks.dll $candidate --simple-shared-hosting-journey --allow-interactive-tests --lab-lan-address $runnerAddress
              $exitCode = $LASTEXITCODE
              $created = @(Get-ChildItem -LiteralPath $lab.FullName -Directory -Filter 'simple-hosting-*' | Where-Object Name -CNotIn $before)
              if ($created.Count -ne 1 -or $created[0].Name -cnotmatch '^simple-hosting-[0-9a-f]{32}$') { throw 'Ordinary automatic report directory is missing or ambiguous.' }
              $reportPath = Join-Path $created[0].FullName 'report.json'
              $file = Get-Item -LiteralPath $reportPath
              if ($file.Length -le 0 -or $file.Length -gt 2097152) { throw 'Ordinary automatic report is missing or oversized.' }
              $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
              $passed = $exitCode -eq 0 -and $report.schema -eq 1 -and $report.kind -ceq 'HostedSimpleSharedHosting' -and
                !$report.failed -and $report.cleanup.jobEmpty -eq $true -and @($report.stages).Count -eq 8 -and
                @($report.stages | Select-Object -Unique).Count -eq 8 -and $report.friendStartAttempts -ge 1 -and
                $report.ownerStartAttempts -ge 1 -and $report.sourceVersionHash -cmatch '^[0-9a-fA-F]{64}$' -and
                $report.descendantVersionHash -cmatch '^[0-9a-fA-F]{64}$' -and $report.descendantVersionHash -ine $report.sourceVersionHash -and
                $report.sourceVersionNumber -eq 2 -and $report.descendantVersionNumber -gt $report.sourceVersionNumber
              for ($index = 0; $index -lt 8; $index++) { if ($report.stages[$index] -cne $stages[$index]) { $passed = $false } }
              $context.ordinaryRuns += [ordered]@{ attempt = $attempt; diagnosticsEnabled = $false; exitCode = $exitCode;
                report = $created[0].Name + '/report.json'; reportSha256 = (Get-FileHash -LiteralPath $reportPath -Algorithm SHA256).Hash.ToLowerInvariant(); passed = [bool]$passed }
              if (!$passed) { throw 'An ordinary automatic handoff failed its exact eight stages, cleanup or save lineage proof.' }
            }
            $context.passed = $true
          }
          finally {
            $context.candidateUnchanged = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -eq $env:CANDIDATE_SHA256
            $context.fixtureUnchanged = (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash.ToLowerInvariant() -eq $fixtureHash
            $context | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $contextPath -Encoding utf8
            if (!$context.candidateUnchanged -or !$context.fixtureUnchanged) { throw 'The immutable E3 candidate or synthetic fixture changed during automatic checks.' }
          }
      - name: Collect separate failure diagnostics without replacing ordinary results
        if: failure() && steps.ordinary.outcome == 'failure'
        run: |
          # Diagnostic-only hosted execution. The failed ordinary step stays failed.
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $fixture = (Resolve-Path src/TogetherServer.Fixture/bin/Release/net10.0/TogetherServer.Fixture.exe).Path
          $context = Get-Content local-data/local-pairing-lab/simple-hosting-candidate.json -Raw | ConvertFrom-Json
          if ($context.passed -or (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CANDIDATE_SHA256 -or
              (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash.ToLowerInvariant() -ne $context.fixtureSha256) { throw 'Failure diagnostics require the unchanged failed ordinary context.' }
          $env:TOGETHERSERVER_LAB_LATEST_DIAGNOSTICS = '1'
          dotnet checks/TogetherServer.CompanionChecks/bin/Release/net10.0-windows/TogetherServer.CompanionChecks.dll $candidate --simple-shared-hosting-journey --allow-interactive-tests --lab-lan-address $context.runnerAddress
          $diagnosticExit = $LASTEXITCODE
          @{ diagnosticOnly = $true; diagnosticsEnabled = $true; exitCode = $diagnosticExit;
            ordinaryResultUnchanged = $true; sourceRevision = $env:CANDIDATE_SOURCE_REVISION;
            candidateSha256 = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant();
            verificationRevision = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT } |
            ConvertTo-Json | Set-Content local-data/local-pairing-lab/simple-hosting-diagnostic.json -Encoding utf8
          if ($diagnosticExit -ne 0) { throw 'The separate diagnostic handoff also failed; ordinary failure remains recorded.' }
      - name: Retain bounded ordinary automatic and separate diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-automatic-shared-hosting-evidence
          path: |
            local-data/ci-evidence/automatic-candidate-0331/context.json
            local-data/local-pairing-lab/original-candidate.json
            local-data/local-pairing-lab/simple-hosting-candidate.json
            local-data/local-pairing-lab/simple-hosting-diagnostic.json
            local-data/local-pairing-lab/simple-hosting-*/report.json
          if-no-files-found: error
          retention-days: 7
