name: Continue immutable final 0.3.3.9 pairing checks

on:
  workflow_dispatch:
  push:
    branches: [review/release-0339-final-pairing]

permissions:
  contents: read
  actions: read

jobs:
  pairing:
    name: Continue immutable final candidate pairing and both-ended UX
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the same source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install the pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Receive the frozen attempt-one candidate, fixtures and UI
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/receive-release-0339-candidate.ps1

      - name: Install locked Playwright and its headless browser
        working-directory: ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked test dependency installation failed.' }
          node -e 'if (require("./node_modules/playwright/package.json").version !== "1.64.0") throw new Error("Playwright version mismatch");'
          if ($LASTEXITCODE -ne 0) { throw 'The local UX lane requires locked Playwright 1.64.0.' }
          ./node_modules/.bin/playwright.cmd install chromium
          if ($LASTEXITCODE -ne 0) { throw 'The locked Playwright browser installation failed.' }

      - name: Build only the dispatcher and its source dependencies
        run: |
          dotnet restore checks/TogetherServer.CompanionChecks/TogetherServer.CompanionChecks.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked local pairing dispatcher restore failed.' }
          dotnet build checks/TogetherServer.CompanionChecks/TogetherServer.CompanionChecks.csproj -c Release --no-restore -p:CodeOnlyVerification=true -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Local pairing dispatcher compilation failed.' }

      - name: Verify loopback, assigned LAN and actual two-ended UX with the same candidate
        env:
          TOGETHERSERVER_LAB_LATEST_DIAGNOSTICS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $harness = (Resolve-Path checks/TogetherServer.CompanionChecks/bin/Release/net10.0-windows/TogetherServer.CompanionChecks.dll).Path
          $candidateHash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = [string]([xml](Get-Content src/TogetherServer/TogetherServer.csproj -Raw)).Project.PropertyGroup.Version
          $productVersion = (Get-Item -LiteralPath $candidate).VersionInfo.ProductVersion
          if ($productVersion -ne "$version+2f434a628091eb2a6a58b10882310a40980bc952" -or
              $candidateHash -cne '9e0bebccf58e82da59c4a98d5e5cd3f4243dd81b1e80b69ce43d53f4f6e37488') { throw 'Local pairing candidate source identity mismatch.' }
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/local-pairing -Force
          $context = [ordered]@{ sourceRevision = '2f434a628091eb2a6a58b10882310a40980bc952'; verificationRevision = $env:GITHUB_SHA; productVersion = $productVersion; candidateSha256 = $candidateHash;
            workflowRunId = $env:GITHUB_RUN_ID; workflowRunAttempt = $env:GITHUB_RUN_ATTEMPT; job = $env:GITHUB_JOB;
            playwrightVersion = '1.64.0'; boundary = 'Dedicated hosted Windows runner; windowless synthetic same-PC tests only; no real game or WAN acceptance.' }
          $context | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence.FullName 'candidate.json') -Encoding utf8
          $upInterfaces = @(Get-NetAdapter -ErrorAction Stop | Where-Object Status -eq 'Up' | ForEach-Object InterfaceIndex)
          $lan = @(Get-NetIPAddress -AddressFamily IPv4 -ErrorAction Stop | Where-Object {
            $_.AddressState.ToString() -eq 'Preferred' -and $_.InterfaceIndex -in $upInterfaces -and
            $_.IPAddress -match '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)'
          } | Sort-Object InterfaceIndex, IPAddress | Select-Object -First 1)
          if ($lan.Count -ne 1) { throw 'The hosted local pairing lane requires one assigned preferred private IPv4 address.' }
          $labRoot = Join-Path (Get-Location) 'local-data/local-pairing-lab'
          $modeFailures = [Collections.Generic.List[string]]::new()
          $passedModes = [Collections.Generic.List[string]]::new()
          try {
            foreach ($mode in @('ux', 'loopback', 'lan-api')) {
              try {
              $before = @(if (Test-Path -LiteralPath $labRoot) { Get-ChildItem -LiteralPath $labRoot -Directory | ForEach-Object Name })
              $labArguments = @($harness, $candidate, '--local-pairing-lab-journey', '--allow-windowless-lab')
              if ($mode -ne 'loopback') { $labArguments += @('--lab-lan-address', $lan[0].IPAddress) }
              if ($mode -eq 'ux') { $labArguments += '--lab-ux' }
              # The harness assigns apps, fixtures and the muted headless browser to its kill-on-close job.
              # It receives the downloaded candidate, never the rebuilt source-output app or the rebuilding launcher.
              dotnet @labArguments
              $runExitCode = $LASTEXITCODE
              $created = @(Get-ChildItem -LiteralPath $labRoot -Directory | Where-Object { $_.Name -notin $before })
              if ($created.Count -ne 1 -or $created[0].Name -notmatch '^run-[0-9a-f]{32}$') { throw 'One exact new lab report directory was not identified.' }
              $destination = New-Item -ItemType Directory -Path (Join-Path $evidence.FullName $mode) -Force
              $reportPath = Join-Path $created[0].FullName 'report.json'
              if (!(Test-Path -LiteralPath $reportPath) -or (Get-Item -LiteralPath $reportPath).Length -gt 262144) { throw 'The bounded lab report is missing or too large.' }
              $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
              # Export fixed report fields only: no process paths, protected state, pairing material or synthetic saves.
              $report | Select-Object schema, runId, startedUtc, endedUtc, durationMs, mode, physicalPcCount, outcome,
                failedStage, failureCode, stages, uxStagePassed, apiHostChange, branchTransfer, cleanup, resources, windowObservation, acceptance |
                ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $destination.FullName 'report.json') -Encoding utf8
              $uxReport = $null
              if ($mode -eq 'ux') {
                $uxRoot = Join-Path $created[0].FullName 'ux'
                $uxReportPath = Join-Path $uxRoot 'report.json'
                if (!(Test-Path -LiteralPath $uxReportPath) -or (Get-Item -LiteralPath $uxReportPath).Length -gt 262144) { throw 'The bounded UX report is missing or too large.' }
                $uxReport = Get-Content -LiteralPath $uxReportPath -Raw | ConvertFrom-Json
                $uxReport | Select-Object ok, stages, errors, failedRequests, canceledRequests, controlPolicyChanges, boundaries, guidedHosting, preparationDiagnostics, hostingRequestDiagnostics, hostingUiTransitions, signedDiscovery, automaticSharing, copyIntegrity, failurePathCoverage, failure |
                  ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $destination.FullName 'ux-report.json') -Encoding utf8
                $pictures = @(Get-ChildItem -LiteralPath $uxRoot -File -Filter '*.png')
                if ($pictures.Count -gt 64) { throw 'The masked UX screenshot count exceeds its bound.' }
                foreach ($picture in $pictures) {
                  if ($picture.Name -notmatch '^(?:[0-9]{2}-[a-z0-9-]+|failure-[0-9]+)\.png$' -or $picture.Length -gt 16MB -or
                      ($picture.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'A masked UX screenshot failed its bounded export checks.' }
                  Copy-Item -LiteralPath $picture.FullName -Destination (Join-Path $destination.FullName $picture.Name)
                }
              }
              $reviewFiles = @(Get-ChildItem -LiteralPath $created[0].FullName -Recurse -File -Filter simple-hosting-latest-review.json)
              if ($reviewFiles.Count -gt 8) { throw 'Diagnostic file count exceeds its bound.' }
              $reviewNumber = 0
              foreach ($reviewFile in $reviewFiles) {
                if ($reviewFile.Length -gt 32768 -or ($reviewFile.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Lab review diagnostic exceeds its bound.' }
                $reviews = @(Get-Content -LiteralPath $reviewFile.FullName -Raw | ConvertFrom-Json)
                if ($reviews.Count -gt 16) { throw 'Lab review diagnostic record count exceeds its bound.' }
                $reviews | Select-Object phase,reason,exceptionType,localCopies,canonicalCopies,branchCopies,knownHeadCount,verifiedPayloads,coveringCandidates,candidateKind |
                  ConvertTo-Json -Depth 4 | Set-Content (Join-Path $destination.FullName ("latest-review-{0}.json" -f $reviewNumber)) -Encoding utf8
                $reviewNumber++
              }
              if ($runExitCode -ne 0 -or $report.outcome -ne 'Passed' -or @($report.stages).Count -eq 0 -or
                  @($report.stages | Where-Object state -ne 'Passed').Count -ne 0) { throw "The $mode lab did not pass every planned stage without skips." }
              foreach ($required in @('isolated-apps', 'cleanup')) {
                if (@($report.stages | Where-Object id -eq $required).Count -ne 1) { throw "The $mode lab omitted a required stage." }
              }
              $expected = @('isolated-apps', 'cleanup', 'two-ended-ux')
              if ($mode -ne 'ux') {
                $expected = @('isolated-apps', 'pinned-pairing', 'separate-permissions-and-consent', 'signed-chat',
                  'synthetic-stop-copy-receipts', 'password-permission-revoke', 'unsupported-password-source-denied',
                  'guided-hosting', 'local-copy-hosting', 'lost-response-cleanup', 'cleanup')
                if ($mode -eq 'lan-api') {
                  $expected += @('new-host-notice', 'new-host-authenticated-connect', 'new-host-permission-isolation',
                    'new-host-stop-and-transfer', 'new-host-restart-reconnect', 'new-host-revocation-isolation', 'new-host-receipt-confirmed')
                  if ($report.apiHostChange.discoveredHost -ne $true -or $report.apiHostChange.connectedOwner -ne $true -or
                      $report.apiHostChange.connectedObserver -ne $true -or $report.apiHostChange.transferredCandidateCopy -ne $true -or
                      $report.apiHostChange.restartedHostConnections -ne $true -or $report.apiHostChange.isolatedRevocation -ne $true) {
                    throw 'The LAN lab omitted a required signed hosting, transfer, restart or credential-isolation proof.'
                  }
                }
              }
              if (@($report.stages).Count -ne $expected.Count -or @($report.stages | Where-Object id -notin $expected).Count -ne 0 -or
                  @($report.stages.id | Select-Object -Unique).Count -ne $expected.Count) { throw "The $mode lab changed its required stage inventory." }
              if ($report.cleanup.jobActiveProcesses -ne 0 -or $report.windowObservation.state -ne 'Passed' -or
                  $report.windowObservation.samples -lt 1 -or $report.windowObservation.peakVisibleOwnedWindows -ne 0) { throw "The $mode lab failed window observation or exact job cleanup." }
              if ($mode -eq 'ux' -and ($uxReport.ok -ne $true -or @($uxReport.stages).Count -ne 10 -or
                  @($uxReport.stages | Where-Object passed -ne $true).Count -ne 0 -or @($uxReport.errors).Count -ne 0 -or
                  @($uxReport.failedRequests).Count -ne 0 -or @($pictures).Count -lt 1 -or
                  $uxReport.failurePathCoverage.hostingGrantWithdrawal -ne $true -or $uxReport.failurePathCoverage.localConsentAndCancel -ne $true)) {
                throw 'The actual two-ended UX did not pass all ten stages and permission/consent failure paths with masked evidence.'
              }
              if ($mode -eq 'ux') {
                $sidebarProofs = @(
                  @{record=$uxReport.guidedHosting.sidebar;hostingBadge=$true},
                  @{record=$uxReport.signedDiscovery.sidebar;hostingBadge=$true},
                  @{record=$uxReport.signedDiscovery.stoppedSidebar;hostingBadge=$false}
                )
                foreach ($sidebarProof in $sidebarProofs) {
                  if ($null -eq $sidebarProof.record -or $sidebarProof.record.singleOriginalRow -ne $true -or
                      $sidebarProof.record.hostingBadge -ne $sidebarProof.hostingBadge -or
                      $sidebarProof.record.exactRoute -ne $true -or $sidebarProof.record.noSuccessorHostGroup -ne $true) {
                    throw 'The actual two-ended UX omitted an exact single-world sidebar, hosting badge or click route before or after Stop.'
                  }
                }
              }
              if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $candidateHash) { throw 'The downloaded candidate changed during local pairing acceptance.' }
              Write-Host "PASS ${mode}: every planned stage, observed zero windows, exact job cleanup and immutable candidate."
              $passedModes.Add($mode)
              } catch {
                $modeFailures.Add($mode)
                Write-Host "FAIL ${mode}: independent lab failed; see its retained redacted report and fixed failure code."
                if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $candidateHash) { throw 'Candidate changed; refusing another mode.' }
              }
            }
            if ($passedModes.Count -ne 3 -or $modeFailures.Count -ne 0) { throw 'One or more independent lab modes failed; each retained result remains authoritative.' }
          } finally {
            @{expectedModes=3;passed=@($passedModes.ToArray());failed=@($modeFailures.ToArray());
              sourceRevision='2f434a628091eb2a6a58b10882310a40980bc952';verificationRevision=$env:GITHUB_SHA;
              candidateSha256=$candidateHash;fullyAccepted=$false} | ConvertTo-Json -Depth 4 |
              Set-Content (Join-Path $evidence.FullName 'mode-summary.json') -Encoding utf8
            $finalHash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
            $context.finalCandidateSha256 = $finalHash
            $context | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence.FullName 'candidate.json') -Encoding utf8
            if ($finalHash -ne $candidateHash) { throw 'The downloaded candidate bytes changed.' }
          }

      - name: Preserve only redacted local pairing reports and masked UX screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-0339-final-pairing-continuation
          path: |
            local-data/ci-evidence/local-pairing/
            local-data/ci-evidence/0339-pairing/
          if-no-files-found: error
          retention-days: 7

  existing:
    name: Continue complete Existing suite against immutable final candidate
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the verification source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Install the pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Receive the frozen attempt-one candidate, fixtures and UI
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/receive-release-0339-candidate.ps1
      - name: Install locked UI check dependencies
        working-directory: ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked Existing dependency installation failed.' }
      - name: Run every maintained Existing gate on the dedicated hosted runner
        run: |
          # Explicit hosted opt-in only. Never run this suite on the owner's active desktop.
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          ./scripts/verify-release.ps1 -Suite Existing -AppPath $candidate -CandidateSourceRevision 2f434a628091eb2a6a58b10882310a40980bc952 -AllowInteractiveTests
      - name: Verify unchanged inputs and preserve only bounded gate evidence
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRevision = '2f434a628091eb2a6a58b10882310a40980bc952'
          $candidateHash = '9e0bebccf58e82da59c4a98d5e5cd3f4243dd81b1e80b69ce43d53f4f6e37488'
          $contextPath = 'local-data/ci-evidence/0339-pairing/candidate-context.json'
          if (!(Test-Path -LiteralPath $contextPath) -or (Get-Item -LiteralPath $contextPath).Length -gt 65536) { throw 'The bounded immutable-candidate receipt is missing.' }
          $context = Get-Content -LiteralPath $contextPath -Raw | ConvertFrom-Json
          if ($context.sourceRevision -cne $sourceRevision -or $context.verificationRevision -cne $env:GITHUB_SHA -or
              $context.candidateSha256 -cne $candidateHash -or $context.candidateRunAttempt -ne 1 -or
              $context.rebuilt -ne $false -or $context.fullyAccepted -ne $false) { throw 'Existing candidate receipt differs.' }
          $candidate = Get-Item -LiteralPath local-data/release-candidate/TogetherServer.exe
          if ($candidate.Length -ne $context.candidateBytes -or
              (Get-FileHash -LiteralPath $candidate.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $candidateHash) { throw 'The Existing candidate changed.' }
          $uiRoot = (Resolve-Path ui/dist).Path
          if (@(Get-ChildItem -LiteralPath $uiRoot -Recurse -File -Force).Count -ne 7 -or @($context.uiAssets).Count -ne 7) { throw 'The retained UI inventory changed.' }
          foreach ($asset in $context.uiAssets) {
            if ($asset.asset -cnotmatch '^(assets/[A-Za-z0-9_-]+\.(js|css)|favicon\.svg|index\.html)$') { throw 'The retained UI path is invalid.' }
            $file = Get-Item -LiteralPath (Join-Path $uiRoot $asset.asset)
            if (($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $file.Length -ne $asset.sizeBytes -or
                (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $asset.sha256) { throw 'The retained UI bytes changed.' }
          }
          $retained = (Resolve-Path local-data/retained0339-pairing).Path
          $fixtureFilesVerified = 0
          foreach ($outputRoot in @('src/TogetherServer.Fixture/bin/Release/net10.0',
              'src/TogetherServer.ValheimFixture/bin/Release/net10.0', 'src/TogetherServer.MinecraftFixture/bin/Release/net10.0',
              'src/TogetherServer.FactorioFixture/bin/Release/net10.0', 'src/TogetherServer.TerrariaFixture/bin/Release/net10.0')) {
            $original = Join-Path $retained $outputRoot
            $files = @(Get-ChildItem -LiteralPath $original -Recurse -File -Force)
            $copiedRoot = (Resolve-Path $outputRoot).Path
            if ($files.Count -lt 1 -or $files.Count -gt 256 -or
                @(Get-ChildItem -LiteralPath $copiedRoot -Recurse -File -Force).Count -ne $files.Count) { throw 'The retained fixture inventory changed.' }
            foreach ($file in $files) {
              $copied = Get-Item -LiteralPath (Join-Path $copiedRoot ([IO.Path]::GetRelativePath($original, $file.FullName)))
              if (($copied.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $copied.Length -ne $file.Length -or
                  (Get-FileHash -LiteralPath $copied.FullName -Algorithm SHA256).Hash -cne
                  (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash) { throw 'A retained fixture changed.' }
              $fixtureFilesVerified++
            }
          }
          $destination = New-Item -ItemType Directory -Path local-data/ci-evidence/0339-existing -Force
          Copy-Item -LiteralPath $contextPath -Destination (Join-Path $destination.FullName 'candidate-context.json')
          @{sourceRevision=$sourceRevision;verificationRevision=$env:GITHUB_SHA;candidateSha256=$candidateHash;
            candidateRunAttempt=1;uiAssetsVerified=7;fixtureFilesVerified=$fixtureFilesVerified;unchanged=$true;
            rebuilt=$false;fullyAccepted=$false;boundary='Dedicated hosted synthetic Existing suite; real game, physical two-PC/WAN and OS notification acceptance remain separate.'} |
            ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $destination.FullName 'immutable-inputs.json') -Encoding utf8
          $reportPath = 'local-data/ci-evidence/release-gate/release-gate-report.json'
          if (!(Test-Path -LiteralPath $reportPath) -or (Get-Item -LiteralPath $reportPath).Length -gt 262144 -or
              ((Get-Item -LiteralPath $reportPath).Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'The bounded Existing gate report is missing or invalid.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $report | Select-Object suite,candidate,checks,boundary | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $destination.FullName 'release-gate-report.json') -Encoding utf8
          $expected = @('Git whitespace check', 'Desktop diagnostic isolation', 'Check runner listener identity',
            'UI lint', 'UI unit tests', 'Locked application restore', 'TogetherServer.Checks', 'TogetherServer.ValheimChecks',
            'TogetherServer.FactorioChecks', 'TogetherServer.TerrariaChecks', 'TogetherServer.MinecraftChecks',
            'TogetherServer.MinecraftSetupChecks', 'TogetherServer.CustomChecks', 'TogetherServer.SharedHistoryChecks',
            'TogetherServer.UpdateChecks', 'Core remote journey', 'World-load packaged rehearsal',
            'Shared Worlds packaged journey', 'Staging LiveSave owner action', 'Shared LiveSave packaged transfer journey',
            'TogetherServer.CompanionChecks', 'Solution formatting', 'Packaged served smoke',
            'Production plus staging isolation smoke', 'Packaged hidden desktop smoke', 'Packaged interactive desktop smoke', 'Update handoff smoke')
          if ($report.suite -cne 'Existing' -or $report.candidate.sourceRevision -cne $sourceRevision -or
              $report.candidate.verificationRevision -cne $env:GITHUB_SHA -or $report.candidate.sha256.ToLowerInvariant() -cne $candidateHash -or
              $report.candidate.authenticode -cne 'NotSigned' -or @($report.checks).Count -ne 27 -or
              [string]::Join([char]31, @($report.checks.name)) -cne [string]::Join([char]31, $expected) -or
              @($report.checks | Where-Object outcome -cne 'passed').Count -ne 0) { throw 'The complete Existing suite did not pass all 27 exact required gates without skips.' }
          Write-Host 'PASS every exact Existing gate and unchanged candidate, seven UI assets and retained synthetic fixtures.'
      - name: Preserve bounded Existing reports and candidate receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-0339-final-existing-continuation
          path: |
            local-data/ci-evidence/0339-existing/
            local-data/ci-evidence/0339-pairing/
          if-no-files-found: error
          retention-days: 7
