name: Finish the remaining UX and native acceptance

on:
  push:
    branches: ['review/acceptance-continuation-*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: acceptance-continuation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remaining:
    name: Finish UX, native and actual wizard acceptance
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CANDIDATE_SOURCE_REVISION: 1b84e8f25943afd71f6ce3041b6159fa519e2ff5
      CANDIDATE_SHA256: 937dc50d965b5a23fd33bb3611cac15723948c9602bedb833d88fa72c67909f7
      CANDIDATE_ARTIFACT_ID: '12250218037'
      CANDIDATE_ARTIFACT_SHA256: e8febcf0d55d14bd25ea493a5b1de11b3efad706eaea0aadf6542b99be9f671b
      ORIGINAL_RUN_ID: '39392686691'
      PRIOR_REPAIR_ARTIFACT_ID: '12251517740'
      PRIOR_REPAIR_ARTIFACT_SHA256: 4a9cd813f98aacdf1d0a20178442a2f1bcacb63ed3b8b9bea746a8c8a2a84441
    steps:
      - name: Check out the verification source and its ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require unchanged product source and a narrow verification-only descendant
        id: source
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'daltonstates/TogetherServer') { throw 'Unexpected acceptance repository.' }
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/acceptance-continuation -Force
          $revision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:GITHUB_SHA) { throw 'Verification checkout identity mismatch.' }
          git merge-base --is-ancestor $env:CANDIDATE_SOURCE_REVISION HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Verification source must descend from the compiled candidate.' }
          $changed = @(git diff --no-renames --name-only $env:CANDIDATE_SOURCE_REVISION HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare verification and compiled source.' }
          $allowedFiles = @('.github/workflows/acceptance-continuation.yml',
            'checks/qol-desktop-smoke.ps1','checks/qol-native-shell-helper.ps1',
            'checks/installer-ui-smoke.ps1','scripts/run-local-pairing-ux.mjs')
          if (@($changed | Where-Object { $_ -notin $allowedFiles -and $_ -notmatch '^docs/[A-Za-z0-9_./-]+\.md$' }).Count) {
            throw 'Only the fixed acceptance checks, named workflows and Markdown delivery records may differ from the candidate.'
          }
          git diff --exit-code $env:CANDIDATE_SOURCE_REVISION HEAD -- src ui/src ui/package.json ui/package-lock.json global.json .node-version
          if ($LASTEXITCODE -ne 0) { throw 'Application, bundled UI or pinned tool/dependency source changed.' }
          if (@(git status --porcelain --untracked-files=no).Count) { throw 'Verification requires a clean tracked checkout.' }
          @{ candidateSourceRevision=$env:CANDIDATE_SOURCE_REVISION; verificationRevision=$revision; allowedSourceChanges=$changed;
            originalRunId=$env:ORIGINAL_RUN_ID; candidateArtifactId=$env:CANDIDATE_ARTIFACT_ID;
            candidateArtifactDigest=('sha256:'+$env:CANDIDATE_ARTIFACT_SHA256); candidateSha256=$env:CANDIDATE_SHA256;
            continuationRunId=$env:GITHUB_RUN_ID; continuationAttempt=$env:GITHUB_RUN_ATTEMPT;
            boundary='One dedicated hosted Windows runner; only incomplete synthetic/loopback/native/installer acceptance. No real game, WAN or publication.' } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $evidence.FullName 'context.json') -Encoding utf8

      - name: Retrieve and verify the original candidate artifact without rebuilding it
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
          try {
            $uri = "https://api.github.com/repos/daltonstates/TogetherServer/actions/artifacts/$env:CANDIDATE_ARTIFACT_ID"
            $artifact = Invoke-RestMethod -Uri $uri -Headers $headers
            if ([string]$artifact.id -ne $env:CANDIDATE_ARTIFACT_ID -or $artifact.name -ne 'acceptance-repair-candidate' -or
                $artifact.expired -ne $false -or [string]$artifact.workflow_run.id -ne $env:ORIGINAL_RUN_ID -or
                $artifact.workflow_run.head_sha -ne $env:CANDIDATE_SOURCE_REVISION -or
                $artifact.digest -ne ('sha256:'+$env:CANDIDATE_ARTIFACT_SHA256) -or $artifact.size_in_bytes -gt 128MB) {
              throw 'Original candidate artifact provenance mismatch.'
            }
            $archive = Join-Path $env:RUNNER_TEMP 'acceptance-candidate-12250218037.zip'
            try { Invoke-WebRequest -Uri ($uri+'/zip') -Headers $headers -OutFile $archive -MaximumRetryCount 2 -RetryIntervalSec 2 }
            catch { throw 'The pinned candidate artifact download failed.' }
          } finally { $headers.Clear() }
          $zipHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne $env:CANDIDATE_ARTIFACT_SHA256 -or (Get-Item -LiteralPath $archive).Length -ne $artifact.size_in_bytes) {
            throw 'The original candidate ZIP digest or size differs from its pinned metadata.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath . -Force
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $hash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = (Get-Item -LiteralPath $candidate).VersionInfo.ProductVersion
          if ($hash -ne $env:CANDIDATE_SHA256 -or $version -ne "0.3.2.2+$env:CANDIDATE_SOURCE_REVISION" -or
              (Get-AuthenticodeSignature -LiteralPath $candidate).Status -ne 'NotSigned') { throw 'Downloaded application identity mismatch.' }
          @{ artifactId=$artifact.id; artifactName=$artifact.name; artifactRunId=$artifact.workflow_run.id;
            sourceRevision=$artifact.workflow_run.head_sha; artifactDigest=$artifact.digest; zipSha256=$zipHash;
            candidateSha256=$hash; productVersion=$version } |
            ConvertTo-Json | Set-Content -LiteralPath local-data/ci-evidence/acceptance-continuation/candidate.json -Encoding utf8

      - name: Verify the prior passed sharing, browser and LAN reports
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
          try {
            $api = 'https://api.github.com/repos/daltonstates/TogetherServer/actions'
            $run = Invoke-RestMethod -Uri "$api/runs/$env:ORIGINAL_RUN_ID" -Headers $headers
            if ($run.head_sha -ne $env:CANDIDATE_SOURCE_REVISION -or $run.status -ne 'completed' -or $run.conclusion -ne 'failure' -or $run.run_attempt -ne 1) { throw 'Prior repair run identity mismatch.' }
            $uri = "$api/artifacts/$env:PRIOR_REPAIR_ARTIFACT_ID"
            $artifact = Invoke-RestMethod -Uri $uri -Headers $headers
            if ($artifact.name -ne 'acceptance-repair-evidence' -or $artifact.workflow_run.head_sha -ne $env:CANDIDATE_SOURCE_REVISION -or
                [string]$artifact.workflow_run.id -ne $env:ORIGINAL_RUN_ID -or $artifact.expired -ne $false -or
                $artifact.digest -ne ('sha256:'+$env:PRIOR_REPAIR_ARTIFACT_SHA256) -or $artifact.size_in_bytes -gt 8MB) { throw 'Prior repair artifact identity mismatch.' }
            $archive = Join-Path $env:RUNNER_TEMP 'prior-repair-reports.zip'
            Invoke-WebRequest -Uri ($uri+'/zip') -Headers $headers -OutFile $archive -MaximumRetryCount 2 -RetryIntervalSec 2
          } finally { $headers.Clear() }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PRIOR_REPAIR_ARTIFACT_SHA256) { throw 'Prior reports ZIP hash mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath local-data/previous-repair
          function Read-One([string]$directory,[string]$name) {
            $files = @(Get-ChildItem -LiteralPath $directory -Filter $name -Recurse -File)
            if ($files.Count -ne 1 -or $files[0].Length -gt 4MB) { throw 'Require one bounded prior report.' }
            return Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          }
          $existing = Read-One local-data/previous-repair/acceptance-continuation remaining-existing.json
          $expected = @('Core remote journey','Shared Worlds packaged journey','TogetherServer.CompanionChecks','Solution formatting','Packaged served smoke')
          if ($existing.candidateSha256 -ne $env:CANDIDATE_SHA256 -or $existing.compiledSourceRevision -ne $env:CANDIDATE_SOURCE_REVISION -or
              @($existing.checks).Count -ne 5 -or @($existing.checks | Where-Object { $_.outcome -ne 'passed' -or $_.name -notin $expected }).Count -or
              @($existing.checks.name | Select-Object -Unique).Count -ne 5) { throw 'The five affected sharing/served checks did not previously pass.' }
          $browser = Read-One local-data/previous-repair/qol-browser qol-browser-report.json
          if ($browser.candidateSha256 -ne $env:CANDIDATE_SHA256 -or $browser.outcome -ne 'passed' -or
              @($browser.browserErrors).Count -or @($browser.failedRequests).Count -or @($browser.optionalGuides).Count -ne 2 -or
              @($browser.optionalGuides | Where-Object { $_.actualWelcomeChoices -ne $true -or $_.persistedDeferral -ne $true -or $_.reopenedFromHeader -ne $true }).Count) { throw 'Prior actual browser acceptance is incomplete.' }
          $lan = Read-One local-data/previous-repair/local-pairing/lan-api report.json
          if ($lan.outcome -ne 'Passed' -or @($lan.stages).Count -ne 18 -or @($lan.stages.id | Select-Object -Unique).Count -ne 18 -or @($lan.stages | Where-Object state -ne 'Passed').Count -or
              @($lan.stages | Where-Object id -eq 'new-host-receipt-confirmed').Count -ne 1 -or $lan.cleanup.jobActiveProcesses -ne 0 -or
              $lan.windowObservation.state -ne 'Passed' -or $lan.windowObservation.peakVisibleOwnedWindows -ne 0 -or
              $lan.apiHostChange.discoveredHost -ne $true -or $lan.apiHostChange.connectedOwner -ne $true -or
              $lan.apiHostChange.connectedObserver -ne $true -or $lan.apiHostChange.transferredCandidateCopy -ne $true -or
              $lan.apiHostChange.restartedHostConnections -ne $true -or $lan.apiHostChange.isolatedRevocation -ne $true) { throw 'The full assigned LAN and durable new-host receipt proof did not pass.' }
          $final = Read-One local-data/previous-repair/acceptance-continuation final-candidate.json
          if ($final.unchanged -ne $true -or $final.finalCandidateSha256 -ne $env:CANDIDATE_SHA256) { throw 'Prior candidate sentinel mismatch.' }
          @{ originalRunId=$env:ORIGINAL_RUN_ID; sourceRevision=$env:CANDIDATE_SOURCE_REVISION; candidateSha256=$env:CANDIDATE_SHA256;
            priorArtifactId=$env:PRIOR_REPAIR_ARTIFACT_ID; priorArtifactZipSha256=$env:PRIOR_REPAIR_ARTIFACT_SHA256;
            sharingChecks=$expected; actualBrowserPassed=$true; assignedLanStages=18; durableNewHostReceiptPassed=$true } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath local-data/ci-evidence/acceptance-continuation/prior-proof.json -Encoding utf8

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Prepare only the dispatcher and browser without rebuilding the candidate
        id: setup
        run: |
          Push-Location ui
          try {
            npm ci --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Locked browser dependency setup failed.' }
            ./node_modules/.bin/playwright.cmd install chromium
            if ($LASTEXITCODE -ne 0) { throw 'Locked browser installation failed.' }
          } finally { Pop-Location }
          dotnet restore checks/TogetherServer.CompanionChecks/TogetherServer.CompanionChecks.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Dispatcher locked restore failed.' }
          dotnet build checks/TogetherServer.CompanionChecks/TogetherServer.CompanionChecks.csproj -c Release --no-restore -p:CodeOnlyVerification=true
          if ($LASTEXITCODE -ne 0) { throw 'Dispatcher compilation failed.' }
      - name: Complete QoL native desktop acceptance
        id: desktop
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.prior.outcome == 'success' && steps.setup.outcome == 'success' }}
        run: |
          # Explicit opt-in applies only to this dedicated hosted runner's disposable desktop.
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          ./checks/qol-desktop-smoke.ps1 -AppPath $candidate -AllowInteractiveTests *>&1 |
            Tee-Object -FilePath local-data/ci-evidence/acceptance-continuation/qol-desktop.log

      - name: Complete only the ten-stage Host/Friend UX
        id: pairing
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.prior.outcome == 'success' && steps.setup.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $harness = (Resolve-Path checks/TogetherServer.CompanionChecks/bin/Release/net10.0-windows/TogetherServer.CompanionChecks.dll).Path
          $up = @(Get-NetAdapter | Where-Object Status -eq 'Up' | ForEach-Object InterfaceIndex)
          $lan = @(Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.AddressState.ToString() -eq 'Preferred' -and
            $_.InterfaceIndex -in $up -and $_.IPAddress -match '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)' } |
            Sort-Object InterfaceIndex,IPAddress | Select-Object -First 1)
          if ($lan.Count -ne 1) { throw 'One assigned preferred private IPv4 address is required.' }
          $labRoot = Join-Path (Get-Location) 'local-data/local-pairing-lab'
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/local-pairing -Force
          $results = [Collections.Generic.List[object]]::new()
          foreach ($mode in @('ux')) {
            $outcome = 'passed'
            try {
              $before = @(if (Test-Path -LiteralPath $labRoot) { Get-ChildItem -LiteralPath $labRoot -Directory | ForEach-Object Name })
              $arguments = @($harness,$candidate,'--local-pairing-lab-journey','--allow-windowless-lab','--lab-lan-address',$lan[0].IPAddress)
              if ($mode -eq 'ux') { $arguments += '--lab-ux' }
              dotnet @arguments
              $code = $LASTEXITCODE
              $created = @(Get-ChildItem -LiteralPath $labRoot -Directory | Where-Object Name -notin $before)
              if ($created.Count -ne 1 -or $created[0].Name -notmatch '^run-[0-9a-f]{32}$') { throw 'One exact new lab case is required.' }
              $reportPath = Join-Path $created[0].FullName 'report.json'
              if ((Get-Item -LiteralPath $reportPath).Length -gt 256KB) { throw 'Lab report exceeds its bound.' }
              $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
              $destination = New-Item -ItemType Directory -Path (Join-Path $evidence.FullName $mode) -Force
              $report | Select-Object schema,runId,startedUtc,endedUtc,durationMs,mode,physicalPcCount,outcome,failedStage,failureCode,
                stages,uxStagePassed,apiHostChange,branchTransfer,cleanup,resources,windowObservation,acceptance |
                ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $destination.FullName 'report.json') -Encoding utf8
              $expected = @('isolated-apps','two-ended-ux','cleanup')
              if ($mode -eq 'lan-api') {
                $expected = @('isolated-apps','pinned-pairing','separate-permissions-and-consent','signed-chat','synthetic-stop-copy-receipts',
                  'password-permission-revoke','unsupported-password-source-denied','guided-hosting','local-copy-hosting','lost-response-cleanup','cleanup',
                  'new-host-notice','new-host-authenticated-connect','new-host-permission-isolation','new-host-stop-and-transfer',
                  'new-host-restart-reconnect','new-host-revocation-isolation','new-host-receipt-confirmed')
              } else {
                $uxRoot = Join-Path $created[0].FullName 'ux'
                $uxPath = Join-Path $uxRoot 'report.json'
                if ((Get-Item -LiteralPath $uxPath).Length -gt 256KB) { throw 'UX report exceeds its bound.' }
                $ux = Get-Content -LiteralPath $uxPath -Raw | ConvertFrom-Json
                $ux | Select-Object ok,stages,errors,failedRequests,canceledRequests,controlPolicyChanges,boundaries,guidedHosting,signedDiscovery,failurePathCoverage,failure |
                  ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $destination.FullName 'ux-report.json') -Encoding utf8
                $pictures = @(Get-ChildItem -LiteralPath $uxRoot -Filter '*.png' -File)
                if ($pictures.Count -lt 1 -or $pictures.Count -gt 64) { throw 'Masked UX capture count is outside its bound.' }
                foreach ($picture in $pictures) {
                  if ($picture.Name -notmatch '^(?:[0-9]{2}-[a-z0-9-]+|failure-[0-9]+)\.png$' -or $picture.Length -gt 16MB -or
                      ($picture.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Masked UX capture identity is invalid.' }
                  Copy-Item -LiteralPath $picture.FullName -Destination (Join-Path $destination.FullName $picture.Name)
                }
                if ($ux.ok -ne $true -or @($ux.stages).Count -ne 10 -or @($ux.stages | Where-Object passed -ne $true).Count -ne 0 -or
                    @($ux.errors).Count -ne 0 -or @($ux.failedRequests).Count -ne 0 -or $ux.failurePathCoverage.hostingGrantWithdrawal -ne $true -or
                    $ux.failurePathCoverage.localConsentAndCancel -ne $true -or $ux.guidedHosting.startRequests -ne 1 -or
                    $ux.guidedHosting.successfulStartResponses -ne 1 -or $ux.signedDiscovery.exactCandidateSession -ne $true -or
                    $ux.signedDiscovery.exactAdvertisedEndpoint -ne $true -or $ux.signedDiscovery.exactConnectSelection -ne $true) { throw 'Ten actual UX stages and exact one-Start/signed-Connect proof must all pass.' }
              }
              if ($code -ne 0 -or $report.outcome -ne 'Passed' -or @($report.stages).Count -ne $expected.Count -or
                  @($report.stages | Where-Object { $_.state -ne 'Passed' -or $_.id -notin $expected }).Count -ne 0 -or
                  @($report.stages.id | Select-Object -Unique).Count -ne $expected.Count -or $report.cleanup.jobActiveProcesses -ne 0 -or
                  $report.windowObservation.state -ne 'Passed' -or $report.windowObservation.samples -lt 1 -or
                  $report.windowObservation.peakVisibleOwnedWindows -ne 0) { throw "Every $mode stage and exact window/job cleanup must pass." }
              if ($mode -eq 'lan-api' -and ($report.apiHostChange.discoveredHost -ne $true -or $report.apiHostChange.connectedOwner -ne $true -or
                  $report.apiHostChange.connectedObserver -ne $true -or $report.apiHostChange.transferredCandidateCopy -ne $true -or
                  $report.apiHostChange.restartedHostConnections -ne $true -or $report.apiHostChange.isolatedRevocation -ne $true)) { throw 'A required hosting, transfer, restart or revocation proof is missing.' }
            } catch { $outcome = 'failed'; Write-Host "FAIL remaining $mode lab: inspect its redacted report." }
            $results.Add(@{mode=$mode;outcome=$outcome})
            if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CANDIDATE_SHA256) { throw 'Immutable candidate changed during the lab.' }
          }
          @{candidateSha256=$env:CANDIDATE_SHA256;verificationRevision=$env:GITHUB_SHA;checks=@($results.ToArray())} | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath local-data/ci-evidence/acceptance-continuation/remaining-pairing.json -Encoding utf8
          if ($results.Count -ne 1 -or @($results | Where-Object outcome -ne 'passed').Count -ne 0) { throw 'The remaining ten-stage UX did not pass.' }

      - name: Install the pinned installer compiler
        id: compiler
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: |
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerSetup -MaximumRetryCount 2 -RetryIntervalSec 2
          if ((Get-FileHash -LiteralPath $compilerSetup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Pinned installer compiler digest mismatch.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $compilerSetup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') { throw 'Installer compiler publisher mismatch.' }
          $compilerRoot = Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6'
          $setup = Start-Process -FilePath $compilerSetup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$compilerRoot`"") -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or !(Test-Path -LiteralPath (Join-Path $compilerRoot 'ISCC.exe'))) { throw 'Installer compiler installation failed.' }

      - name: Wrap the immutable app bytes in the installer
        id: installer
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.compiler.outcome == 'success' }}
        run: |
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          ./scripts/build-installer.ps1 -AppPath $candidate -OutputDirectory local-data/release-assets -CompilerPath (Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6/ISCC.exe') *>&1 |
            Tee-Object -FilePath local-data/ci-evidence/acceptance-continuation/installer-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }

      - name: Complete silent installer integration acceptance
        id: silent
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.installer.outcome == 'success' }}
        run: |
          ./checks/installer-smoke.ps1 -InstallerPath local-data/release-assets/TogetherServer-Setup-win-x64.exe -ExpectedAppPath local-data/release-candidate/TogetherServer.exe -AllowInteractiveTests *>&1 |
            Tee-Object -FilePath local-data/ci-evidence/acceptance-continuation/installer-smoke.log

      - name: Complete all three actual installer wizard choices
        id: wizard
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.installer.outcome == 'success' }}
        run: |
          # The UI script refuses any installed/running app; a failed silent cleanup cannot be bypassed.
          ./checks/installer-ui-smoke.ps1 -InstallerPath local-data/release-assets/TogetherServer-Setup-win-x64.exe -ExpectedAppPath local-data/release-candidate/TogetherServer.exe -AllowInteractiveTests *>&1 |
            Tee-Object -FilePath local-data/ci-evidence/acceptance-continuation/installer-ui.log

      - name: Require every remaining actual outcome and report
        id: package
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.prior.outcome == 'success' && steps.setup.outcome == 'success' }}
        env:
          DESKTOP_OUTCOME: ${{ steps.desktop.outcome }}
          UX_OUTCOME: ${{ steps.pairing.outcome }}
          SILENT_OUTCOME: ${{ steps.silent.outcome }}
          WIZARD_OUTCOME: ${{ steps.wizard.outcome }}
        run: |
          foreach ($name in @('DESKTOP_OUTCOME','UX_OUTCOME','SILENT_OUTCOME','WIZARD_OUTCOME')) {
            if ([Environment]::GetEnvironmentVariable($name) -ne 'success') { throw "Required remaining surface did not pass: $name" }
          }
          function Read-One([string]$directory,[string]$name) {
            $files = @(Get-ChildItem -LiteralPath $directory -Filter $name -File -Recurse)
            if ($files.Count -ne 1 -or $files[0].Length -gt 4MB) { throw 'Require one bounded current report.' }
            return Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          }
          $desktop = Read-One local-data/ci-evidence/qol-desktop summary.json
          $startup = 'Windows startup unavailable in development staging'
          if ($desktop.success -ne $true -or $desktop.cleanupCompleted -ne $true -or $desktop.screenshotExportCompleted -ne $true -or
              @($desktop.cases).Count -ne 14 -or @($desktop.cases | Where-Object { $_.name -ne $startup -and $_.status -ne 'PASS' }).Count -or
              @($desktop.cases | Where-Object { $_.name -eq $startup -and $_.status -eq 'SKIP' }).Count -ne 1 -or
              $desktop.nativeShell.notification.freshTitleAndBodyObserved -ne $true -or $desktop.nativeShell.notification.physicalClickSent -ne $true -or
              $desktop.nativeShell.notification.nativeDestinationVerified -ne $true -or $desktop.nativeShell.trayQuit.exactProcessExited -ne $true -or
              $desktop.nativeShell.trayQuit.nativeFlushObserved -ne $true) { throw 'Every required native case, real notification click and tray Quit must pass.' }
          $pairing = Read-One local-data/ci-evidence/acceptance-continuation remaining-pairing.json
          if ($pairing.candidateSha256 -ne $env:CANDIDATE_SHA256 -or @($pairing.checks).Count -ne 1 -or
              @($pairing.checks | Where-Object { $_.mode -ne 'ux' -or $_.outcome -ne 'passed' }).Count) { throw 'The actual ten-stage UX did not pass.' }
          $wizard = Read-One local-data/ci-evidence/installer-ui summary.json
          $installerHash = (Get-FileHash -LiteralPath local-data/release-assets/TogetherServer-Setup-win-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($wizard.passed -ne $true -or $wizard.skipped -ne 0 -or $wizard.cleanupCompleted -ne $true -or
              $wizard.candidateAndInstallerUnchanged -ne $true -or $wizard.candidateSha256 -ne $env:CANDIDATE_SHA256 -or
              $wizard.installerSha256 -ne $installerHash -or (@($wizard.cases.choice | Sort-Object) -join ',') -ne 'DecideLater,Friend,Host' -or
              @($wizard.cases).Count -ne 3 -or @($wizard.cases | Where-Object state -ne 'Passed').Count) { throw 'All three real wizard choices and cleanup must pass.' }
          $app = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          if ((Get-FileHash -LiteralPath $app -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CANDIDATE_SHA256) { throw 'Candidate changed during acceptance.' }
          Copy-Item -LiteralPath $app -Destination local-data/release-assets/TogetherServer-win-x64.exe
          $assets = foreach ($name in @('TogetherServer-win-x64.exe','TogetherServer-Setup-win-x64.exe')) {
            $file = Get-Item -LiteralPath (Join-Path local-data/release-assets $name)
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath ($file.FullName+'.sha256') -Value "$hash  $name" -Encoding ascii
            @{name=$name;sha256=$hash;bytes=$file.Length;authenticode=[string](Get-AuthenticodeSignature -LiteralPath $file.FullName).Status}
          }
          @{passed=$true;compiledSourceRevision=$env:CANDIDATE_SOURCE_REVISION;verificationRevision=$env:GITHUB_SHA;
            candidateSha256=$env:CANDIDATE_SHA256;runId=$env:GITHUB_RUN_ID;priorRunId=$env:ORIGINAL_RUN_ID;
            assets=$assets;acceptance='Immutable repaired candidate, prior passed actual sharing/browser/LAN proof plus all remaining UX/native/installer checks. Synthetic game data; no real-game or WAN acceptance.'} |
            ConvertTo-Json -Depth 6 | Set-Content -LiteralPath local-data/release-assets/release-manifest.json -Encoding utf8

      - name: Always record the final immutable candidate sentinel
        id: sentinel
        if: always()
        run: |
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/acceptance-continuation -Force
          $candidate = Join-Path (Get-Location) 'local-data/release-candidate/TogetherServer.exe'
          $actual = if (Test-Path -LiteralPath $candidate) { (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null }
          @{ candidateSha256=$env:CANDIDATE_SHA256; finalCandidateSha256=$actual; unchanged=($actual -eq $env:CANDIDATE_SHA256);
            compiledSourceRevision=$env:CANDIDATE_SOURCE_REVISION; verificationRevision=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence.FullName 'final-candidate.json') -Encoding utf8
          if ($actual -ne $env:CANDIDATE_SHA256) { throw 'The pinned candidate is unavailable or changed.' }

      - name: Retain the exact installer candidate for targeted retries
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remaining-installer-candidate
          path: local-data/release-assets/TogetherServer-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 1

      - name: Retain only bounded acceptance evidence for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-continuation-evidence
          path: local-data/ci-evidence/
          if-no-files-found: error
          retention-days: 1

      - name: Retain verified package assets for one day
        if: ${{ success() && steps.package.outcome == 'success' && steps.sentinel.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-continuation-assets
          path: local-data/release-assets/
          if-no-files-found: error
          retention-days: 1
