name: Continue remaining Windows acceptance

on:
  push:
    branches: ['review/acceptance-continuation-*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: acceptance-continuation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remaining:
    name: Remaining acceptance for the immutable candidate
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CANDIDATE_SOURCE_REVISION: 9a99b2df3574c171dd02da9e6afe2dc59cf4de2f
      CANDIDATE_SHA256: 4fee3365429a379a13be5a26d08d238df6c1bb15dc46163141d9900188826b6a
      CANDIDATE_ARTIFACT_ID: '12247326896'
      CANDIDATE_ARTIFACT_SHA256: 3a6b8e02d4a9e907749370ba6f799361eb072de0b1caa534418462ccab4ab875
      ORIGINAL_RUN_ID: '39385522178'
      PRIOR_EXISTING_ARTIFACT_ID: '12248310527'
      PRIOR_EXISTING_ARTIFACT_SHA256: be561d1e108deb3cd0039e8c1c1aa33de8a65edca8f7edc747d04e50e9212bec
      PRIOR_LOOPBACK_ARTIFACT_ID: '12247088094'
      PRIOR_LOOPBACK_ARTIFACT_SHA256: a21e852ca7b869ff6be45d617b29bdd90b0feaa7747c8d341db813198a19abc1
      PRIOR_VISUAL_RUN_ID: '39385979932'
      PRIOR_VISUAL_SOURCE_REVISION: 41d9d86967a6625a32818e83b55719f8ba0bf3cb
    steps:
      - name: Check out the verification source and its ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require unchanged product source and a narrow verification-only descendant
        id: source
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'daltonstates/TogetherServer') { throw 'Unexpected acceptance repository.' }
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/acceptance-continuation -Force
          $revision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:GITHUB_SHA) { throw 'Verification checkout identity mismatch.' }
          git merge-base --is-ancestor $env:CANDIDATE_SOURCE_REVISION HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Verification source must descend from the compiled candidate.' }
          $changed = @(git diff --no-renames --name-only $env:CANDIDATE_SOURCE_REVISION HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare verification and compiled source.' }
          $allowedFiles = @(
            '.github/workflows/acceptance-continuation.yml',
            '.github/workflows/windows-ci.yml',
            '.github/workflows/ui-redesign-visual-review.yml',
            'checks/TogetherServer.CompanionChecks/CoreRemoteJourney.cs',
            'checks/TogetherServer.CompanionChecks/CoreRemoteJourney.Passwords.cs',
            'checks/TogetherServer.CompanionChecks/LocalPairingLabJourney.cs',
            'checks/TogetherServer.CompanionChecks/LocalPairingLabUxJourney.cs',
            'checks/qol-desktop-smoke.ps1',
            'checks/qol-native-shell-helper.ps1',
            'checks/installer-ui-smoke.ps1',
            'ui/checks/qol-browser-smoke.mjs'
          )
          if (@($changed | Where-Object { $_ -notin $allowedFiles -and $_ -notmatch '^docs/[A-Za-z0-9_./-]+\.md$' }).Count) {
            throw 'Only the fixed acceptance checks, named workflows and Markdown delivery records may differ from the candidate.'
          }
          git diff --exit-code $env:CANDIDATE_SOURCE_REVISION HEAD -- src ui/src ui/package.json ui/package-lock.json global.json .node-version
          if ($LASTEXITCODE -ne 0) { throw 'Application, bundled UI or pinned tool/dependency source changed.' }
          if (@(git status --porcelain --untracked-files=no).Count) { throw 'Verification requires a clean tracked checkout.' }
          @{ candidateSourceRevision=$env:CANDIDATE_SOURCE_REVISION; verificationRevision=$revision; allowedSourceChanges=$changed;
            originalRunId=$env:ORIGINAL_RUN_ID; candidateArtifactId=$env:CANDIDATE_ARTIFACT_ID;
            candidateArtifactDigest=('sha256:'+$env:CANDIDATE_ARTIFACT_SHA256); candidateSha256=$env:CANDIDATE_SHA256;
            continuationRunId=$env:GITHUB_RUN_ID; continuationAttempt=$env:GITHUB_RUN_ATTEMPT;
            boundary='One dedicated hosted Windows runner; only incomplete synthetic/loopback/native/installer acceptance. No real game, WAN or publication.' } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $evidence.FullName 'context.json') -Encoding utf8

      - name: Retrieve and verify the original candidate artifact without rebuilding it
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
          try {
            $uri = "https://api.github.com/repos/daltonstates/TogetherServer/actions/artifacts/$env:CANDIDATE_ARTIFACT_ID"
            $artifact = Invoke-RestMethod -Uri $uri -Headers $headers
            if ([string]$artifact.id -ne $env:CANDIDATE_ARTIFACT_ID -or $artifact.name -ne 'windows-candidate' -or
                $artifact.expired -ne $false -or [string]$artifact.workflow_run.id -ne $env:ORIGINAL_RUN_ID -or
                $artifact.workflow_run.head_sha -ne $env:CANDIDATE_SOURCE_REVISION -or
                $artifact.digest -ne ('sha256:'+$env:CANDIDATE_ARTIFACT_SHA256) -or $artifact.size_in_bytes -gt 128MB) {
              throw 'Original candidate artifact provenance mismatch.'
            }
            $archive = Join-Path $env:RUNNER_TEMP 'acceptance-candidate-12247326896.zip'
            try { Invoke-WebRequest -Uri ($uri+'/zip') -Headers $headers -OutFile $archive }
            catch { throw 'The pinned candidate artifact download failed.' }
          } finally { $headers.Clear() }
          $zipHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne $env:CANDIDATE_ARTIFACT_SHA256 -or (Get-Item -LiteralPath $archive).Length -ne $artifact.size_in_bytes) {
            throw 'The original candidate ZIP digest or size differs from its pinned metadata.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath . -Force
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $hash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = (Get-Item -LiteralPath $candidate).VersionInfo.ProductVersion
          if ($hash -ne $env:CANDIDATE_SHA256 -or $version -ne "0.3.2.2+$env:CANDIDATE_SOURCE_REVISION" -or
              (Get-AuthenticodeSignature -LiteralPath $candidate).Status -ne 'NotSigned') { throw 'Downloaded application identity mismatch.' }
          @{ artifactId=$artifact.id; artifactName=$artifact.name; artifactRunId=$artifact.workflow_run.id;
            sourceRevision=$artifact.workflow_run.head_sha; artifactDigest=$artifact.digest; zipSha256=$zipHash;
            candidateSha256=$hash; productVersion=$version } |
            ConvertTo-Json | Set-Content -LiteralPath local-data/ci-evidence/acceptance-continuation/candidate.json -Encoding utf8

      - name: Bind completed original jobs, fifteen Existing checks, loopback and visual proof
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
          $api = 'https://api.github.com/repos/daltonstates/TogetherServer/actions'
          function Prior-Artifact([string]$id, [string]$name, [string]$digest, [string]$folder) {
            $item = Invoke-RestMethod -Uri "$api/artifacts/$id" -Headers $headers
            if ([string]$item.id -ne $id -or $item.name -ne $name -or $item.expired -ne $false -or
                [string]$item.workflow_run.id -ne $env:ORIGINAL_RUN_ID -or $item.workflow_run.head_sha -ne $env:CANDIDATE_SOURCE_REVISION -or
                $item.digest -ne "sha256:$digest" -or $item.size_in_bytes -gt 1MB) { throw 'Prior report artifact identity mismatch.' }
            $archive = Join-Path $env:RUNNER_TEMP ("prior-$id.zip")
            Invoke-WebRequest -Uri "$api/artifacts/$id/zip" -Headers $headers -OutFile $archive
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $digest) { throw 'Prior report archive digest mismatch.' }
            $destination = Join-Path 'local-data/previous-acceptance' $folder
            Expand-Archive -LiteralPath $archive -DestinationPath $destination
            return [IO.Path]::GetFullPath($destination)
          }
          try {
            $run = Invoke-RestMethod -Uri "$api/runs/$env:ORIGINAL_RUN_ID" -Headers $headers
            $jobs = @((Invoke-RestMethod -Uri "$api/runs/$env:ORIGINAL_RUN_ID/jobs?filter=all&per_page=100" -Headers $headers).jobs)
            if ($run.head_sha -ne $env:CANDIDATE_SOURCE_REVISION -or $run.workflow_id -ne 367811679 -or $run.run_attempt -ne 1 -or
                $run.status -ne 'completed' -or $run.conclusion -ne 'failure' -or $jobs.Count -ne 12) { throw 'Original acceptance run changed or has an unexpected boundary.' }
            $passedJobs = @{
              candidate=118504306525; 'Verify QolApi'=118505244777; 'Verify Rehearsal'=118505244966;
              'Verify 0.3.0 compatibility'=118505244861; 'Verify 0.3.1 compatibility'=118505244770;
              'Verify 0.3.2 compatibility'=118505244863; 'Verify 0.3.2.1 compatibility'=118505244928
            }
            foreach ($entry in $passedJobs.GetEnumerator()) {
              $match = @($jobs | Where-Object { $_.id -eq $entry.Value -and $_.name -eq $entry.Key -and $_.run_attempt -eq 1 -and $_.conclusion -eq 'success' })
              if ($match.Count -ne 1) { throw "Prior passing job is missing: $($entry.Key)." }
            }
            foreach ($id in @(118505244866,118505244953,118505244821,118505244810)) {
              if (@($jobs | Where-Object { $_.id -eq $id -and $_.conclusion -eq 'failure' -and $_.run_attempt -eq 1 }).Count -ne 1) { throw 'An original failed boundary changed.' }
            }
            $existingRoot = Prior-Artifact $env:PRIOR_EXISTING_ARTIFACT_ID 'qol-windows-evidence-Existing' $env:PRIOR_EXISTING_ARTIFACT_SHA256 'existing'
            $loopbackRoot = Prior-Artifact $env:PRIOR_LOOPBACK_ARTIFACT_ID 'local-pairing-evidence' $env:PRIOR_LOOPBACK_ARTIFACT_SHA256 'pairing'
            $visual = Invoke-RestMethod -Uri "$api/runs/$env:PRIOR_VISUAL_RUN_ID" -Headers $headers
            if ($visual.head_sha -ne $env:PRIOR_VISUAL_SOURCE_REVISION -or $visual.workflow_id -ne 380917599 -or
                $visual.run_attempt -ne 1 -or $visual.status -ne 'completed' -or $visual.conclusion -ne 'success') { throw 'The completed visual acceptance identity changed.' }
          } finally { $headers.Clear() }
          $files = @(Get-ChildItem -LiteralPath $existingRoot -Filter release-gate-report.json -File -Recurse)
          if ($files.Count -ne 1 -or $files[0].Length -gt 256KB) { throw 'Prior Existing report is ambiguous or oversized.' }
          $existing = Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          $expected = @('Git whitespace check','Desktop diagnostic isolation','Check runner listener identity','UI lint','UI unit tests','Locked application restore',
            'TogetherServer.Checks','TogetherServer.ValheimChecks','TogetherServer.FactorioChecks','TogetherServer.TerrariaChecks','TogetherServer.MinecraftChecks',
            'TogetherServer.MinecraftSetupChecks','TogetherServer.CustomChecks','TogetherServer.SharedHistoryChecks','TogetherServer.UpdateChecks')
          if ($existing.suite -ne 'Existing' -or $existing.candidate.sourceRevision -ne $env:CANDIDATE_SOURCE_REVISION -or
              $existing.candidate.sha256.ToLowerInvariant() -ne $env:CANDIDATE_SHA256 -or
              $existing.candidate.productVersion -ne "0.3.2.2+$env:CANDIDATE_SOURCE_REVISION" -or @($existing.checks).Count -ne 16) { throw 'Prior Existing report does not bind the immutable candidate.' }
          foreach ($name in $expected) {
            if (@($existing.checks | Where-Object { $_.name -eq $name -and $_.outcome -eq 'passed' }).Count -ne 1) { throw "Prior Existing check missing: $name" }
          }
          if (@($existing.checks | Where-Object { $_.name -eq 'Core remote journey' -and $_.outcome -eq 'failed' }).Count -ne 1) { throw 'The failed Core boundary differs from the recorded report.' }
          $context = Get-Content -LiteralPath (Join-Path $loopbackRoot 'candidate.json') -Raw | ConvertFrom-Json
          $loopback = Get-Content -LiteralPath (Join-Path $loopbackRoot 'loopback/report.json') -Raw | ConvertFrom-Json
          $expectedLoopback = @('isolated-apps','pinned-pairing','separate-permissions-and-consent','signed-chat','synthetic-stop-copy-receipts',
            'password-permission-revoke','unsupported-password-source-denied','guided-hosting','local-copy-hosting','lost-response-cleanup','cleanup')
          if ($context.sourceRevision -ne $env:CANDIDATE_SOURCE_REVISION -or $context.candidateSha256 -ne $env:CANDIDATE_SHA256 -or
              $context.finalCandidateSha256 -ne $env:CANDIDATE_SHA256 -or $loopback.outcome -ne 'Passed' -or @($loopback.stages).Count -ne 11 -or
              @($loopback.stages | Where-Object { $_.state -ne 'Passed' -or $_.id -notin $expectedLoopback }).Count -ne 0 -or
              @($loopback.stages.id | Select-Object -Unique).Count -ne 11 -or $loopback.cleanup.jobActiveProcesses -ne 0 -or
              $loopback.windowObservation.state -ne 'Passed' -or $loopback.windowObservation.peakVisibleOwnedWindows -ne 0) { throw 'The original loopback proof is incomplete.' }
          git diff --exit-code $env:PRIOR_VISUAL_SOURCE_REVISION HEAD -- src ui/src ui/package.json ui/package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Completed visual evidence no longer matches the product source.' }
          Copy-Item -LiteralPath $files[0].FullName -Destination local-data/ci-evidence/acceptance-continuation/prior-existing.json
          Copy-Item -LiteralPath (Join-Path $loopbackRoot 'loopback/report.json') -Destination local-data/ci-evidence/acceptance-continuation/prior-loopback.json
          @{ passedJobs=@($passedJobs.Keys); existingPassed=$expected; loopbackPassed=$expectedLoopback;
            visualRunId=$env:PRIOR_VISUAL_RUN_ID; priorFailuresRetained=$true; compiledSourceRevision=$env:CANDIDATE_SOURCE_REVISION;
            candidateSha256=$env:CANDIDATE_SHA256 } | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath local-data/ci-evidence/acceptance-continuation/prior-proof.json -Encoding utf8
          'PASS reused fifteen completed Existing checks, six completed suites, eleven loopback stages and completed visual proof; no passing suite rerun.'

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install the pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Prepare only the source dispatcher and locked browser dependencies
        id: setup
        run: |
          $ErrorActionPreference = 'Stop'
          npm --prefix ui ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked browser dependency installation failed.' }
          node -e 'if (require("./ui/node_modules/playwright/package.json").version !== "1.64.0") throw new Error("Playwright version mismatch");'
          if ($LASTEXITCODE -ne 0) { throw 'Expected locked Playwright 1.64.0.' }
          ./ui/node_modules/.bin/playwright.cmd install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Locked headless browser installation failed.' }
          dotnet restore TogetherServer.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked verification restore failed.' }
          dotnet build checks/TogetherServer.CompanionChecks/TogetherServer.CompanionChecks.csproj -c Release --no-restore -p:CodeOnlyVerification=true
          if ($LASTEXITCODE -ne 0) { throw 'Verification dispatcher compilation failed.' }
          if ((Get-FileHash local-data/release-candidate/TogetherServer.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CANDIDATE_SHA256) {
            throw 'Preparing source dependencies changed the immutable candidate.'
          }

      - name: Complete only Core remote and the incomplete Existing stages
        id: existing
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.prior.outcome == 'success' && steps.setup.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $harness = (Resolve-Path checks/TogetherServer.CompanionChecks/bin/Release/net10.0-windows/TogetherServer.CompanionChecks.dll).Path
          $results = [Collections.Generic.List[object]]::new()
          function Remaining([string]$name, [scriptblock]$action) {
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $index = $results.Count + 1
            $outcome = 'passed'
            $diagnostic = $null
            $global:LASTEXITCODE = 0
            try {
              & $action *>&1 | Tee-Object -FilePath ("local-data/ci-evidence/acceptance-continuation/existing-{0:d2}.log" -f $index)
              if ($LASTEXITCODE -ne 0) { throw "The fixed check exited with code $LASTEXITCODE." }
            } catch {
              $outcome = 'failed'
              $diagnostic = $_.Exception.GetType().Name
              Write-Host "FAIL remaining Existing: $name ($diagnostic). Inspect the bounded check log."
            }
            $results.Add(@{ name=$name; outcome=$outcome; elapsedSeconds=$clock.Elapsed.TotalSeconds; failureType=$diagnostic })
            @{ compiledSourceRevision=$env:CANDIDATE_SOURCE_REVISION; verificationRevision=$env:GITHUB_SHA;
              candidateSha256=$env:CANDIDATE_SHA256; checks=@($results.ToArray()) } | ConvertTo-Json -Depth 5 |
              Set-Content -LiteralPath local-data/ci-evidence/acceptance-continuation/remaining-existing.json -Encoding utf8
          }
          Remaining 'Core remote journey' { dotnet $harness $candidate --core-remote-journey }
          Remaining 'World-load packaged rehearsal' { dotnet $harness $candidate --world-load-rehearsal }
          Remaining 'Shared Worlds packaged journey' { dotnet $harness $candidate --shared-world-journey }
          Remaining 'Staging LiveSave owner action' { dotnet $harness $candidate --live-save-action }
          Remaining 'Shared LiveSave packaged transfer journey' { dotnet $harness $candidate --shared-live-transfer-journey }
          Remaining 'TogetherServer.CompanionChecks' { dotnet $harness $candidate }
          Remaining 'Solution formatting' { dotnet format TogetherServer.slnx --verify-no-changes --no-restore }
          Remaining 'Packaged served smoke' { ./checks/served-smoke.ps1 -AppPath $candidate }
          Remaining 'Production plus staging isolation smoke' { ./checks/staging-smoke.ps1 -AppPath $candidate }
          Remaining 'Packaged hidden desktop smoke' { ./checks/desktop-smoke.ps1 -AppPath $candidate -Port 0 -AllowInteractiveTests }
          Remaining 'Packaged interactive desktop smoke' { ./checks/desktop-smoke.ps1 -AppPath $candidate -Port 0 -Interactive -AllowInteractiveTests }
          Remaining 'Update handoff smoke' { ./checks/update-handoff-smoke.ps1 -AppPath $candidate -AllowInteractiveTests }
          if ($results.Count -ne 12 -or @($results | Where-Object outcome -ne 'passed').Count -ne 0) { throw 'At least one remaining Existing check failed; every independent check was attempted.' }

      - name: Prepare the matching prior UI for the outstanding browser comparison
        id: baseline
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.prior.outcome == 'success' && steps.setup.outcome == 'success' }}
        run: |
          git worktree add --detach local-data/ui-before a1eb74e6518900ad2087549c174d4486d5a41b3a
          if ($LASTEXITCODE -ne 0) { throw 'Prior UI worktree creation failed.' }
          Push-Location local-data/ui-before/ui
          try {
            npm ci --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Prior UI dependency installation failed.' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'Prior comparison UI compilation failed.' }
          } finally { Pop-Location }

      - name: Complete the actual bundled browser journeys
        id: browser
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.prior.outcome == 'success' && steps.setup.outcome == 'success' && steps.baseline.outcome == 'success' }}
        run: |
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $baseline = (Resolve-Path local-data/ui-before/ui/dist).Path
          node ui/checks/qol-browser-smoke.mjs --app-path $candidate --allow-interactive-tests --output-dir local-data/ci-evidence/qol-browser --baseline-ui-dir $baseline *>&1 |
            Tee-Object -FilePath local-data/ci-evidence/acceptance-continuation/browser.log
          if ($LASTEXITCODE -ne 0) { throw 'Outstanding bundled browser acceptance failed.' }

      - name: Complete QoL native desktop acceptance
        id: desktop
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.prior.outcome == 'success' && steps.setup.outcome == 'success' }}
        run: |
          # Explicit opt-in applies only to this dedicated hosted runner's disposable desktop.
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          ./checks/qol-desktop-smoke.ps1 -AppPath $candidate -AllowInteractiveTests *>&1 |
            Tee-Object -FilePath local-data/ci-evidence/acceptance-continuation/qol-desktop.log

      - name: Complete actual window chrome acceptance
        id: chrome
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.prior.outcome == 'success' && steps.setup.outcome == 'success' }}
        run: |
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          ./checks/window-chrome-smoke.ps1 -AppPath $candidate -AllowInteractiveTests *>&1 |
            Tee-Object -FilePath local-data/ci-evidence/acceptance-continuation/window-chrome.log

      - name: Complete assigned LAN API and ten-stage Host/Friend UX
        id: pairing
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.prior.outcome == 'success' && steps.setup.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $harness = (Resolve-Path checks/TogetherServer.CompanionChecks/bin/Release/net10.0-windows/TogetherServer.CompanionChecks.dll).Path
          $up = @(Get-NetAdapter | Where-Object Status -eq 'Up' | ForEach-Object InterfaceIndex)
          $lan = @(Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.AddressState.ToString() -eq 'Preferred' -and
            $_.InterfaceIndex -in $up -and $_.IPAddress -match '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)' } |
            Sort-Object InterfaceIndex,IPAddress | Select-Object -First 1)
          if ($lan.Count -ne 1) { throw 'One assigned preferred private IPv4 address is required.' }
          $labRoot = Join-Path (Get-Location) 'local-data/local-pairing-lab'
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/local-pairing -Force
          $results = [Collections.Generic.List[object]]::new()
          foreach ($mode in @('lan-api','ux')) {
            $outcome = 'passed'
            try {
              $before = @(if (Test-Path -LiteralPath $labRoot) { Get-ChildItem -LiteralPath $labRoot -Directory | ForEach-Object Name })
              $arguments = @($harness,$candidate,'--local-pairing-lab-journey','--allow-windowless-lab','--lab-lan-address',$lan[0].IPAddress)
              if ($mode -eq 'ux') { $arguments += '--lab-ux' }
              dotnet @arguments
              $code = $LASTEXITCODE
              $created = @(Get-ChildItem -LiteralPath $labRoot -Directory | Where-Object Name -notin $before)
              if ($created.Count -ne 1 -or $created[0].Name -notmatch '^run-[0-9a-f]{32}$') { throw 'One exact new lab case is required.' }
              $reportPath = Join-Path $created[0].FullName 'report.json'
              if ((Get-Item -LiteralPath $reportPath).Length -gt 256KB) { throw 'Lab report exceeds its bound.' }
              $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
              $destination = New-Item -ItemType Directory -Path (Join-Path $evidence.FullName $mode) -Force
              $report | Select-Object schema,runId,startedUtc,endedUtc,durationMs,mode,physicalPcCount,outcome,failedStage,failureCode,
                stages,uxStagePassed,apiHostChange,branchTransfer,cleanup,resources,windowObservation,acceptance |
                ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $destination.FullName 'report.json') -Encoding utf8
              $expected = @('isolated-apps','two-ended-ux','cleanup')
              if ($mode -eq 'lan-api') {
                $expected = @('isolated-apps','pinned-pairing','separate-permissions-and-consent','signed-chat','synthetic-stop-copy-receipts',
                  'password-permission-revoke','unsupported-password-source-denied','guided-hosting','local-copy-hosting','lost-response-cleanup','cleanup',
                  'new-host-notice','new-host-authenticated-connect','new-host-permission-isolation','new-host-stop-and-transfer',
                  'new-host-restart-reconnect','new-host-revocation-isolation','new-host-receipt-confirmed')
              } else {
                $uxRoot = Join-Path $created[0].FullName 'ux'
                $uxPath = Join-Path $uxRoot 'report.json'
                if ((Get-Item -LiteralPath $uxPath).Length -gt 256KB) { throw 'UX report exceeds its bound.' }
                $ux = Get-Content -LiteralPath $uxPath -Raw | ConvertFrom-Json
                $ux | Select-Object ok,stages,errors,failedRequests,canceledRequests,controlPolicyChanges,boundaries,guidedHosting,signedDiscovery,failurePathCoverage,failure |
                  ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $destination.FullName 'ux-report.json') -Encoding utf8
                $pictures = @(Get-ChildItem -LiteralPath $uxRoot -Filter '*.png' -File)
                if ($pictures.Count -lt 1 -or $pictures.Count -gt 64) { throw 'Masked UX capture count is outside its bound.' }
                foreach ($picture in $pictures) {
                  if ($picture.Name -notmatch '^(?:[0-9]{2}-[a-z0-9-]+|failure-[0-9]+)\.png$' -or $picture.Length -gt 16MB -or
                      ($picture.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Masked UX capture identity is invalid.' }
                  Copy-Item -LiteralPath $picture.FullName -Destination (Join-Path $destination.FullName $picture.Name)
                }
                if ($ux.ok -ne $true -or @($ux.stages).Count -ne 10 -or @($ux.stages | Where-Object passed -ne $true).Count -ne 0 -or
                    @($ux.errors).Count -ne 0 -or @($ux.failedRequests).Count -ne 0 -or $ux.failurePathCoverage.hostingGrantWithdrawal -ne $true -or
                    $ux.failurePathCoverage.localConsentAndCancel -ne $true -or $ux.guidedHosting.startRequests -ne 1 -or
                    $ux.guidedHosting.successfulStartResponses -ne 1 -or $ux.signedDiscovery.exactCandidateSession -ne $true -or
                    $ux.signedDiscovery.exactAdvertisedEndpoint -ne $true -or $ux.signedDiscovery.exactConnectSelection -ne $true) { throw 'Ten actual UX stages and exact one-Start/signed-Connect proof must all pass.' }
              }
              if ($code -ne 0 -or $report.outcome -ne 'Passed' -or @($report.stages).Count -ne $expected.Count -or
                  @($report.stages | Where-Object { $_.state -ne 'Passed' -or $_.id -notin $expected }).Count -ne 0 -or
                  @($report.stages.id | Select-Object -Unique).Count -ne $expected.Count -or $report.cleanup.jobActiveProcesses -ne 0 -or
                  $report.windowObservation.state -ne 'Passed' -or $report.windowObservation.samples -lt 1 -or
                  $report.windowObservation.peakVisibleOwnedWindows -ne 0) { throw "Every $mode stage and exact window/job cleanup must pass." }
              if ($mode -eq 'lan-api' -and ($report.apiHostChange.discoveredHost -ne $true -or $report.apiHostChange.connectedOwner -ne $true -or
                  $report.apiHostChange.connectedObserver -ne $true -or $report.apiHostChange.transferredCandidateCopy -ne $true -or
                  $report.apiHostChange.restartedHostConnections -ne $true -or $report.apiHostChange.isolatedRevocation -ne $true)) { throw 'A required hosting, transfer, restart or revocation proof is missing.' }
            } catch { $outcome = 'failed'; Write-Host "FAIL remaining $mode lab: inspect its redacted report." }
            $results.Add(@{mode=$mode;outcome=$outcome})
            if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CANDIDATE_SHA256) { throw 'Immutable candidate changed during the lab.' }
          }
          @{candidateSha256=$env:CANDIDATE_SHA256;verificationRevision=$env:GITHUB_SHA;checks=@($results.ToArray())} | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath local-data/ci-evidence/acceptance-continuation/remaining-pairing.json -Encoding utf8
          if ($results.Count -ne 2 -or @($results | Where-Object outcome -ne 'passed').Count -ne 0) { throw 'At least one remaining lab failed; LAN API and UX were both attempted.' }

      - name: Require every outstanding surface to pass before installer acceptance
        id: aggregate
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.prior.outcome == 'success' && steps.setup.outcome == 'success' }}
        env:
          EXISTING_OUTCOME: ${{ steps.existing.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          DESKTOP_OUTCOME: ${{ steps.desktop.outcome }}
          CHROME_OUTCOME: ${{ steps.chrome.outcome }}
          PAIRING_OUTCOME: ${{ steps.pairing.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('EXISTING_OUTCOME','BASELINE_OUTCOME','BROWSER_OUTCOME','DESKTOP_OUTCOME','CHROME_OUTCOME','PAIRING_OUTCOME')) {
            if ([Environment]::GetEnvironmentVariable($name) -ne 'success') { throw "Required remaining surface did not pass: $name" }
          }
          function One-Report([string]$directory, [string]$name) {
            $files = @(Get-ChildItem -LiteralPath $directory -Filter $name -File -Recurse)
            if ($files.Count -ne 1 -or $files[0].Length -gt 4MB) { throw 'One bounded result report is required for each surface.' }
            return Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          }
          $existing = One-Report 'local-data/ci-evidence/acceptance-continuation' 'remaining-existing.json'
          $expected = @('Core remote journey','World-load packaged rehearsal','Shared Worlds packaged journey','Staging LiveSave owner action',
            'Shared LiveSave packaged transfer journey','TogetherServer.CompanionChecks','Solution formatting','Packaged served smoke',
            'Production plus staging isolation smoke','Packaged hidden desktop smoke','Packaged interactive desktop smoke','Update handoff smoke')
          if ($existing.candidateSha256 -ne $env:CANDIDATE_SHA256 -or $existing.verificationRevision -ne $env:GITHUB_SHA -or
              @($existing.checks).Count -ne 12 -or @($existing.checks | Where-Object { $_.outcome -ne 'passed' -or $_.name -notin $expected }).Count -ne 0 -or
              @($existing.checks.name | Select-Object -Unique).Count -ne 12) { throw 'Every incomplete Existing check must pass without inventory changes.' }
          $browser = One-Report 'local-data/ci-evidence/qol-browser' 'qol-browser-report.json'
          if ($browser.outcome -ne 'passed' -or @($browser.browserErrors).Count -ne 0 -or @($browser.failedRequests).Count -ne 0 -or
              @($browser.optionalGuides).Count -ne 2 -or @($browser.optionalGuides | Where-Object {
                $_.actualWelcomeChoices -ne $true -or $_.persistedDeferral -ne $true -or $_.reopenedFromHeader -ne $true }).Count -ne 0) { throw 'The actual browser journeys or both optional guide choices did not pass.' }
          $desktop = One-Report 'local-data/ci-evidence/qol-desktop' 'summary.json'
          $coveredStartup = 'Windows startup unavailable in development staging'
          if ($desktop.success -ne $true -or $desktop.cleanupCompleted -ne $true -or $desktop.screenshotExportCompleted -ne $true -or
              @($desktop.cases).Count -ne 14 -or @($desktop.cases | Where-Object { $_.name -ne $coveredStartup -and $_.status -ne 'PASS' }).Count -ne 0 -or
              @($desktop.cases | Where-Object { $_.name -eq $coveredStartup -and $_.status -eq 'SKIP' }).Count -ne 1 -or
              $desktop.nativeShell.notification.freshTitleAndBodyObserved -ne $true -or $desktop.nativeShell.notification.physicalClickSent -ne $true -or
              $desktop.nativeShell.notification.nativeDestinationVerified -ne $true -or $desktop.nativeShell.trayQuit.nativeFlushObserved -ne $true -or
              $desktop.nativeShell.trayQuit.exactProcessExited -ne $true) { throw 'Required actual native cases, OS delivery/click or Explorer Quit proof are incomplete.' }
          $chrome = One-Report 'local-data/ci-evidence/window-chrome' 'result.json'
          if ($chrome.passed -ne $true -or $chrome.requiredScopeCompleted -ne $true -or
              $chrome.candidateSha256.ToLowerInvariant() -ne $env:CANDIDATE_SHA256) { throw 'Required native window chrome scope did not pass for this candidate.' }
          $pairing = One-Report 'local-data/ci-evidence/acceptance-continuation' 'remaining-pairing.json'
          if ($pairing.candidateSha256 -ne $env:CANDIDATE_SHA256 -or @($pairing.checks).Count -ne 2 -or
              @($pairing.checks | Where-Object outcome -ne 'passed').Count -ne 0) { throw 'Both outstanding lab modes must pass.' }
          if ((Get-FileHash local-data/release-candidate/TogetherServer.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CANDIDATE_SHA256) { throw 'Candidate bytes changed.' }
          @{ passed=$true; compiledSourceRevision=$env:CANDIDATE_SOURCE_REVISION; verificationRevision=$env:GITHUB_SHA;
            candidateSha256=$env:CANDIDATE_SHA256; originalRunId=$env:ORIGINAL_RUN_ID; priorExistingChecks=15; completedExistingChecks=$expected;
            priorOtherSuites=6; priorLoopbackStages=11; remainingLanStages=18; actualUxStages=10;
            nativeRequiredCases=13; developmentStartupCoveredByProductionChecks=$true; requiredWindowChromePassed=$true;
            optionalWindowChromeSkips=$chrome.skipped; artifactRetentionDays=1; continuationRunId=$env:GITHUB_RUN_ID } | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath local-data/ci-evidence/acceptance-continuation/runtime-acceptance.json -Encoding utf8
          'PASS composed immutable-candidate acceptance: prior passing checks retained, every remaining runtime surface passed.'

      - name: Install the pinned installer compiler after all runtime surfaces pass
        id: compiler
        if: ${{ !cancelled() && steps.aggregate.outcome == 'success' }}
        run: |
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerSetup
          if ((Get-FileHash -LiteralPath $compilerSetup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Pinned installer compiler digest mismatch.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $compilerSetup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') { throw 'Installer compiler publisher mismatch.' }
          $compilerRoot = Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6'
          $setup = Start-Process -FilePath $compilerSetup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$compilerRoot`"") -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or !(Test-Path -LiteralPath (Join-Path $compilerRoot 'ISCC.exe'))) { throw 'Installer compiler installation failed.' }

      - name: Wrap the immutable app bytes in the installer
        id: installer
        if: ${{ !cancelled() && steps.aggregate.outcome == 'success' && steps.compiler.outcome == 'success' }}
        run: |
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          ./scripts/build-installer.ps1 -AppPath $candidate -OutputDirectory local-data/release-assets -CompilerPath (Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6/ISCC.exe') *>&1 |
            Tee-Object -FilePath local-data/ci-evidence/acceptance-continuation/installer-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }

      - name: Complete silent installer integration acceptance
        id: silent
        continue-on-error: true
        if: ${{ !cancelled() && steps.aggregate.outcome == 'success' && steps.installer.outcome == 'success' }}
        run: |
          ./checks/installer-smoke.ps1 -InstallerPath local-data/release-assets/TogetherServer-Setup-win-x64.exe -ExpectedAppPath local-data/release-candidate/TogetherServer.exe -AllowInteractiveTests *>&1 |
            Tee-Object -FilePath local-data/ci-evidence/acceptance-continuation/installer-smoke.log

      - name: Complete all three actual installer wizard choices
        id: wizard
        continue-on-error: true
        if: ${{ !cancelled() && steps.aggregate.outcome == 'success' && steps.installer.outcome == 'success' }}
        run: |
          # The UI script refuses any installed/running app; a failed silent cleanup cannot be bypassed.
          ./checks/installer-ui-smoke.ps1 -InstallerPath local-data/release-assets/TogetherServer-Setup-win-x64.exe -ExpectedAppPath local-data/release-candidate/TogetherServer.exe -AllowInteractiveTests *>&1 |
            Tee-Object -FilePath local-data/ci-evidence/acceptance-continuation/installer-ui.log

      - name: Require both installer checks and retain the exact verified package
        id: package
        if: ${{ !cancelled() && steps.aggregate.outcome == 'success' && steps.installer.outcome == 'success' }}
        env:
          SILENT_OUTCOME: ${{ steps.silent.outcome }}
          WIZARD_OUTCOME: ${{ steps.wizard.outcome }}
        run: |
          if ($env:SILENT_OUTCOME -ne 'success' -or $env:WIZARD_OUTCOME -ne 'success') { throw 'Required installer integration or actual wizard acceptance did not pass.' }
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CANDIDATE_SHA256) { throw 'Verified candidate bytes changed during acceptance.' }
          $ui = @(Get-ChildItem -LiteralPath local-data/ci-evidence/installer-ui -Filter summary.json -Recurse -File)
          if ($ui.Count -ne 1) { throw 'One exact actual installer UI report is required.' }
          $report = Get-Content -LiteralPath $ui[0].FullName -Raw | ConvertFrom-Json
          if ($report.passed -ne $true -or $report.skipped -ne 0 -or $report.cleanupCompleted -ne $true -or
              @($report.cases).Count -ne 3 -or @($report.cases | Where-Object state -ne 'Passed').Count) { throw 'Three actual wizard choices and exact cleanup did not all pass.' }
          Copy-Item -LiteralPath $candidate -Destination local-data/release-assets/TogetherServer-win-x64.exe
          $assets = foreach ($name in @('TogetherServer-win-x64.exe', 'TogetherServer-Setup-win-x64.exe')) {
            $file = Get-Item -LiteralPath (Join-Path local-data/release-assets $name)
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath ($file.FullName+'.sha256') -Value "$hash  $name" -Encoding ascii
            @{ name=$name; sha256=$hash; bytes=$file.Length; authenticode=[string](Get-AuthenticodeSignature -LiteralPath $file.FullName).Status }
          }
          @{ version='0.3.2.2'; compiledSourceRevision=$env:CANDIDATE_SOURCE_REVISION; verificationRevision=$env:GITHUB_SHA;
            candidateSha256=$env:CANDIDATE_SHA256; originalRunId=$env:ORIGINAL_RUN_ID; candidateArtifactId=$env:CANDIDATE_ARTIFACT_ID;
            candidateArtifactDigest=('sha256:'+$env:CANDIDATE_ARTIFACT_SHA256); continuationRunId=$env:GITHUB_RUN_ID;
            priorExistingArtifactId=$env:PRIOR_EXISTING_ARTIFACT_ID; priorExistingDigest=('sha256:'+$env:PRIOR_EXISTING_ARTIFACT_SHA256);
            priorLoopbackArtifactId=$env:PRIOR_LOOPBACK_ARTIFACT_ID; priorLoopbackDigest=('sha256:'+$env:PRIOR_LOOPBACK_ARTIFACT_SHA256);
            assets=$assets; acceptance='Exact original candidate; composed prior proof plus all remaining required checks on one dedicated runner. No release was published; real-game/WAN acceptance is separate.' } |
            ConvertTo-Json -Depth 6 | Set-Content -LiteralPath local-data/release-assets/release-manifest.json -Encoding utf8

      - name: Always record the final immutable candidate sentinel
        id: sentinel
        if: always()
        run: |
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/acceptance-continuation -Force
          $candidate = Join-Path (Get-Location) 'local-data/release-candidate/TogetherServer.exe'
          $actual = if (Test-Path -LiteralPath $candidate) { (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null }
          @{ candidateSha256=$env:CANDIDATE_SHA256; finalCandidateSha256=$actual; unchanged=($actual -eq $env:CANDIDATE_SHA256);
            compiledSourceRevision=$env:CANDIDATE_SOURCE_REVISION; verificationRevision=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence.FullName 'final-candidate.json') -Encoding utf8
          if ($actual -ne $env:CANDIDATE_SHA256) { throw 'The pinned candidate is unavailable or changed.' }

      - name: Retain only bounded acceptance evidence for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-continuation-evidence
          path: local-data/ci-evidence/
          if-no-files-found: error
          retention-days: 1

      - name: Retain verified package assets for one day
        if: ${{ success() && steps.package.outcome == 'success' && steps.sentinel.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-continuation-assets
          path: local-data/release-assets/
          if-no-files-found: error
          retention-days: 1
