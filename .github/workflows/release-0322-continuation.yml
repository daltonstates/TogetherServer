name: Finish verified 0.3.2.2 candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  finish:
    name: Remaining acceptance and installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CANDIDATE_SOURCE_REVISION: 3897418c89902fb93e71a71bd7590ef3709453a3
      CANDIDATE_SHA256: 273e97aaf0c402b84cad4930f3d3c5de43f8a1a87fe77608f2e3e18b9a81d265

    steps:
      - name: Check out the corrected synthetic check
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Record the candidate and continuation identities
        run: |
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/continuation -Force
          @{candidateSourceRevision=$env:CANDIDATE_SOURCE_REVISION;candidateSha256=$env:CANDIDATE_SHA256;
            initialRunId=39341878486;initialRunAttempt=2;initialExistingJobId=118367975707;
            candidateArtifactId=12229950779;candidateArtifactDigest='sha256:672fb4c413dd554e9b1ffbc6d7ae1b61e45f6d22a1c661e4b91d3b6cf398c101';
            priorReportArtifactId=12230656191;priorReportArtifactDigest='sha256:c50391e669af5a3b8fd63092912a5eda0f87e79fbc8b11a6534ea33fd4b8622e';
            verificationRevision=$env:GITHUB_SHA;continuationRunId=$env:GITHUB_RUN_ID;continuationRunAttempt=$env:GITHUB_RUN_ATTEMPT;
            boundary='Explicitly opted-in dedicated hosted Windows session, disposable data only; no real-game or WAN acceptance.'} |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $evidence.FullName 'continuation-context.json') -Encoding utf8

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Retrieve the pinned immutable candidate and fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          try {
            $artifact = Invoke-RestMethod -Uri 'https://api.github.com/repos/daltonstates/TogetherServer/actions/artifacts/12229950779' -Headers $headers
            if ($artifact.id -ne 12229950779 -or $artifact.name -ne 'windows-candidate' -or $artifact.expired -ne $false -or
                $artifact.workflow_run.id -ne 39341878486 -or $artifact.workflow_run.head_sha -ne $env:CANDIDATE_SOURCE_REVISION -or
                $artifact.digest -ne 'sha256:672fb4c413dd554e9b1ffbc6d7ae1b61e45f6d22a1c661e4b91d3b6cf398c101') { throw 'Candidate artifact provenance mismatch.' }
            $zip = Join-Path $env:RUNNER_TEMP 'candidate-0322.zip'
            Invoke-WebRequest -Uri 'https://api.github.com/repos/daltonstates/TogetherServer/actions/artifacts/12229950779/zip' -Headers $headers -OutFile $zip
          } finally { $headers.Clear() }
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne '672FB4C413DD554E9B1FFBC6D7AE1B61E45F6D22A1C661E4B91D3B6CF398C101') { throw 'Candidate artifact ZIP digest mismatch.' }
          Expand-Archive -LiteralPath $zip -DestinationPath . -Force

      - name: Verify the exact source boundary and completed gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = $env:CANDIDATE_SOURCE_REVISION
          $hash = $env:CANDIDATE_SHA256
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -ne $hash -or
              (Get-Item -LiteralPath $candidate).VersionInfo.ProductVersion -ne "0.3.2.2+$revision" -or
              (Get-AuthenticodeSignature -LiteralPath $candidate).Status -ne 'NotSigned') { throw 'Candidate identity mismatch.' }
          git merge-base --is-ancestor $revision HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Verification source must descend from the compiled candidate source.' }
          $changed = @(git diff --no-renames --name-only $revision HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare verification source.' }
          $allowed = '^(docs/|checks/TogetherServer\.CompanionChecks/SharedWorldJourney\.cs$|\.github/workflows/release-0322-continuation\.yml$)'
          if (@($changed | Where-Object { $_ -notmatch $allowed }).Count) { throw 'Files outside the approved test, documentation and continuation workflow changed after the candidate.' }
          $headers = @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          try {
            $root = 'https://api.github.com/repos/daltonstates/TogetherServer/actions/runs/39341878486'
            $previous = Invoke-RestMethod -Uri $root -Headers $headers
            $jobResponse = Invoke-RestMethod -Uri ($root+'/jobs?filter=all&per_page=100') -Headers $headers
            $jobs = @($jobResponse.jobs)
            $artifact = Invoke-RestMethod -Uri 'https://api.github.com/repos/daltonstates/TogetherServer/actions/artifacts/12230656191' -Headers $headers
            if ($artifact.id -ne 12230656191 -or $artifact.name -ne 'qol-windows-evidence-Existing' -or $artifact.expired -ne $false -or
                $artifact.workflow_run.id -ne 39341878486 -or $artifact.workflow_run.head_sha -ne $revision -or
                $artifact.digest -ne 'sha256:c50391e669af5a3b8fd63092912a5eda0f87e79fbc8b11a6534ea33fd4b8622e') { throw 'Prior report artifact provenance mismatch.' }
            $reportZip = Join-Path $env:RUNNER_TEMP 'accepted-partial-gate-0322.zip'
            Invoke-WebRequest -Uri 'https://api.github.com/repos/daltonstates/TogetherServer/actions/artifacts/12230656191/zip' -Headers $headers -OutFile $reportZip
          } finally { $headers.Clear() }
          if ($previous.id -ne 39341878486 -or $previous.head_sha -ne $revision -or $previous.status -ne 'completed' -or
              $previous.conclusion -ne 'failure' -or $previous.run_attempt -ne 2 -or
              $previous.path -ne '.github/workflows/windows-ci.yml' -or $previous.workflow_id -ne 367811679 -or
              $jobResponse.total_count -ne 22 -or $jobs.Count -ne 22) { throw 'Previous run identity or job inventory mismatch.' }
          $completed = @(
            @{name='candidate';ids=@(118365142465,118368009443)},
            @{name='Verify Browser';ids=@(118366139749,118368024071)},
            @{name='Verify Desktop';ids=@(118366139833,118368012739)},
            @{name='Verify QolApi';ids=@(118366139874,118368028796)},
            @{name='Verify Rehearsal';ids=@(118366139714,118367977390)},
            @{name='Verify 0.3.0 compatibility';ids=@(118366139675,118368016471)},
            @{name='Verify 0.3.1 compatibility';ids=@(118366139792,118368016080)},
            @{name='Verify 0.3.2 compatibility';ids=@(118366139879,118367976827)},
            @{name='Verify 0.3.2.1 compatibility';ids=@(118366139821,118367977575)}
          )
          foreach ($expected in $completed) {
            for ($index = 0; $index -lt 2; $index++) {
              $job = @($jobs | Where-Object id -eq $expected.ids[$index])
              if ($job.Count -ne 1 -or $job[0].name -ne $expected.name -or $job[0].run_attempt -ne ($index + 1) -or
                  $job[0].status -ne 'completed' -or $job[0].conclusion -ne 'success') { throw "Completed gate mismatch: $($expected.name), attempt $($index + 1)." }
            }
          }
          $failed = @($jobs | Where-Object conclusion -eq 'failure')
          $skipped = @($jobs | Where-Object conclusion -eq 'skipped')
          if ($failed.Count -ne 2 -or @($failed | Where-Object name -ne 'Verify Existing').Count -or
              $skipped.Count -ne 2 -or @($skipped | Where-Object name -ne 'Package verified release').Count) { throw 'Unexpected prior failed or skipped gate.' }
          foreach ($expected in @(@{id=118366139715;attempt=1},@{id=118367975707;attempt=2})) {
            $job = @($failed | Where-Object id -eq $expected.id)
            if ($job.Count -ne 1 -or $job[0].run_attempt -ne $expected.attempt -or $job[0].status -ne 'completed') { throw 'Prior Existing failure identity mismatch.' }
          }
          $existing = @($jobs | Where-Object id -eq 118367975707)[0]
          foreach ($expected in @(@{name='Verify the exact candidate on this dedicated runner';outcome='failure'},
              @{name='Preserve QoL screenshots and validation summaries';outcome='success'})) {
            $step = @($existing.steps | Where-Object name -eq $expected.name)
            if ($step.Count -ne 1 -or $step[0].conclusion -ne $expected.outcome) { throw 'Prior Existing step identity mismatch.' }
          }
          if ((Get-FileHash -LiteralPath $reportZip -Algorithm SHA256).Hash -ne 'C50391E669AF5A3B8FD63092912A5EDA0F87E79FBC8B11A6534EA33FD4B8622E') { throw 'Prior report ZIP digest mismatch.' }
          Expand-Archive -LiteralPath $reportZip -DestinationPath local-data/previous-gate-0322
          $files = @(Get-ChildItem local-data/previous-gate-0322 -Filter release-gate-report.json -File -Recurse)
          if ($files.Count -ne 1) { throw 'Ambiguous prior process evidence.' }
          $report = Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          if ($report.suite -ne 'Existing' -or $report.candidate.sourceRevision -ne $revision -or
              $report.candidate.sha256 -ne $hash -or $report.candidate.productVersion -ne "0.3.2.2+$revision" -or
              $report.candidate.authenticode -ne 'NotSigned' -or @($report.checks).Count -ne 18) { throw 'Prior process evidence identity or count mismatch.' }
          foreach ($name in @('Git whitespace check','Desktop diagnostic isolation','Check runner listener identity','UI lint','UI unit tests','Locked application restore',
              'TogetherServer.Checks','TogetherServer.ValheimChecks','TogetherServer.FactorioChecks','TogetherServer.TerrariaChecks',
              'TogetherServer.MinecraftChecks','TogetherServer.MinecraftSetupChecks','TogetherServer.CustomChecks','TogetherServer.SharedHistoryChecks',
              'TogetherServer.UpdateChecks','Core remote journey','World-load packaged rehearsal')) {
            $check = @($report.checks | Where-Object name -eq $name)
            if ($check.Count -ne 1 -or $check[0].outcome -ne 'passed') { throw "Prior check did not pass: $name" }
          }
          $failedChecks = @($report.checks | Where-Object outcome -eq 'failed')
          if (@($report.checks | Where-Object outcome -eq 'passed').Count -ne 17 -or $failedChecks.Count -ne 1 -or
              $failedChecks[0].name -ne 'Shared Worlds packaged journey') { throw 'Unexpected incomplete process check.' }
          $evidence = (Resolve-Path local-data/ci-evidence/continuation).Path
          Copy-Item -LiteralPath $files[0].FullName -Destination (Join-Path $evidence 'prior-existing-report.json')
          @{runId=$previous.id;workflowId=$previous.workflow_id;sourceRevision=$previous.head_sha;attempt=$previous.run_attempt;
            conclusion=$previous.conclusion;jobs=@($jobs | Select-Object id,name,status,conclusion,run_attempt);allowedSourceChanges=$changed;
            priorReportArtifactId=12230656191;priorReportDigest=$artifact.digest;passedChecks=17;failedCheck='Shared Worlds packaged journey'} |
            ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $evidence 'prior-gates.json') -Encoding utf8
          'PASS all nine other gates and 17 completed Existing stages bind to the unchanged candidate. Both failed attempts remain failed.'

      - name: Compile checks with locked dependencies and isolation guards
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Tracked whitespace check failed.' }
          $diagnosticOutput = [IO.Path]::GetFullPath('src/TogetherServer/DiagnosticOutput.cs')
          $offenders = @(Get-ChildItem -LiteralPath src/TogetherServer -Filter '*.cs' -File -Recurse |
            Where-Object { [IO.Path]::GetFullPath($_.FullName) -ne $diagnosticOutput } |
            Select-String -Pattern '\bConsole\.' -CaseSensitive)
          if ($offenders.Count) { throw 'Desktop code must not bypass DiagnosticOutput.' }
          $checkFiles = @(Get-ChildItem -LiteralPath checks,ui/checks -File -Recurse | Where-Object {
            $_.Extension -in '.cs','.ps1','.mjs' -and $_.FullName -notmatch '[\\/](?:obj|bin)[\\/]'
          })
          $patterns = @('\bnew\s+(?:System\.Net\.Sockets\.)?(?:TcpListener|UdpClient|Socket)\s*\(',
            '\[(?:System\.)?Net\.Sockets\.(?:TcpListener|UdpClient|Socket)\]::new\s*\(',
            '\.Bind\s*\(', '\.Listen\s*\(', '\bcreateServer\s*\(', '\bcreateSocket\s*\(')
          if (@($checkFiles | Select-String -Pattern $patterns).Count) { throw 'Check runners must not own OS listeners.' }
          $badProbes = @($checkFiles | Select-String -Pattern 'PortProbeMode\.LoopbackOnly' | Where-Object {
            $_.Line -notmatch 'GameServerRegistry\.ProbeAddress\s*\('
          })
          if ($badProbes.Count) { throw 'Check runners must use ObserveOnly for indirect probes.' }
          $routes = [regex]::Matches((Get-Content checks/TogetherServer.Checks/Program.cs -Raw), 'new CompanionServer\([\s\S]*?\);')
          if (!$routes.Count -or @($routes | Where-Object { !$_.Value.Contains('inMemoryTransport: builder => builder.UseTestServer()') }).Count) {
            throw 'Core route checks must use in-memory TestServer.'
          }
          dotnet restore TogetherServer.slnx --locked-mode 2>&1 | Tee-Object -FilePath local-data/ci-evidence/continuation/restore.log
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          dotnet build TogetherServer.slnx -c Release --no-restore -p:CodeOnlyVerification=true 2>&1 | Tee-Object -FilePath local-data/ci-evidence/continuation/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Check build failed.' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Compilation changed tracked source.' }

      - name: Complete all remaining acceptance on this dedicated runner
        run: |
          # Explicit opt-in: this separate hosted Windows session owns its disposable processes and desktop.
          $ErrorActionPreference = 'Stop'
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $evidence = (Resolve-Path local-data/ci-evidence/continuation).Path
          $checks = [Collections.Generic.List[object]]::new()
          $outcome = 'failed'
          function Invoke-Check([string]$CheckLabel, [scriptblock]$Action) {
            $checkOutcome = 'failed'; $global:LASTEXITCODE = 0
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $log = Join-Path $evidence (('{0:D2}' -f ($checks.Count + 1)) + '.log')
            try { & $Action *>&1 | Tee-Object -FilePath $log; if ($LASTEXITCODE -ne 0) { throw "$CheckLabel returned $LASTEXITCODE." }; $checkOutcome = 'passed' }
            finally { $checks.Add(@{name=$CheckLabel;outcome=$checkOutcome;elapsedSeconds=$watch.Elapsed.TotalSeconds;log=[IO.Path]::GetFileName($log)}) }
          }
          try {
            Invoke-Check 'Shared Worlds packaged journey' { dotnet run --project checks/TogetherServer.CompanionChecks/TogetherServer.CompanionChecks.csproj -c Release --no-build --no-restore -- $candidate --shared-world-journey --allow-interactive-tests }
            Invoke-Check 'Staging LiveSave owner action' { dotnet run --project checks/TogetherServer.CompanionChecks/TogetherServer.CompanionChecks.csproj -c Release --no-build --no-restore -- $candidate --live-save-action --allow-interactive-tests }
            Invoke-Check 'Shared LiveSave packaged transfer journey' { dotnet run --project checks/TogetherServer.CompanionChecks/TogetherServer.CompanionChecks.csproj -c Release --no-build --no-restore -- $candidate --shared-live-transfer-journey --allow-interactive-tests }
            Invoke-Check 'TogetherServer.CompanionChecks' { dotnet run --project checks/TogetherServer.CompanionChecks/TogetherServer.CompanionChecks.csproj -c Release --no-build --no-restore -- $candidate --allow-interactive-tests }
            Invoke-Check 'Solution formatting' { dotnet format TogetherServer.slnx --verify-no-changes --no-restore }
            Invoke-Check 'Packaged served smoke' { ./checks/served-smoke.ps1 -AppPath $candidate }
            Invoke-Check 'Production plus staging isolation smoke' { ./checks/staging-smoke.ps1 -AppPath $candidate }
            Invoke-Check 'Packaged hidden desktop smoke' { ./checks/desktop-smoke.ps1 -AppPath $candidate -Port 0 -AllowInteractiveTests }
            Invoke-Check 'Packaged interactive desktop smoke' { ./checks/desktop-smoke.ps1 -AppPath $candidate -Port 0 -Interactive -AllowInteractiveTests }
            Invoke-Check 'Update handoff smoke' { ./checks/update-handoff-smoke.ps1 -AppPath $candidate -AllowInteractiveTests }
            if ($checks.Count -ne 10 -or @($checks | Where-Object outcome -ne 'passed').Count) { throw 'Remaining acceptance inventory mismatch.' }
            if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -ne $env:CANDIDATE_SHA256) { throw 'Candidate changed during continuation.' }
            git diff --exit-code
            if ($LASTEXITCODE -ne 0) { throw 'Acceptance changed tracked source.' }
            $outcome = 'passed'
          } finally {
            @{candidateSourceRevision=$env:CANDIDATE_SOURCE_REVISION;candidateSha256=$env:CANDIDATE_SHA256;
              initialRunId=39341878486;initialRunAttempt=2;initialExistingJobId=118367975707;
              verificationRevision=$env:GITHUB_SHA;checksCompiledFromRevision=$env:GITHUB_SHA;
              continuationRunId=$env:GITHUB_RUN_ID;continuationRunAttempt=$env:GITHUB_RUN_ATTEMPT;outcome=$outcome;checks=@($checks.ToArray());
              boundary='Dedicated hosted Windows session, disposable data only; no real-game or WAN acceptance.'} |
              ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $evidence 'continuation-report.json') -Encoding utf8
          }

      - name: Install the pinned installer compiler
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerSetup
          if ((Get-FileHash -LiteralPath $compilerSetup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Compiler digest mismatch.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $compilerSetup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') { throw 'Compiler publisher mismatch.' }
          $compilerRoot = Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6'
          $installArguments = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',"/DIR=`"$compilerRoot`"")
          $setup = Start-Process -FilePath $compilerSetup -ArgumentList $installArguments -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or !(Test-Path -LiteralPath (Join-Path $compilerRoot 'ISCC.exe'))) { throw 'Compiler installation failed.' }

      - name: Package and verify the same candidate
        run: |
          # Explicit opt-in applies to all six installer checks on this dedicated hosted Windows runner.
          $ErrorActionPreference = 'Stop'
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $evidence = (Resolve-Path local-data/ci-evidence/continuation).Path
          $outcome = 'failed'
          try {
            if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -ne $env:CANDIDATE_SHA256) { throw 'Candidate identity changed.' }
            ./scripts/build-installer.ps1 -AppPath $candidate -OutputDirectory local-data/release-assets -CompilerPath (Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6/ISCC.exe') *>&1 | Tee-Object -FilePath (Join-Path $evidence 'installer-build.log')
            if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
            $installerLog = Join-Path $evidence 'installer-smoke.log'
            ./checks/installer-smoke.ps1 -InstallerPath local-data/release-assets/TogetherServer-Setup-win-x64.exe -ExpectedAppPath $candidate -AllowInteractiveTests *>&1 | Tee-Object -FilePath $installerLog
            if ($LASTEXITCODE -ne 0 -or @(Select-String -LiteralPath $installerLog -Pattern '^Installer checks: 6 passed, 0 failed\.').Count -ne 1) { throw 'All six installer checks must pass.' }
            if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -ne $env:CANDIDATE_SHA256) { throw 'Verified bytes changed during packaging.' }
            Copy-Item -LiteralPath $candidate -Destination local-data/release-assets/TogetherServer-win-x64.exe
            $assets = @()
            foreach ($name in @('TogetherServer-win-x64.exe','TogetherServer-Setup-win-x64.exe')) {
              $file = Get-Item -LiteralPath (Join-Path 'local-data/release-assets' $name)
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              Set-Content -LiteralPath ($file.FullName+'.sha256') -Value "$hash  $name" -Encoding ascii
              $assets += @{name=$name;sha256=$hash;bytes=$file.Length;authenticode=[string](Get-AuthenticodeSignature -LiteralPath $file.FullName).Status}
            }
            @{version='0.3.2.2';sourceRevision=$env:CANDIDATE_SOURCE_REVISION;compiledSourceRevision=$env:CANDIDATE_SOURCE_REVISION;candidateSha256=$env:CANDIDATE_SHA256;
              initialRunId=39341878486;initialRunAttempt=2;initialExistingJobId=118367975707;candidateArtifactId=12229950779;
              candidateArtifactDigest='sha256:672fb4c413dd554e9b1ffbc6d7ae1b61e45f6d22a1c661e4b91d3b6cf398c101';
              priorReportArtifactId=12230656191;priorReportArtifactDigest='sha256:c50391e669af5a3b8fd63092912a5eda0f87e79fbc8b11a6534ea33fd4b8622e';
              verificationRevision=$env:GITHUB_SHA;checksCompiledFromRevision=$env:GITHUB_SHA;verificationRunId=$env:GITHUB_RUN_ID;
              continuationRunId=$env:GITHUB_RUN_ID;continuationRunAttempt=$env:GITHUB_RUN_ATTEMPT;assets=$assets;
              acceptance='Digest-pinned nine completed gates and 17 Existing stages plus all ten remaining Existing stages and six installer checks; exact candidate was not rebuilt.'} |
              ConvertTo-Json -Depth 6 | Set-Content -LiteralPath local-data/release-assets/release-manifest.json -Encoding utf8
            $outcome = 'passed'
          } finally {
            @{candidateSourceRevision=$env:CANDIDATE_SOURCE_REVISION;candidateSha256=$env:CANDIDATE_SHA256;
              verificationRevision=$env:GITHUB_SHA;continuationRunId=$env:GITHUB_RUN_ID;outcome=$outcome;requiredInstallerChecks=6} |
              ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $evidence 'installer-report.json') -Encoding utf8
          }

      - name: Preserve continuation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-0322-continuation-evidence
          path: local-data/ci-evidence/continuation/
          retention-days: 7
          if-no-files-found: ignore

      - name: Preserve verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release-assets
          path: local-data/release-assets/
          retention-days: 7
          if-no-files-found: error
