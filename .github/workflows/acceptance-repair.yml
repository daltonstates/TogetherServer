name: Verify acceptance fixes

on:
  push:
    branches: ['review/acceptance-repair-*']

permissions:
  contents: read

concurrency:
  group: acceptance-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Affected acceptance and installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact repair revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install the pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build one fresh immutable candidate for the product fixes
        id: identity
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'daltonstates/TogetherServer' -or @((git status --porcelain --untracked-files=no)).Count) { throw 'Expected a clean repair checkout.' }
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/acceptance-continuation -Force
          git merge-base --is-ancestor 51f3834f18246798791158866b6e660bde995b35 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'The repair must descend from the recorded failed continuation.' }
          ./scripts/build.ps1 -ReleaseName release-candidate
          if ($LASTEXITCODE -ne 0) { throw 'Repair candidate compilation failed.' }
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $hash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Item -LiteralPath $candidate).VersionInfo.ProductVersion -ne ("0.3.2.2+"+$env:GITHUB_SHA)) { throw 'Candidate source identity mismatch.' }
          "CANDIDATE_SHA256=$hash" >> $env:GITHUB_ENV
          "CANDIDATE_SOURCE_REVISION=$env:GITHUB_SHA" >> $env:GITHUB_ENV
          @{ candidateSha256=$hash; compiledSourceRevision=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID;
            regressionBaselineRunId='39385522178'; failedContinuationRunId='39388659351';
            changedFiles=@(git diff --no-renames --name-only 51f3834f18246798791158866b6e660bde995b35 HEAD);
            boundary='Fresh product candidate. Prior passes remain evidence for their original source; this run repeats affected sharing and UI checks and completes installer acceptance. Dedicated hosted Windows only; no owner desktop, real game or WAN.' } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $evidence.FullName 'candidate.json') -Encoding utf8

      - name: Retain the repair candidate once for targeted retries
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-repair-candidate
          path: |
            local-data/release-candidate/TogetherServer.exe
            src/TogetherServer.Fixture/bin/Release/net10.0/
            src/TogetherServer.ValheimFixture/bin/Release/net10.0/
            src/TogetherServer.MinecraftFixture/bin/Release/net10.0/
            src/TogetherServer.FactorioFixture/bin/Release/net10.0/
            src/TogetherServer.TerrariaFixture/bin/Release/net10.0/
            ui/dist/
          if-no-files-found: error
          retention-days: 1

      - name: Compile source checks and install the locked browser
        id: setup
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: |
          dotnet restore TogetherServer.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked source check restore failed.' }
          dotnet build TogetherServer.slnx -c Release --no-restore -p:CodeOnlyVerification=true
          if ($LASTEXITCODE -ne 0) { throw 'Source check compilation failed.' }
          ./ui/node_modules/.bin/playwright.cmd install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Locked browser installation failed.' }

      - name: Verify source regressions and UI units
        id: source
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.setup.outcome == 'success' }}
        run: |
          dotnet checks/TogetherServer.FeatureChecks/bin/Release/net10.0-windows/TogetherServer.FeatureChecks.dll
          if ($LASTEXITCODE -ne 0) { throw 'Source/synthetic regressions failed.' }
          Push-Location ui
          try {
            npm run lint --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw 'UI lint failed.' }
            npm test --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw 'UI unit regressions failed.' }
          } finally { Pop-Location }

      - name: Verify affected sharing and failed served and formatting checks
        id: existing
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.setup.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $harness = (Resolve-Path checks/TogetherServer.CompanionChecks/bin/Release/net10.0-windows/TogetherServer.CompanionChecks.dll).Path
          $results = [Collections.Generic.List[object]]::new()
          function Remaining([string]$name, [scriptblock]$action) {
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $index = $results.Count + 1
            $outcome = 'passed'
            $diagnostic = $null
            $global:LASTEXITCODE = 0
            try {
              & $action *>&1 | Tee-Object -FilePath ("local-data/ci-evidence/acceptance-continuation/existing-{0:d2}.log" -f $index)
              if ($LASTEXITCODE -ne 0) { throw "The fixed check exited with code $LASTEXITCODE." }
            } catch {
              $outcome = 'failed'
              $diagnostic = $_.Exception.GetType().Name + ':line:' + $_.InvocationInfo.ScriptLineNumber
              Write-Host "FAIL remaining Existing: $name ($diagnostic). Inspect the bounded check log."
            }
            $results.Add(@{ name=$name; outcome=$outcome; elapsedSeconds=$clock.Elapsed.TotalSeconds; failureType=$diagnostic })
            @{ compiledSourceRevision=$env:CANDIDATE_SOURCE_REVISION; verificationRevision=$env:GITHUB_SHA;
              candidateSha256=$env:CANDIDATE_SHA256; checks=@($results.ToArray()) } | ConvertTo-Json -Depth 5 |
              Set-Content -LiteralPath local-data/ci-evidence/acceptance-continuation/remaining-existing.json -Encoding utf8
          }
          Remaining 'Core remote journey' { dotnet $harness $candidate --core-remote-journey }
          Remaining 'Shared Worlds packaged journey' { dotnet $harness $candidate --shared-world-journey }
          Remaining 'TogetherServer.CompanionChecks' { dotnet $harness $candidate }
          Remaining 'Solution formatting' { dotnet format TogetherServer.slnx --verify-no-changes --no-restore }
          Remaining 'Packaged served smoke' { ./checks/served-smoke.ps1 -AppPath $candidate }
          if ($results.Count -ne 5 -or @($results | Where-Object outcome -ne 'passed').Count -ne 0) { throw 'At least one affected Existing check failed; every independent check was attempted.' }

      - name: Prepare the matching prior UI for the outstanding browser comparison
        id: baseline
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.setup.outcome == 'success' }}
        run: |
          git worktree add --detach local-data/ui-before a1eb74e6518900ad2087549c174d4486d5a41b3a
          if ($LASTEXITCODE -ne 0) { throw 'Prior UI worktree creation failed.' }
          Push-Location local-data/ui-before/ui
          try {
            npm ci --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Prior UI dependency installation failed.' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'Prior comparison UI compilation failed.' }
          } finally { Pop-Location }

      - name: Complete the actual bundled browser journeys
        id: browser
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.setup.outcome == 'success' && steps.baseline.outcome == 'success' }}
        run: |
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $baseline = (Resolve-Path local-data/ui-before/ui/dist).Path
          node ui/checks/qol-browser-smoke.mjs --app-path $candidate --allow-interactive-tests --output-dir local-data/ci-evidence/qol-browser --baseline-ui-dir $baseline *>&1 |
            Tee-Object -FilePath local-data/ci-evidence/acceptance-continuation/browser.log
          if ($LASTEXITCODE -ne 0) { throw 'Outstanding bundled browser acceptance failed.' }

      - name: Complete QoL native desktop acceptance
        id: desktop
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.setup.outcome == 'success' }}
        run: |
          # Explicit opt-in applies only to this dedicated hosted runner's disposable desktop.
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          ./checks/qol-desktop-smoke.ps1 -AppPath $candidate -AllowInteractiveTests *>&1 |
            Tee-Object -FilePath local-data/ci-evidence/acceptance-continuation/qol-desktop.log

      - name: Complete assigned LAN API and ten-stage Host/Friend UX
        id: pairing
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.setup.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $harness = (Resolve-Path checks/TogetherServer.CompanionChecks/bin/Release/net10.0-windows/TogetherServer.CompanionChecks.dll).Path
          $up = @(Get-NetAdapter | Where-Object Status -eq 'Up' | ForEach-Object InterfaceIndex)
          $lan = @(Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.AddressState.ToString() -eq 'Preferred' -and
            $_.InterfaceIndex -in $up -and $_.IPAddress -match '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)' } |
            Sort-Object InterfaceIndex,IPAddress | Select-Object -First 1)
          if ($lan.Count -ne 1) { throw 'One assigned preferred private IPv4 address is required.' }
          $labRoot = Join-Path (Get-Location) 'local-data/local-pairing-lab'
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/local-pairing -Force
          $results = [Collections.Generic.List[object]]::new()
          foreach ($mode in @('lan-api','ux')) {
            $outcome = 'passed'
            try {
              $before = @(if (Test-Path -LiteralPath $labRoot) { Get-ChildItem -LiteralPath $labRoot -Directory | ForEach-Object Name })
              $arguments = @($harness,$candidate,'--local-pairing-lab-journey','--allow-windowless-lab','--lab-lan-address',$lan[0].IPAddress)
              if ($mode -eq 'ux') { $arguments += '--lab-ux' }
              dotnet @arguments
              $code = $LASTEXITCODE
              $created = @(Get-ChildItem -LiteralPath $labRoot -Directory | Where-Object Name -notin $before)
              if ($created.Count -ne 1 -or $created[0].Name -notmatch '^run-[0-9a-f]{32}$') { throw 'One exact new lab case is required.' }
              $reportPath = Join-Path $created[0].FullName 'report.json'
              if ((Get-Item -LiteralPath $reportPath).Length -gt 256KB) { throw 'Lab report exceeds its bound.' }
              $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
              $destination = New-Item -ItemType Directory -Path (Join-Path $evidence.FullName $mode) -Force
              $report | Select-Object schema,runId,startedUtc,endedUtc,durationMs,mode,physicalPcCount,outcome,failedStage,failureCode,
                stages,uxStagePassed,apiHostChange,branchTransfer,cleanup,resources,windowObservation,acceptance |
                ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $destination.FullName 'report.json') -Encoding utf8
              $expected = @('isolated-apps','two-ended-ux','cleanup')
              if ($mode -eq 'lan-api') {
                $expected = @('isolated-apps','pinned-pairing','separate-permissions-and-consent','signed-chat','synthetic-stop-copy-receipts',
                  'password-permission-revoke','unsupported-password-source-denied','guided-hosting','local-copy-hosting','lost-response-cleanup','cleanup',
                  'new-host-notice','new-host-authenticated-connect','new-host-permission-isolation','new-host-stop-and-transfer',
                  'new-host-restart-reconnect','new-host-revocation-isolation','new-host-receipt-confirmed')
              } else {
                $uxRoot = Join-Path $created[0].FullName 'ux'
                $uxPath = Join-Path $uxRoot 'report.json'
                if ((Get-Item -LiteralPath $uxPath).Length -gt 256KB) { throw 'UX report exceeds its bound.' }
                $ux = Get-Content -LiteralPath $uxPath -Raw | ConvertFrom-Json
                $ux | Select-Object ok,stages,errors,failedRequests,canceledRequests,controlPolicyChanges,boundaries,guidedHosting,signedDiscovery,failurePathCoverage,failure |
                  ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $destination.FullName 'ux-report.json') -Encoding utf8
                $pictures = @(Get-ChildItem -LiteralPath $uxRoot -Filter '*.png' -File)
                if ($pictures.Count -lt 1 -or $pictures.Count -gt 64) { throw 'Masked UX capture count is outside its bound.' }
                foreach ($picture in $pictures) {
                  if ($picture.Name -notmatch '^(?:[0-9]{2}-[a-z0-9-]+|failure-[0-9]+)\.png$' -or $picture.Length -gt 16MB -or
                      ($picture.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Masked UX capture identity is invalid.' }
                  Copy-Item -LiteralPath $picture.FullName -Destination (Join-Path $destination.FullName $picture.Name)
                }
                if ($ux.ok -ne $true -or @($ux.stages).Count -ne 10 -or @($ux.stages | Where-Object passed -ne $true).Count -ne 0 -or
                    @($ux.errors).Count -ne 0 -or @($ux.failedRequests).Count -ne 0 -or $ux.failurePathCoverage.hostingGrantWithdrawal -ne $true -or
                    $ux.failurePathCoverage.localConsentAndCancel -ne $true -or $ux.guidedHosting.startRequests -ne 1 -or
                    $ux.guidedHosting.successfulStartResponses -ne 1 -or $ux.signedDiscovery.exactCandidateSession -ne $true -or
                    $ux.signedDiscovery.exactAdvertisedEndpoint -ne $true -or $ux.signedDiscovery.exactConnectSelection -ne $true) { throw 'Ten actual UX stages and exact one-Start/signed-Connect proof must all pass.' }
              }
              if ($code -ne 0 -or $report.outcome -ne 'Passed' -or @($report.stages).Count -ne $expected.Count -or
                  @($report.stages | Where-Object { $_.state -ne 'Passed' -or $_.id -notin $expected }).Count -ne 0 -or
                  @($report.stages.id | Select-Object -Unique).Count -ne $expected.Count -or $report.cleanup.jobActiveProcesses -ne 0 -or
                  $report.windowObservation.state -ne 'Passed' -or $report.windowObservation.samples -lt 1 -or
                  $report.windowObservation.peakVisibleOwnedWindows -ne 0) { throw "Every $mode stage and exact window/job cleanup must pass." }
              if ($mode -eq 'lan-api' -and ($report.apiHostChange.discoveredHost -ne $true -or $report.apiHostChange.connectedOwner -ne $true -or
                  $report.apiHostChange.connectedObserver -ne $true -or $report.apiHostChange.transferredCandidateCopy -ne $true -or
                  $report.apiHostChange.restartedHostConnections -ne $true -or $report.apiHostChange.isolatedRevocation -ne $true)) { throw 'A required hosting, transfer, restart or revocation proof is missing.' }
            } catch { $outcome = 'failed'; Write-Host "FAIL remaining $mode lab: inspect its redacted report." }
            $results.Add(@{mode=$mode;outcome=$outcome})
            if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CANDIDATE_SHA256) { throw 'Immutable candidate changed during the lab.' }
          }
          @{candidateSha256=$env:CANDIDATE_SHA256;verificationRevision=$env:GITHUB_SHA;checks=@($results.ToArray())} | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath local-data/ci-evidence/acceptance-continuation/remaining-pairing.json -Encoding utf8
          if ($results.Count -ne 2 -or @($results | Where-Object outcome -ne 'passed').Count -ne 0) { throw 'At least one remaining lab failed; LAN API and UX were both attempted.' }

      - name: Require every affected runtime surface to pass
        id: aggregate
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.setup.outcome == 'success' }}
        env:
          EXISTING_OUTCOME: ${{ steps.existing.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          DESKTOP_OUTCOME: ${{ steps.desktop.outcome }}
          PAIRING_OUTCOME: ${{ steps.pairing.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('SOURCE_OUTCOME','EXISTING_OUTCOME','BASELINE_OUTCOME','BROWSER_OUTCOME','DESKTOP_OUTCOME','PAIRING_OUTCOME')) {
            if ([Environment]::GetEnvironmentVariable($name) -ne 'success') { throw "Required remaining surface did not pass: $name" }
          }
          function One-Report([string]$directory, [string]$name) {
            $files = @(Get-ChildItem -LiteralPath $directory -Filter $name -File -Recurse)
            if ($files.Count -ne 1 -or $files[0].Length -gt 4MB) { throw 'One bounded result report is required for each surface.' }
            return Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          }
          $existing = One-Report 'local-data/ci-evidence/acceptance-continuation' 'remaining-existing.json'
          $expected = @('Core remote journey','Shared Worlds packaged journey','TogetherServer.CompanionChecks','Solution formatting','Packaged served smoke')
          if ($existing.candidateSha256 -ne $env:CANDIDATE_SHA256 -or $existing.verificationRevision -ne $env:GITHUB_SHA -or
              @($existing.checks).Count -ne $expected.Count -or @($existing.checks | Where-Object { $_.outcome -ne 'passed' -or $_.name -notin $expected }).Count -ne 0 -or
              @($existing.checks.name | Select-Object -Unique).Count -ne $expected.Count) { throw 'Every incomplete Existing check must pass without inventory changes.' }
          $browser = One-Report 'local-data/ci-evidence/qol-browser' 'qol-browser-report.json'
          if ($browser.outcome -ne 'passed' -or @($browser.browserErrors).Count -ne 0 -or @($browser.failedRequests).Count -ne 0 -or
              @($browser.optionalGuides).Count -ne 2 -or @($browser.optionalGuides | Where-Object {
                $_.actualWelcomeChoices -ne $true -or $_.persistedDeferral -ne $true -or $_.reopenedFromHeader -ne $true }).Count -ne 0) { throw 'The actual browser journeys or both optional guide choices did not pass.' }
          $desktop = One-Report 'local-data/ci-evidence/qol-desktop' 'summary.json'
          $coveredStartup = 'Windows startup unavailable in development staging'
          if ($desktop.success -ne $true -or $desktop.cleanupCompleted -ne $true -or $desktop.screenshotExportCompleted -ne $true -or
              @($desktop.cases).Count -ne 14 -or @($desktop.cases | Where-Object { $_.name -ne $coveredStartup -and $_.status -ne 'PASS' }).Count -ne 0 -or
              @($desktop.cases | Where-Object { $_.name -eq $coveredStartup -and $_.status -eq 'SKIP' }).Count -ne 1 -or
              $desktop.nativeShell.notification.freshTitleAndBodyObserved -ne $true -or $desktop.nativeShell.notification.physicalClickSent -ne $true -or
              $desktop.nativeShell.notification.nativeDestinationVerified -ne $true -or $desktop.nativeShell.trayQuit.nativeFlushObserved -ne $true -or
              $desktop.nativeShell.trayQuit.exactProcessExited -ne $true) { throw 'Required actual native cases, OS delivery/click or Explorer Quit proof are incomplete.' }
          $pairing = One-Report 'local-data/ci-evidence/acceptance-continuation' 'remaining-pairing.json'
          if ($pairing.candidateSha256 -ne $env:CANDIDATE_SHA256 -or @($pairing.checks).Count -ne 2 -or
              @($pairing.checks | Where-Object outcome -ne 'passed').Count -ne 0) { throw 'Both outstanding lab modes must pass.' }
          if ((Get-FileHash local-data/release-candidate/TogetherServer.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CANDIDATE_SHA256) { throw 'Candidate bytes changed.' }
          @{ passed=$true; compiledSourceRevision=$env:CANDIDATE_SOURCE_REVISION; verificationRevision=$env:GITHUB_SHA;
            candidateSha256=$env:CANDIDATE_SHA256; completedAffectedChecks=$expected; originalBaselineRunId='39385522178';
            failedContinuationRunId='39388659351'; remainingLanStages=18; actualUxStages=10; nativeRequiredCases=13;
            artifactRetentionDays=1; repairRunId=$env:GITHUB_RUN_ID } | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath local-data/ci-evidence/acceptance-continuation/runtime-acceptance.json -Encoding utf8
          'PASS every affected sharing and UI runtime check for the fresh repair candidate.'

      - name: Install the pinned compiler for the unrun installer checks
        id: compiler
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: |
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerSetup
          if ((Get-FileHash -LiteralPath $compilerSetup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Pinned installer compiler digest mismatch.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $compilerSetup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') { throw 'Installer compiler publisher mismatch.' }
          $compilerRoot = Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6'
          $setup = Start-Process -FilePath $compilerSetup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$compilerRoot`"") -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or !(Test-Path -LiteralPath (Join-Path $compilerRoot 'ISCC.exe'))) { throw 'Installer compiler installation failed.' }

      - name: Wrap the immutable app bytes in the installer
        id: installer
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.compiler.outcome == 'success' }}
        run: |
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          ./scripts/build-installer.ps1 -AppPath $candidate -OutputDirectory local-data/release-assets -CompilerPath (Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6/ISCC.exe') *>&1 |
            Tee-Object -FilePath local-data/ci-evidence/acceptance-continuation/installer-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }

      - name: Complete silent installer integration acceptance
        id: silent
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.installer.outcome == 'success' }}
        run: |
          ./checks/installer-smoke.ps1 -InstallerPath local-data/release-assets/TogetherServer-Setup-win-x64.exe -ExpectedAppPath local-data/release-candidate/TogetherServer.exe -AllowInteractiveTests *>&1 |
            Tee-Object -FilePath local-data/ci-evidence/acceptance-continuation/installer-smoke.log

      - name: Complete all three actual installer wizard choices
        id: wizard
        continue-on-error: true
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.installer.outcome == 'success' }}
        run: |
          # The UI script refuses any installed/running app; a failed silent cleanup cannot be bypassed.
          ./checks/installer-ui-smoke.ps1 -InstallerPath local-data/release-assets/TogetherServer-Setup-win-x64.exe -ExpectedAppPath local-data/release-candidate/TogetherServer.exe -AllowInteractiveTests *>&1 |
            Tee-Object -FilePath local-data/ci-evidence/acceptance-continuation/installer-ui.log

      - name: Require both installer checks and retain the exact verified package
        id: package
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.installer.outcome == 'success' }}
        env:
          RUNTIME_OUTCOME: ${{ steps.aggregate.outcome }}
          SILENT_OUTCOME: ${{ steps.silent.outcome }}
          WIZARD_OUTCOME: ${{ steps.wizard.outcome }}
        run: |
          if ($env:RUNTIME_OUTCOME -ne 'success' -or $env:SILENT_OUTCOME -ne 'success' -or $env:WIZARD_OUTCOME -ne 'success') { throw 'Required installer integration or actual wizard acceptance did not pass.' }
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CANDIDATE_SHA256) { throw 'Verified candidate bytes changed during acceptance.' }
          $ui = @(Get-ChildItem -LiteralPath local-data/ci-evidence/installer-ui -Filter summary.json -Recurse -File)
          if ($ui.Count -ne 1) { throw 'One exact actual installer UI report is required.' }
          $report = Get-Content -LiteralPath $ui[0].FullName -Raw | ConvertFrom-Json
          if ($report.passed -ne $true -or $report.skipped -ne 0 -or $report.cleanupCompleted -ne $true -or
              @($report.cases).Count -ne 3 -or @($report.cases | Where-Object state -ne 'Passed').Count) { throw 'Three actual wizard choices and exact cleanup did not all pass.' }
          Copy-Item -LiteralPath $candidate -Destination local-data/release-assets/TogetherServer-win-x64.exe
          $assets = foreach ($name in @('TogetherServer-win-x64.exe', 'TogetherServer-Setup-win-x64.exe')) {
            $file = Get-Item -LiteralPath (Join-Path local-data/release-assets $name)
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath ($file.FullName+'.sha256') -Value "$hash  $name" -Encoding ascii
            @{ name=$name; sha256=$hash; bytes=$file.Length; authenticode=[string](Get-AuthenticodeSignature -LiteralPath $file.FullName).Status }
          }
          @{ version='0.3.2.2'; compiledSourceRevision=$env:CANDIDATE_SOURCE_REVISION; verificationRevision=$env:GITHUB_SHA;
            candidateSha256=$env:CANDIDATE_SHA256; repairRunId=$env:GITHUB_RUN_ID; originalBaselineRunId='39385522178';
            failedContinuationRunId='39388659351'; assets=$assets;
            acceptance='Fresh repair candidate; affected sharing and UI regression checks plus actual installer acceptance on one dedicated hosted Windows runner. Prior baseline passes remain bound to their original source. No release publication, real game or WAN acceptance.' } |
            ConvertTo-Json -Depth 6 | Set-Content -LiteralPath local-data/release-assets/release-manifest.json -Encoding utf8

      - name: Always record the final immutable candidate sentinel
        id: sentinel
        if: always()
        run: |
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/acceptance-continuation -Force
          $candidate = Join-Path (Get-Location) 'local-data/release-candidate/TogetherServer.exe'
          $actual = if (Test-Path -LiteralPath $candidate) { (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null }
          @{ candidateSha256=$env:CANDIDATE_SHA256; finalCandidateSha256=$actual; unchanged=($actual -eq $env:CANDIDATE_SHA256);
            compiledSourceRevision=$env:CANDIDATE_SOURCE_REVISION; verificationRevision=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence.FullName 'final-candidate.json') -Encoding utf8
          if ($actual -ne $env:CANDIDATE_SHA256) { throw 'The pinned candidate is unavailable or changed.' }

      - name: Retain only bounded acceptance evidence for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-repair-evidence
          path: local-data/ci-evidence/
          if-no-files-found: error
          retention-days: 1

      - name: Retain verified package assets for one day
        if: ${{ success() && steps.package.outcome == 'success' && steps.sentinel.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-repair-assets
          path: local-data/release-assets/
          if-no-files-found: error
          retention-days: 1
