name: Windows CI

on:
  push:
    branches: [main, 'review/full-acceptance-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build one candidate and its synthetic fixtures
        shell: pwsh
        run: ./scripts/build.ps1 -ReleaseName release-candidate

      - name: Share the exact candidate with isolated test runners
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-candidate
          path: |
            local-data/release-candidate/TogetherServer.exe
            src/TogetherServer.Fixture/bin/Release/net10.0/
            src/TogetherServer.ValheimFixture/bin/Release/net10.0/
            src/TogetherServer.MinecraftFixture/bin/Release/net10.0/
            src/TogetherServer.FactorioFixture/bin/Release/net10.0/
            src/TogetherServer.TerrariaFixture/bin/Release/net10.0/
            ui/dist/
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        suite: [Existing, QolApi, Browser, Desktop, Rehearsal]
    name: Verify ${{ matrix.suite }}
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.suite == 'Desktop' && 20 || 60 }}
    steps:
      - name: Check out the same source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Retrieve the immutable candidate and synthetic fixtures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-candidate
          path: .

      - name: Install locked test dependencies without install scripts
        working-directory: ui
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the prior UI for matching header screenshots
        if: matrix.suite == 'Browser'
        shell: pwsh
        run: |
          git fetch origin a1eb74e6518900ad2087549c174d4486d5a41b3a
          if ($LASTEXITCODE -ne 0) { throw 'Prior UI source fetch failed.' }
          git worktree add --detach local-data/ui-before a1eb74e6518900ad2087549c174d4486d5a41b3a
          if ($LASTEXITCODE -ne 0) { throw 'Prior UI worktree creation failed.' }
          Push-Location local-data/ui-before/ui
          try {
            npm ci --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Prior UI locked dependency install failed.' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'Prior UI bundle build failed.' }
          } finally { Pop-Location }
          "TOGETHERSERVER_BASELINE_UI=$((Resolve-Path local-data/ui-before/ui/dist).Path)" >> $env:GITHUB_ENV

      - name: Verify current native window controls with the same candidate
        if: matrix.suite == 'Desktop'
        shell: pwsh
        run: |
          # Explicit opt-in: this dedicated hosted runner owns its disposable desktop.
          ./checks/window-chrome-smoke.ps1 -AppPath local-data/release-candidate/TogetherServer.exe -AllowInteractiveTests

      - name: Verify the exact candidate on this dedicated runner
        shell: pwsh
        run: |
          # The Desktop suite observes readiness for 15 seconds and records a
          # blocked notification case. Do not age a hosted profile with a long idle wait.
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          ./scripts/verify-release.ps1 -AppPath $candidate -Suite ${{ matrix.suite }} -AllowInteractiveTests

      - name: Preserve QoL screenshots and validation summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qol-windows-evidence-${{ matrix.suite }}
          path: local-data/ci-evidence/
          if-no-files-found: ignore
          retention-days: ${{ startsWith(github.ref_name, 'review/') && 1 || 7 }}

  local-pairing:
    needs: candidate
    name: Verify local pairing and both-ended UX
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the same source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install the pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Retrieve the immutable candidate and synthetic fixtures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-candidate
          path: .

      - name: Install locked Playwright and its headless browser
        working-directory: ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked test dependency installation failed.' }
          node -e 'if (require("./node_modules/playwright/package.json").version !== "1.64.0") throw new Error("Playwright version mismatch");'
          if ($LASTEXITCODE -ne 0) { throw 'The local UX lane requires locked Playwright 1.64.0.' }
          ./node_modules/.bin/playwright.cmd install chromium
          if ($LASTEXITCODE -ne 0) { throw 'The locked Playwright browser installation failed.' }

      - name: Build only the dispatcher and its source dependencies
        run: |
          dotnet restore checks/TogetherServer.CompanionChecks/TogetherServer.CompanionChecks.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked local pairing dispatcher restore failed.' }
          dotnet build checks/TogetherServer.CompanionChecks/TogetherServer.CompanionChecks.csproj -c Release --no-restore -p:CodeOnlyVerification=true
          if ($LASTEXITCODE -ne 0) { throw 'Local pairing dispatcher compilation failed.' }

      - name: Verify loopback, assigned LAN and actual two-ended UX with the same candidate
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $harness = (Resolve-Path checks/TogetherServer.CompanionChecks/bin/Release/net10.0-windows/TogetherServer.CompanionChecks.dll).Path
          $candidateHash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = [string]([xml](Get-Content src/TogetherServer/TogetherServer.csproj -Raw)).Project.PropertyGroup.Version
          $productVersion = (Get-Item -LiteralPath $candidate).VersionInfo.ProductVersion
          if ($productVersion -ne "$version+$env:GITHUB_SHA") { throw 'Local pairing candidate source identity mismatch.' }
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/local-pairing -Force
          $context = [ordered]@{ sourceRevision = $env:GITHUB_SHA; productVersion = $productVersion; candidateSha256 = $candidateHash;
            workflowRunId = $env:GITHUB_RUN_ID; workflowRunAttempt = $env:GITHUB_RUN_ATTEMPT; job = $env:GITHUB_JOB;
            playwrightVersion = '1.64.0'; boundary = 'Dedicated hosted Windows runner; windowless synthetic same-PC tests only; no real game or WAN acceptance.' }
          $context | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence.FullName 'candidate.json') -Encoding utf8
          $upInterfaces = @(Get-NetAdapter -ErrorAction Stop | Where-Object Status -eq 'Up' | ForEach-Object InterfaceIndex)
          $lan = @(Get-NetIPAddress -AddressFamily IPv4 -ErrorAction Stop | Where-Object {
            $_.AddressState.ToString() -eq 'Preferred' -and $_.InterfaceIndex -in $upInterfaces -and
            $_.IPAddress -match '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)'
          } | Sort-Object InterfaceIndex, IPAddress | Select-Object -First 1)
          if ($lan.Count -ne 1) { throw 'The hosted local pairing lane requires one assigned preferred private IPv4 address.' }
          $labRoot = Join-Path (Get-Location) 'local-data/local-pairing-lab'
          try {
            foreach ($mode in @('loopback', 'lan-api', 'ux')) {
              $before = @(if (Test-Path -LiteralPath $labRoot) { Get-ChildItem -LiteralPath $labRoot -Directory | ForEach-Object Name })
              $labArguments = @($harness, $candidate, '--local-pairing-lab-journey', '--allow-windowless-lab')
              if ($mode -ne 'loopback') { $labArguments += @('--lab-lan-address', $lan[0].IPAddress) }
              if ($mode -eq 'ux') { $labArguments += '--lab-ux' }
              # The harness assigns apps, fixtures and the muted headless browser to its kill-on-close job.
              # It receives the downloaded candidate, never the rebuilt source-output app or the rebuilding launcher.
              dotnet @labArguments
              $runExitCode = $LASTEXITCODE
              $created = @(Get-ChildItem -LiteralPath $labRoot -Directory | Where-Object { $_.Name -notin $before })
              if ($created.Count -ne 1 -or $created[0].Name -notmatch '^run-[0-9a-f]{32}$') { throw 'One exact new lab report directory was not identified.' }
              $destination = New-Item -ItemType Directory -Path (Join-Path $evidence.FullName $mode) -Force
              $reportPath = Join-Path $created[0].FullName 'report.json'
              if (!(Test-Path -LiteralPath $reportPath) -or (Get-Item -LiteralPath $reportPath).Length -gt 262144) { throw 'The bounded lab report is missing or too large.' }
              $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
              # Export fixed report fields only: no process paths, protected state, pairing material or synthetic saves.
              $report | Select-Object schema, runId, startedUtc, endedUtc, durationMs, mode, physicalPcCount, outcome,
                failedStage, failureCode, stages, uxStagePassed, apiHostChange, branchTransfer, cleanup, resources, windowObservation, acceptance |
                ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $destination.FullName 'report.json') -Encoding utf8
              $uxReport = $null
              if ($mode -eq 'ux') {
                $uxRoot = Join-Path $created[0].FullName 'ux'
                $uxReportPath = Join-Path $uxRoot 'report.json'
                if (!(Test-Path -LiteralPath $uxReportPath) -or (Get-Item -LiteralPath $uxReportPath).Length -gt 262144) { throw 'The bounded UX report is missing or too large.' }
                $uxReport = Get-Content -LiteralPath $uxReportPath -Raw | ConvertFrom-Json
                $uxReport | Select-Object ok, stages, errors, failedRequests, canceledRequests, controlPolicyChanges, boundaries, guidedHosting, signedDiscovery, failurePathCoverage, failure |
                  ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $destination.FullName 'ux-report.json') -Encoding utf8
                $pictures = @(Get-ChildItem -LiteralPath $uxRoot -File -Filter '*.png')
                if ($pictures.Count -gt 64) { throw 'The masked UX screenshot count exceeds its bound.' }
                foreach ($picture in $pictures) {
                  if ($picture.Name -notmatch '^(?:[0-9]{2}-[a-z0-9-]+|failure-[0-9]+)\.png$' -or $picture.Length -gt 16MB -or
                      ($picture.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'A masked UX screenshot failed its bounded export checks.' }
                  Copy-Item -LiteralPath $picture.FullName -Destination (Join-Path $destination.FullName $picture.Name)
                }
              }
              if ($runExitCode -ne 0 -or $report.outcome -ne 'Passed' -or @($report.stages).Count -eq 0 -or
                  @($report.stages | Where-Object state -ne 'Passed').Count -ne 0) { throw "The $mode lab did not pass every planned stage without skips." }
              foreach ($required in @('isolated-apps', 'cleanup')) {
                if (@($report.stages | Where-Object id -eq $required).Count -ne 1) { throw "The $mode lab omitted a required stage." }
              }
              $expected = @('isolated-apps', 'cleanup', 'two-ended-ux')
              if ($mode -ne 'ux') {
                $expected = @('isolated-apps', 'pinned-pairing', 'separate-permissions-and-consent', 'signed-chat',
                  'synthetic-stop-copy-receipts', 'password-permission-revoke', 'unsupported-password-source-denied',
                  'guided-hosting', 'local-copy-hosting', 'lost-response-cleanup', 'cleanup')
                if ($mode -eq 'lan-api') {
                  $expected += @('new-host-notice', 'new-host-authenticated-connect', 'new-host-permission-isolation',
                    'new-host-stop-and-transfer', 'new-host-restart-reconnect', 'new-host-revocation-isolation', 'new-host-receipt-confirmed')
                  if ($report.apiHostChange.discoveredHost -ne $true -or $report.apiHostChange.connectedOwner -ne $true -or
                      $report.apiHostChange.connectedObserver -ne $true -or $report.apiHostChange.transferredCandidateCopy -ne $true -or
                      $report.apiHostChange.restartedHostConnections -ne $true -or $report.apiHostChange.isolatedRevocation -ne $true) {
                    throw 'The LAN lab omitted a required signed hosting, transfer, restart or credential-isolation proof.'
                  }
                }
              }
              if (@($report.stages).Count -ne $expected.Count -or @($report.stages | Where-Object id -notin $expected).Count -ne 0 -or
                  @($report.stages.id | Select-Object -Unique).Count -ne $expected.Count) { throw "The $mode lab changed its required stage inventory." }
              if ($report.cleanup.jobActiveProcesses -ne 0 -or $report.windowObservation.state -ne 'Passed' -or
                  $report.windowObservation.samples -lt 1 -or $report.windowObservation.peakVisibleOwnedWindows -ne 0) { throw "The $mode lab failed window observation or exact job cleanup." }
              if ($mode -eq 'ux' -and ($uxReport.ok -ne $true -or @($uxReport.stages).Count -ne 10 -or
                  @($uxReport.stages | Where-Object passed -ne $true).Count -ne 0 -or @($uxReport.errors).Count -ne 0 -or
                  @($uxReport.failedRequests).Count -ne 0 -or @($pictures).Count -lt 1 -or
                  $uxReport.failurePathCoverage.hostingGrantWithdrawal -ne $true -or $uxReport.failurePathCoverage.localConsentAndCancel -ne $true)) {
                throw 'The actual two-ended UX did not pass all ten stages and permission/consent failure paths with masked evidence.'
              }
              if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $candidateHash) { throw 'The downloaded candidate changed during local pairing acceptance.' }
              Write-Host "PASS ${mode}: every planned stage, observed zero windows, exact job cleanup and immutable candidate."
            }
          } finally {
            $finalHash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
            $context.finalCandidateSha256 = $finalHash
            $context | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence.FullName 'candidate.json') -Encoding utf8
            if ($finalHash -ne $candidateHash) { throw 'The downloaded candidate bytes changed.' }
          }

      - name: Preserve only redacted local pairing reports and masked UX screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-pairing-evidence
          path: local-data/ci-evidence/local-pairing/
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref_name, 'review/') && 1 || 7 }}

  mixed-version:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - legacy-version: '0.3.0'
            legacy-sha256: E2741B7425C497A7850BC95B5B844A4503099BF6A575484476B4A37330CDCE8E
          - legacy-version: '0.3.1'
            legacy-sha256: 5ED1EC1755855F38BAA87415A580ACF63D06FA610660D9F7A897FC22008559AA
          - legacy-version: '0.3.2'
            legacy-sha256: 638B1919D47D2CDCD02FF5A589BEE1207B7BEB8915366E8943EDF1F8EBFD2C5A
          - legacy-version: '0.3.2.1'
            legacy-sha256: FC636DB139C61CB71A3CF0CB0B9DFDB38B61E15DF9EE06B736E218B0FC78A7EE
          - legacy-version: '0.3.2.2'
            legacy-sha256: 273E97AAF0C402B84CAD4930F3D3C5DE43F8A1A87FE77608F2E3E18B9A81D265
    name: Verify ${{ matrix.legacy-version }} compatibility
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the same source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Retrieve the immutable candidate and fixtures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-candidate
          path: .

      - name: Fetch and verify the exact published legacy app
        shell: pwsh
        run: |
          $legacyVersion = '${{ matrix.legacy-version }}'
          $legacyRoot = New-Item -ItemType Directory -Path "local-data/compatibility/$legacyVersion" -Force
          $legacy = Join-Path $legacyRoot.FullName 'TogetherServer.exe'
          Invoke-WebRequest -Uri "https://github.com/daltonstates/TogetherServer/releases/download/v$legacyVersion/TogetherServer-win-x64.exe" -OutFile $legacy
          $expected = '${{ matrix.legacy-sha256 }}'
          if ((Get-FileHash -LiteralPath $legacy -Algorithm SHA256).Hash -ne $expected) { throw "Published $legacyVersion digest mismatch." }
          $parsedLegacyVersion = [Version]$legacyVersion
          $expectedLegacyFileVersion = [Version]::new($parsedLegacyVersion.Major, $parsedLegacyVersion.Minor,
            $parsedLegacyVersion.Build, [Math]::Max(0, $parsedLegacyVersion.Revision))
          if ([Version](Get-Item -LiteralPath $legacy).VersionInfo.FileVersion -ne $expectedLegacyFileVersion) { throw 'Legacy app version mismatch.' }

      - name: Test both old and new Host/Friend role directions
        shell: pwsh
        run: |
          $evidence = New-Item -ItemType Directory -Path local-data/ci-evidence/mixed-version -Force
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $legacy = (Resolve-Path 'local-data/compatibility/${{ matrix.legacy-version }}/TogetherServer.exe').Path
          dotnet run --project checks/TogetherServer.CompanionChecks/TogetherServer.CompanionChecks.csproj -c Release -- $candidate --mixed-version-journey --legacy-app-path $legacy --allow-interactive-tests 2>&1 | Tee-Object -FilePath (Join-Path $evidence.FullName 'journey.log')
          if ($LASTEXITCODE -ne 0) { throw 'Mixed-version compatibility failed.' }

      - name: Verify the published legacy app can update to this exact candidate
        shell: pwsh
        run: |
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $legacy = (Resolve-Path 'local-data/compatibility/${{ matrix.legacy-version }}/TogetherServer.exe').Path
          ./checks/update-handoff-smoke.ps1 -AppPath $candidate -LegacyAppPath $legacy -AllowInteractiveTests 2>&1 | Tee-Object -FilePath local-data/ci-evidence/mixed-version/update-handoff.log
          # The PowerShell smoke throws on failure; unlike dotnet it does not set LASTEXITCODE.

      - name: Preserve mixed-version evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mixed-version-evidence-${{ matrix.legacy-version }}
          path: local-data/ci-evidence/mixed-version/
          if-no-files-found: ignore
          retention-days: ${{ startsWith(github.ref_name, 'review/') && 1 || 7 }}

  package:
    needs: [verify, mixed-version, local-pairing]
    name: Package verified release
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the verified source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Retrieve the exact verified candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-candidate
          path: .

      - name: Install the pinned installer compiler on this dedicated runner
        shell: pwsh
        run: |
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerSetup
          if ((Get-FileHash -LiteralPath $compilerSetup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Pinned installer compiler digest mismatch.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $compilerSetup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') { throw 'Installer compiler publisher verification failed.' }
          $compilerRoot = Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6'
          $installArguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$compilerRoot`"")
          $setup = Start-Process -FilePath $compilerSetup -ArgumentList $installArguments -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or !(Test-Path -LiteralPath (Join-Path $compilerRoot 'ISCC.exe'))) { throw 'Installer compiler installation failed.' }

      - name: Build and test the installer around the verified bytes
        shell: pwsh
        run: |
          $candidate = (Resolve-Path local-data/release-candidate/TogetherServer.exe).Path
          $hashBefore = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash
          $version = [string]([xml](Get-Content src/TogetherServer/TogetherServer.csproj -Raw)).Project.PropertyGroup.Version
          if ((Get-Item -LiteralPath $candidate).VersionInfo.ProductVersion -ne "$version+$env:GITHUB_SHA") { throw 'Candidate source identity mismatch.' }
          ./scripts/build-installer.ps1 -AppPath $candidate -OutputDirectory local-data/release-assets -CompilerPath (Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6/ISCC.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          ./checks/installer-smoke.ps1 -InstallerPath local-data/release-assets/TogetherServer-Setup-win-x64.exe -ExpectedAppPath $candidate -AllowInteractiveTests
          if ($LASTEXITCODE -ne 0) { throw 'Installer acceptance failed.' }
          ./checks/installer-ui-smoke.ps1 -InstallerPath local-data/release-assets/TogetherServer-Setup-win-x64.exe -ExpectedAppPath $candidate -AllowInteractiveTests
          if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -ne $hashBefore) { throw 'Verified candidate bytes changed during packaging.' }
          Copy-Item -LiteralPath $candidate -Destination local-data/release-assets/TogetherServer-win-x64.exe
          $assets = @()
          foreach ($name in @('TogetherServer-win-x64.exe', 'TogetherServer-Setup-win-x64.exe')) {
            $file = Get-Item -LiteralPath (Join-Path 'local-data/release-assets' $name)
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath ($file.FullName + '.sha256') -Value "$hash  $name" -Encoding ascii
            $assets += @{name=$name; sha256=$hash; bytes=$file.Length; authenticode=[string](Get-AuthenticodeSignature -LiteralPath $file.FullName).Status}
          }
          @{version=$version; sourceRevision=$env:GITHUB_SHA; candidateSha256=$hashBefore.ToLowerInvariant(); assets=$assets; acceptance='All Windows verification suites, local pairing and actual Host/Friend UX, mixed-version directions, installer smoke and three actual wizard choices passed on dedicated runners.'} |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath local-data/release-assets/release-manifest.json -Encoding utf8

      - name: Preserve bounded actual installer wizard UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-ui-evidence
          path: local-data/ci-evidence/installer-ui/
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref_name, 'review/') && 1 || 7 }}

      - name: Preserve the verified portable and installer assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-assets
          path: local-data/release-assets/
