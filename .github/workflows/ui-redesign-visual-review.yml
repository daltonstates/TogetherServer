name: UI redesign visual review

on:
  push:
    branches: ['review/ui-redesign-*']
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

jobs:
  render:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out review source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize hosted evidence directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path local-data/ui-redesign-visual-review | Out-Null
          @{ status = 'preparing'; evidence = 'Hosted UI-only synthetic screenshot harness'; revision = $env:GITHUB_SHA } | ConvertTo-Json | Set-Content local-data/ui-redesign-visual-review/preparation.json
      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked UI dependencies
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check harness syntax and pure fixtures
        run: |
          node --check scripts/render-ui-redesign.mjs
          node --check scripts/ui-redesign-fixtures.mjs
          node --check scripts/ui-polish-world-review.mjs
          node --check scripts/ui-polish-access-review.mjs
          node --test scripts/ui-redesign-fixtures.test.mjs
      - name: Build bundled UI on the hosted runner
        working-directory: ui
        run: npm run build
      - name: Install Chromium from locked Playwright
        working-directory: ui
        run: npx --no-install playwright install chromium
      - name: Render actual bundled UI with synthetic fixtures
        run: node scripts/render-ui-redesign.mjs --allow-isolated-browser-tests --hosted-runner github-actions
      - name: Record hosted job outcome
        if: always()
        shell: pwsh
        env:
          REVIEW_JOB_STATUS: ${{ job.status }}
        run: |
          New-Item -ItemType Directory -Force -Path local-data/ui-redesign-visual-review | Out-Null
          @{ status = $env:REVIEW_JOB_STATUS; revision = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; renderedAcceptance = 'Requires manifest checks and visual inspection; fixture evidence only' } | ConvertTo-Json | Set-Content local-data/ui-redesign-visual-review/hosted-job.json
      - name: Collect screenshots and JSON findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-redesign-visual-review
          path: local-data/ui-redesign-visual-review/
          if-no-files-found: error
          retention-days: 7
