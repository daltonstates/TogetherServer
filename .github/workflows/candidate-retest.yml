              @($manifest.cases | Where-Object status -notin @('captured', 'captured-intentional-error-state')).Count -ne 0 -or
              $manifest.summary.failed -ne 0 -or $manifest.summary.skipped -ne 0 -or $manifest.summary.layoutFindings -ne 0 -or
              @($manifest.fatalErrors).Count -ne 0) { throw 'Hosting capture identity or complete 108-case coverage differs.' }

      - name: Verify every immutable artifact file after hosted verification
        if: always()
