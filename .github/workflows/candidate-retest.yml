              $destination = (New-Item -ItemType Directory -Path (Join-Path $evidence $label) -Force).FullName
              # Fixed report fields only; app paths, credentials and synthetic
              # world contents are never included in retained evidence.
              $safe = $report | Select-Object schema,kind,durationMs,stages,failed,failedCheck,failedJsonLine,failedJsonByte,
                cleanup,sourceVersionHash,sourceVersionNumber,descendantVersionHash,descendantVersionNumber,
                friendStartAttempts,ownerStartAttempts,latestReviewDiagnostic,acceptance
              $safe | Add-Member -NotePropertyName friendStartObservations -NotePropertyValue @($report.friendStartObservations |
                Select-Object attempt,resultCode,statusCode,allowed,consented,readyForManualStart,running,
                  selectedLocalMatches,selectedBranchMatches,preparationRepeated)
              $safe | Add-Member -NotePropertyName processIdentityObservations -NotePropertyValue @($report.processIdentityObservations |
                Select-Object role,state,recordedIdentityMatches,queryAvailable)
              $safe | ConvertTo-Json -Depth 12 | Set-Content (Join-Path $destination 'report.json') -Encoding utf8
              $entry.failureCategory = $report.failed
              $entry.passed = $entry.exitCode -eq 0 -and $report.schema -eq 1 -and $report.kind -ceq 'HostedSimpleSharedHosting' -and
                $null -eq $report.failed -and $report.cleanup.jobEmpty -eq $true -and
                @($report.stages).Count -eq 9 -and (@($report.stages) -join '|') -ceq ($expected -join '|') -and
                $report.sourceVersionNumber -eq 2 -and $report.descendantVersionNumber -eq 3 -and
                $report.sourceVersionHash -cmatch '^[0-9A-F]{64}$' -and $report.descendantVersionHash -cmatch '^[0-9A-F]{64}$' -and
                $report.sourceVersionHash -cne $report.descendantVersionHash -and
                $report.friendStartAttempts -ge 1 -and $report.ownerStartAttempts -ge 1
              if ($entry.passed -and $diagnostic) { Write-Host "PASS DIAGNOSTIC ${label}: separate nine-stage evidence only." }
              elseif ($entry.passed) { Write-Host "PASS ORDINARY ${label}: all nine stages, descendant and exact cleanup." }
              else { Write-Host "FAIL ${label}: retain this attempt's fixed report; no retry changes its outcome." }
            } catch {
              $entry.failureCategory = $_.Exception.GetType().Name
              Write-Host "FAIL ${label}: bounded harness/report verification failed; retain the independent outcome."
            } finally {
              $results.Add([pscustomobject]$entry)
              if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:CANDIDATE_SHA256) {
                throw 'Automatic hosting changed the immutable candidate; no further attempt is allowed.'
              }
            }
          }

          try {
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              Invoke-HostedHandoff -label "ordinary-$attempt" -diagnostic $false
            }
            $ordinary = @($results | Where-Object diagnostic -eq $false)
            $ordinaryFailed = @($ordinary | Where-Object passed -ne $true)
            if ($ordinaryFailed.Count -gt 0) {
              Invoke-HostedHandoff -label 'diagnostic-after-ordinary-failure' -diagnostic $true
            }
          } finally {
            $ordinary = @($results | Where-Object diagnostic -eq $false)
            $ordinaryFailed = @($ordinary | Where-Object passed -ne $true)
            @{sourceRevision=$env:CANDIDATE_SOURCE;verificationRevision=$env:GITHUB_SHA;candidateRunId=$env:CANDIDATE_RUN_ID;
              candidateArtifactId=$env:CANDIDATE_ARTIFACT_ID;candidateSha256=$env:CANDIDATE_SHA256;
              expectedOrdinaryRuns=2;ordinaryRuns=$ordinary.Count;ordinaryPassed=@($ordinary | Where-Object passed -eq $true).Count;
              ordinaryFailed=$ordinaryFailed.Count;diagnosticIsSeparateEvidence=$true;attempts=@($results.ToArray());
              fullyAccepted=$false;nativeNotificationVerified=$false} |
              ConvertTo-Json -Depth 8 | Set-Content (Join-Path $evidence 'attempt-summary.json') -Encoding utf8
            $env:TOGETHERSERVER_LAB_LATEST_DIAGNOSTICS = '0'
          }
          if ($ordinary.Count -ne 2 -or $ordinaryFailed.Count -ne 0) {
            throw 'An ordinary automatic-hosting journey failed; diagnostic results cannot replace either required ordinary pass.'
          }

      - name: Verify every immutable artifact file after hosted verification
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = "local-data/ci-evidence/candidate-retest-$env:GITHUB_JOB"
          $inventory = Get-Content (Join-Path $proof 'immutable-files.json') -Raw | ConvertFrom-Json
          $actual = @(foreach ($root in $inventory.roots) {
            foreach ($file in @(Get-ChildItem -LiteralPath $root -Recurse -File -Force)) {
              if (($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'An immutable artifact became linked.' }
              [IO.Path]::GetRelativePath((Get-Location).Path,$file.FullName).Replace('\','/')
            }
          })
          if ($actual.Count -ne @($inventory.files).Count -or @($actual | Select-Object -Unique).Count -ne $actual.Count -or
              @($actual | Where-Object { $_ -cnotin $inventory.files.path }).Count -ne 0) { throw 'The immutable artifact file inventory changed.' }
          foreach ($expected in $inventory.files) {
            $file = Get-Item -LiteralPath $expected.path
            if ($file.Length -ne $expected.sizeBytes -or
                (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected.sha256) {
              throw 'A candidate, original proof, embedded UI or fixture byte changed.'
            }
          }
          if ((Get-Item local-data/release-candidate/TogetherServer.exe).VersionInfo.ProductVersion -cne $env:CANDIDATE_PRODUCT_VERSION -or
              (Get-FileHash local-data/release-candidate/TogetherServer.exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:CANDIDATE_SHA256) {
            throw 'The immutable candidate identity changed.'
          }
          @{sourceRevision=$env:CANDIDATE_SOURCE;verificationRevision=$env:GITHUB_SHA;candidateRunId=$env:CANDIDATE_RUN_ID;
            candidateSha256=$env:CANDIDATE_SHA256;unchanged=$true;verifiedFileCount=$actual.Count;rebuilt=$false;
            fullyAccepted=$false;nativeNotificationVerified=$false} |
            ConvertTo-Json | Set-Content (Join-Path $proof 'final-immutable-files.json') -Encoding utf8

      - name: Preserve both ordinary outcomes and separate diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-retest-automatic-shared-hosting
          path: |
            local-data/ci-evidence/automatic-shared-hosting/
            local-data/ci-evidence/candidate-retest-shared-hosting/
          if-no-files-found: error
          retention-days: 7


