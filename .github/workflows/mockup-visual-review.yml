name: Mockup visual review

on:
  push:
    branches: ['review/ui-mockups-*']

permissions:
  contents: read

jobs:
  render:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out synthetic review source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked review dependencies
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the locked Chromium renderer
        working-directory: ui
        run: npx --no-install playwright install chromium
      - name: Render mockups on this isolated runner
        run: node docs/mockups/render-atlas.mjs --allow-isolated-browser-tests
      - name: Collect screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mockup-visual-review
          path: local-data/mockup-visual-review/
          if-no-files-found: error
          retention-days: 7
