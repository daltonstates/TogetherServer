        panel.innerHTML = `<div class="ts-catalog-summary"><strong>${catalog.pages.length} pages · ${catalog.dialogs.length} dialogs and confirmations</strong><span>${catalog.coverage.length} source mappings</span></div>${Object.entries(areas).map(([area,label]) => { const group = entries.filter(entry => entry.area === area); return group.length ? `<h3>${escape(label)}</h3><div class="ts-catalog-list">${group.map(entry => `<button type="button" ${pages.has(entry.id) ? 'data-page' : 'data-dialog'}="${escape(entry.id)}"><span>${escape(entry.title)}</span><small>${entry.kind} · ${(entry.states || ['normal']).length} review states</small></button>`).join('')}</div>` : ''; }).join('')}`;
        root.querySelector('[data-review="catalog"]').setAttribute('aria-expanded',String(ui.catalogOpen));
      };
      root.addEventListener('click',event => {
        const control = event.target.closest('button'); if (!control || !root.contains(control) || control.disabled) return;
        if (control.dataset.review === 'catalog') { ui.catalogOpen = !ui.catalogOpen; renderCatalog(); return; }
        if (control.dataset.page) return navigate(control.dataset.workspace === 'app' ? 'app-appearance' : control.dataset.page);
        if (control.dataset.dialog) return openDialog(control.dataset.dialog,control,control.dataset.variant);

      root.addEventListener('change',event => {
        const control = event.target;

        if (control.dataset.mockfield) ui.fields.set(control.dataset.mockfield, control.type === 'checkbox' || control.type === 'radio' ? control.checked : control.value);
        if (ui.dialog) acknowledgements();
        if (review === 'screen') {
          const selected = control.value;
          if (pages.has(selected)) navigate(selected);
          else { const dialog = dialogs.get(selected); const area = dialog.area; const target = area === 'host' || area === 'host-pc' ? ui.lastHost : area === 'app' ? 'app-appearance' : area === 'attention' ? 'attention-current' : 'join-shared'; navigate(pages.has(target) ? target : catalog.pages[0].id); openDialog(selected); }

        if (appearance === 'density') { ui.density = control.value; root.dataset.density = ui.density; }
        if (appearance === 'contrast') root.dataset.contrast = String(control.checked);
        if (review === 'width') { ui.width = control.value; root.querySelector('.ts-preview-stage').dataset.width = ui.width; renderDialog(); }

        if (control.hasAttribute('data-host-selector')) { clearPending(); ui.connection = control.value; renderPage(); }
        if (control.hasAttribute('data-room-selector')) { clearPending(); ui.roomServer = control.value; renderPage(); }

      });
      root.addEventListener('input',event => {
        const control = event.target;
        if (!(control instanceof HTMLInputElement || control instanceof HTMLTextAreaElement)) return;
        if (control.dataset.mockfield) ui.fields.set(control.dataset.mockfield,control.value);
        if (control.hasAttribute('data-command-search')) overlay.querySelectorAll('[data-command-list] button').forEach(button => { button.hidden = !button.textContent.toLowerCase().includes(control.value.toLowerCase()); });
        if (control.dataset.filter) {
          const scope = control.closest('.ts-dialog-body') || control.closest('.ts-content');
          scope?.querySelectorAll('tbody tr, [data-filter-item]').forEach(item => { item.hidden = !item.textContent.toLowerCase().includes(control.value.toLowerCase()); });
        }
      });
      root.addEventListener('keydown',event => {
        if (event.key === 'Escape') { if (ui.dialog) { event.preventDefault(); closeDialog(); } return; }
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); openDialog('command-palette'); return; }
        if (event.altKey && ['1','2','3','4'].includes(event.key)) { event.preventDefault(); navigate([ui.lastHost,ui.lastJoin,ui.lastAttention,'app-appearance'][Number(event.key) - 1]); return; }

          const focusable = Array.from(overlay.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')).filter(control => !control.hidden && !control.closest('[hidden]'));

      if (catalog.offline) {
        const tooltip = document.createElement('div'); tooltip.className = 'ts-tooltip-fallback'; tooltip.setAttribute('role','tooltip'); tooltip.hidden = true; root.append(tooltip);
        const showTip = target => {

        root.style.position = 'relative';
        root.addEventListener('pointerover',event => showTip(event.target)); root.addEventListener('focusin',event => showTip(event.target));
        root.addEventListener('pointerout',() => { tooltip.hidden = true; }); root.addEventListener('focusout',() => { tooltip.hidden = true; });
      }
      window.addEventListener('blur',hideSecrets);
      const observer = typeof ResizeObserver === 'function' ? new ResizeObserver(() => { if (ui.dialog) { const height = overlay.querySelector('.ts-dialog')?.getBoundingClientRect().height; if (height) product.style.minBlockSize = `${height + (ui.width === 'narrow' ? 40 : 90)}px`; } }) : null;
      observer?.observe(product);

      const root = document.getElementById('ts-ui-atlas');
      if (root) { root.dataset.ready = 'error'; root.querySelector('[data-product-body]').textContent = 'The preview could not load. Open it in a current browser.'; }
    });
  </script>
